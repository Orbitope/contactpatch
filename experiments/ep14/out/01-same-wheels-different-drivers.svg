enlo, monospace">+213</text><text x="1246.7" y="660.0" fill="#4aa8a0" font-size="13" text-anchor="middle" font-weight="600" font-style="normal">seed 2 — D6 PASSED</text><line x1="60.0" y1="660.0" x2="1440.0" y2="660.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="694.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Arrow length is longitudinal force at the contact patch, one scale across all three cars; teal pushes forward, coral drags back. Contact-patch</text><text x="60.0" y="714.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">shading is friction-ellipse utilisation at that instant, hypot(Fx/Fx_peak, Fy/Fy_peak) — the same measure regardless of whether a human or a policy</text><text x="60.0" y="734.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">chose the forces.</text><text x="40.0" y="860.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] production run, 3 seeds/variant, 5,000,000 steps each · RUNG 2 — mechanism and ordering only, not a real car (rule 15)</text><text x="40" y="882" fill="#6f6a63" font-size="11" font-style="italic">The classical panel has no seed and no D6 verdict — it is not a trained policy.</text></svg>