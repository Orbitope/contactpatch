" text-anchor="end">1.5</text><text x="90" y="134" fill="#6f6a63" font-size="11" text-anchor="end">2.0</text><text x="335.0" y="516" fill="#e8e4dd" font-size="12.5" text-anchor="middle">lateral acceleration (g)</text><text x="42" y="300.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 42 300.0)">steer − Ackermann (deg)</text><path d="M 136.3,469.5 L 140.0,469.2 L 143.9,468.9 L 148.0,468.7 L 152.3,468.4 L 156.7,468.1 L 161.4,467.7 L 166.2,467.4 L 171.2,467.1 L 176.3,466.7 L 181.7,466.4 L 187.2,466.0 L 192.9,465.6 L 198.8,465.2 L 204.9,464.8 L 211.2,464.3 L 217.6,463.9 L 224.3,463.4 L 231.1,462.9 L 238.1,462.4 L 245.2,461.8 L 252.6,461.2 L 260.1,460.6 L 267.8,460.0 L 275.7,459.3 L 283.8,458.6 L 292.1,457.9 L 300.5,457.1 L 309.1,456.2 L 317.9,455.3 L 326.9,454.3 L 336.1,453.2 L 345.4,452.0 L 355.0,450.6 L 364.7,449.2 L 374.6,447.5 L 384.7,445.6 L 394.9,443.5 L 405.4,441.1 L 416.0,438.2 L 426.8,434.8 L 437.8,430.7 L 448.9,425.8 L 460.3,419.5 L 471.8,411.4 L 483.5,400.5 L 495.4,385.2 L 507.5,362.1 L 519.7,322.6 L 532.2,235.8" fill="none" stroke="#e2614a" stroke-width="2.5"/><path d="M 100.0,470.0 L 313.6,454.1" fill="none" stroke="#e0a53c" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="313.6" y1="130" x2="313.6" y2="470" stroke="#6f6a63" stroke-width="1" stroke-dasharray="3 5"/><text x="319.6" y="144.0" fill="#6f6a63" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">fit window ends</text><text x="114.0" y="152.0" fill="#e0a53c" font-size="13" text-anchor="start" font-weight="600" font-style="normal">K = 0.187 deg/g</text><text x="114.0" y="170.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">slope of the dashed line</text><text x="562.0" y="458.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">steepens sharply at the limit</text><text x="660.0" y="112.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">B · Which axle is working harder</text><line x1="728" y1="130" x2="728" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="796" y1="130" x2="796" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="864" y1="130" x2="864" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="932" y1="130" x2="932" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="660" y1="243" x2="1000" y2="243" stroke="#2e2e31" stroke-width="1"/><line x1="660" y1="357" x2="1000" y2="357" stroke="#2e2e31" stroke-width="1"/><line x1="660" y1="470" x2="1000" y2="470" stroke="#6f6a63" stroke-width="1"/><line x1="660" y1="130" x2="660" y2="470" stroke="#6f6a63" stroke-width="1"/><text x="660" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0.0</text><text x="815" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0.5</text><text x="969" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">1.0</text><text x="650" y="474" fill="#6f6a63" font-size="11" text-anchor="end">0</text><text x="650" y="361" fill="#6f6a63" font-size="11" text-anchor="end">3</text><text x="650" y="247" fill="#6f6a63" font-size="11" text-anchor="end">6</text><text x="650" y="134" fill="#6f6a63" font-size="11" text-anchor="end">9</text><text x="830.0" y="516" fill="#e8e4dd" font-size="12.5" text-anchor="middle">lateral acceleration (g)</text><text x="602" y="300.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 602 300.0)">slip angle (deg)</text><path d="M 686.3,459.8 L 689.0,458.7 L 691.8,457.6 L 694.7,456.5 L 697.8,455.3 L 701.0,454.0 L 704.4,452.7 L 707.9,451.3 L 711.5,449.9 L 715.2,448.4 L 719.1,446.8 L 723.1,445.2 L 727.2,443.5 L 731.5,441.8 L 735.9,440.0 L 740.4,438.1 L 745.1,436.2 L 749.9,434.2 L 754.8,432.1 L 759.9,429.9 L 765.1,427.7 L 770.4,425.4 L 775.8,423.0 L 781.4,420.4 L 787.1,417.8 L 793.0,415.1 L 798.9,412.3 L 805.1,409.3 L 811.3,406.2 L 817.7,403.0 L 824.2,399.6 L 830.8,396.1 L 837.6,392.3 L 844.4,388.4 L 851.5,384.2 L 858.6,379.7 L 865.9,375.0 L 873.3,370.0 L 880.9,364.5 L 888.6,358.6 L 896.4,352.2 L 904.3,345.1 L 912.4,337.3 L 920.6,328.4 L 929.0,318.3 L 937.4,306.5 L 946.0,292.2 L 954.8,274.1 L 963.6,249.2 L 972.6,207.7" fill="none" stroke="#e0a53c" stroke-width="2.5"/><text x="994.0" y="199.7" fill="#e0a53c" font-size="11.5" text-anchor="end" font-weight="normal" font-style="normal">front</text><path d="M 686.3,460.3 L 689.0,459.3 L 691.8,458.2 L 694.7,457.1 L 697.8,456.0 L 701.0,454.8 L 704.4,453.5 L 707.9,452.2 L 711.5,450.8 L 715.2,449.4 L 719.1,447.9 L 723.1,446.4 L 727.2,444.8 L 731.5,443.2 L 735.9,441.4 L 740.4,439.7 L 745.1,437.8 L 749.9,435.9 L 754.8,433.9 L 759.9,431.9 L 765.1,429.7 L 770.4,427.5 L 775.8,425.2 L 781.4,422.9 L 787.1,420.4 L 793.0,417.8 L 798.9,415.1 L 805.1,412.4 L 811.3,409.4 L 817.7,406.4 L 824.2,403.2 L 830.8,399.9 L 837.6,396.4 L 844.4,392.8 L 851.5,388.9 L 858.6,384.9 L 865.9,380.5 L 873.3,376.0 L 880.9,371.0 L 888.6,365.8 L 896.4,360.1 L 904.3,354.0 L 912.4,347.3 L 920.6,339.8 L 929.0,331.6 L 937.4,322.2 L 946.0,311.4 L 954.8,298.5 L 963.6,282.4 L 972.6,260.4" fill="none" stroke="#4aa8a0" stroke-width="2.5"/><text x="994.0" y="252.4" fill="#4aa8a0" font-size="11.5" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="672.0" y="456.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">the gap between them is the understeer</text><text x="1090.0" y="112.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">C · Where the weight sits</text><line x1="1172" y1="130" x2="1172" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1255" y1="130" x2="1255" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1338" y1="130" x2="1338" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1090" y1="243" x2="1420" y2="243" stroke="#2e2e31" stroke-width="1"/><line x1="1090" y1="357" x2="1420" y2="357" stroke="#2e2e31" stroke-width="1"/><line x1="1090" y1="470" x2="1420" y2="470" stroke="#6f6a63" stroke-width="1"/><line x1="1090" y1="130" x2="1090" y2="470" stroke="#6f6a63" stroke-width="1"/><text x="1118" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0.42</text><text x="1228" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0.50</text><text x="1338" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0.58</text><text x="1080" y="474" fill="#6f6a63" font-size="11" text-anchor="end">-1</text><text x="1080" y="361" fill="#6f6a63" font-size="11" text-anchor="end">+0</text><text x="1080" y="247" fill="#6f6a63" font-size="11" text-anchor="end">+1</text><text x="1080" y="134" fill="#6f6a63" font-size="11" text-anchor="end">+2</text><text x="1255.0" y="516" fill="#e8e4dd" font-size="12.5" text-anchor="middle">fraction of weight on the front</text><text x="1032" y="300.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 1032 300.0)">K (deg/g)</text><rect x="1090" y="130.0" width="330" height="22.7" fill="#7fa86a" opacity="0.18"/><text x="1100.0" y="145.3" fill="#7fa86a" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">real road cars start here</text><line x1="1090" y1="356.7" x2="1420" y2="356.7" stroke="#6f6a63" stroke-width="1" stroke-dasharray="3 4"/><text x="1414.0" y="348.7" fill="#6f6a63" font-size="10" text-anchor="end" font-weight="normal" font-style="normal">neutral</text><path d="M 1117.5,395.2 L 1172.5,375.2 L 1227.5,355.3 L 1282.5,335.4 L 1337.5,315.6 L 1392.5,295.7" fill="none" stroke="#8a7bd8" stroke-width="2.5"/><circle cx="1117.5" cy="395.2" r="3.5" fill="#8a7bd8"/><circle cx="1172.5" cy="375.2" r="3.5" fill="#8a7bd8"/><circle cx="1227.5" cy="355.3" r="3.5" fill="#8a7bd8"/><circle cx="1282.5" cy="335.4" r="3.5" fill="#8a7bd8"/><circle cx="1337.5" cy="315.6" r="3.5" fill="#8a7bd8"/><circle cx="1392.5" cy="295.7" r="3.5" fill="#8a7bd8"/><circle cx="1282.5" cy="335.4" r="6" fill="none" stroke="#e0a53c" stroke-width="2"/><text x="1292.5" y="339.4" fill="#e0a53c" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">RV-1</text><text x="1100.0" y="456.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">the whole sweep stays below the road-car band</text><text x="100.0" y="520.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Cornering compliance: front 3.16 deg/g, rear 3.01 deg/g. K is the difference — +0.15 analytically against +0.187 measured. With identical tires at both ends those two numbers nearly cancel, which is why a bicycle model is nearly neutral.</text><text x="100.0" y="542.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">A real car gets most of its understeer from lateral load transfer, compliance steer, roll camber and roll steer — none of which a two-wheeled model has. Episode 5 measures how much of that gap the double-track model closes.</text><text x="40.0" y="580.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model + Sedan_Pac02Tire.tir  ·  offsets removed  ·  m 1360 kg · L 2.575 m · 54% front · h 0.460 m  ·  [SOURCED] RV-1 parameters, vehicle-reference-parameters.md §1  ·  radius 30 m [ASSUMED]  ·  K fitted over |a_y| ≤ 0.5 g [SOURCED definition]  ·  road-car band [SOURCED] §4</text><text x="40" y="602" fill="#6f6a63" font-size="11" font-style="italic">Steady-state equilibria solved directly, not simulated. D2 checks that the solver and the step-by-step integrator agree to machine precision.</text></svg>