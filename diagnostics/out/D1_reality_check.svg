-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.63 </text><text x="1202.0" y="396.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">inside the published range</text><text x="60.0" y="450.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Understeer gradient</text><text x="60.0" y="470.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">Sports car 1-2, passenger car 3-5 deg/g · vehicle-reference-parameters.md §4 [SOURCED]</text><rect x="620" y="435" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="760.0" y="435.0" width="140.0" height="22" rx="3" fill="#4aa8a0" opacity="0.45"/><text x="760.0" y="476.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.5</text><text x="900.0" y="476.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="1202.0" y="451.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">not measurable until the car exists</text><text x="60.0" y="524.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Step-steer yaw rise time</text><text x="60.0" y="544.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">vehicle-reference-parameters.md §4 [ASSUMED]</text><rect x="620" y="509" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="709.6" y="509.0" width="246.4" height="22" rx="3" fill="#4aa8a0" opacity="0.45"/><text x="709.6" y="550.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.08</text><text x="956.0" y="550.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.3</text><text x="1202.0" y="525.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">not measurable until the car exists</text><text x="60.0" y="598.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Lap time gained from torque vectoring</text><text x="60.0" y="618.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">Published studies; 9% is the best case, an FSAE car on a skidpad · result-evaluation-guide.md Gate 2 [SOURCED]</text><rect x="620" y="583" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="676.0" y="583.0" width="168.0" height="22" rx="3" fill="#4aa8a0" opacity="0.45"/><text x="676.0" y="624.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="844.0" y="624.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="1202.0" y="599.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">not measurable until the car exists</text><text x="40.0" y="658.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED] / [DERIVED] bands as labelled per row  ·  [MEASURED] values from Sedan_Pac02Tire.tir, offsets removed, unscaled  ·  see FINDINGS.md O5 for the two bands still awaiting a citation</text><text x="40" y="680" fill="#6f6a63" font-size="11" font-style="italic">Bands are quoted ranges, not tolerances — sitting inside one is evidence, not proof. The real external test is Episode 16, where three design points get re-run in Project Chrono and we compare trend direction.</text></svg>