<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" font-family="Inter, system-ui, sans-serif"><rect width="1180" height="530" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What a policy is</text><text x="40" y="70" fill="#6f6a63" font-size="13">A rule that turns what the car senses into what the car does — plus the one arrow that makes it learning rather than programming.</text><rect x="70" y="150" width="270" height="190" rx="8" fill="none" stroke="#7f8ea3" stroke-width="1.6"/><text x="205.0" y="138.0" fill="#7f8ea3" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">what the car senses</text><text x="90.0" y="180.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">speed</text><text x="90.0" y="203.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">distance off centreline</text><text x="90.0" y="226.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">heading vs road</text><text x="90.0" y="249.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">yaw rate</text><text x="90.0" y="272.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">sideslip</text><text x="90.0" y="295.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">steering angle</text><text x="90.0" y="318.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">curvature ahead (~2 s)</text><rect x="450" y="185" width="260" height="120" rx="8" fill="#4aa8a0" opacity="0.14"/><rect x="450" y="185" width="260" height="120" rx="8" fill="none" stroke="#4aa8a0" stroke-width="2"/><text x="580.0" y="228.0" fill="#4aa8a0" font-size="15" text-anchor="middle" font-weight="700" font-style="normal">the policy</text><text x="580.0" y="250.0" fill="#e8e4dd" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal">a small neural network,</text><text x="580.0" y="268.0" fill="#e8e4dd" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal">5,124 numbers, none written by hand</text><rect x="820" y="195" width="240" height="100" rx="8" fill="none" stroke="#7f8ea3" stroke-width="1.6"/><text x="940.0" y="183.0" fill="#7f8ea3" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">what the car does</text><text x="845.0" y="228.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">steering rate</text><text x="845.0" y="254.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">throttle / brake</text><g opacity="1.0"><line x1="340.0" y1="245.0" x2="440.4" y2="245.0" stroke="#e8e4dd" stroke-width="2.2" stroke-linecap="round"/><polygon points="448.0,245.0 439.0,241.2 439.0,248.8" fill="#e8e4dd"/></g><g opacity="1.0"><line x1="710.0" y1="245.0" x2="810.4" y2="245.0" stroke="#e8e4dd" stroke-width="2.2" stroke-linecap="round"/><polygon points="818.0,245.0 809.0,241.2 809.0,248.8" fill="#e8e4dd"/></g><text x="394.0" y="233.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">50×/s</text><path d="M 940,300 L 940,392 L 580,392 L 580,308" fill="none" stroke="#e0a53c" stroke-width="2" stroke-dasharray="6 5"/><g opacity="1.0"><line x1="580.0" y1="388.0" x2="580.0" y2="312.8" stroke="#e0a53c" stroke-width="2.0" stroke-linecap="round"/><polygon points="580.0,306.0 576.6,314.0 583.4,314.0" fill="#e0a53c"/></g><text x="760.0" y="412.0" fill="#e0a53c" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">after each attempt: nudge the 5,124 numbers in whichever direction made the last stretch of road go better</text><text x="760.0" y="432.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">that nudging is the whole of training — there is no other instruction anywhere</text><text x="40.0" y="508.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] PPO on the double-track model, 1,200,000 steps  -  seed 0  -  std init [-2.5, -1.0]  -  [ASSUMED] reward = progress only; slip envelope NOT enforced  -  obs/actions from rl_env.py; 5,124 params from policy.pt</text></svg>