<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1200" viewBox="0 0 1480 1200" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="1200" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Why weight transfer costs grip</text><text x="40" y="70" fill="#6f6a63" font-size="13">Two tires, 6 kN of weight between them — that never changes. All that changes is how the weight is shared. The shaded band across each tire is its contact patch: more weight, more squash.</text><text x="150.0" y="255.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">3 kN + 3 kN</text><text x="150.0" y="276.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">shared evenly</text><g transform="rotate(0.00 430.0 250.0)"><rect x="417.0" y="218.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="421.3" y="231.1" width="17.4" height="37.9" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="425.1" y1="223.0" x2="425.1" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="430.0" y1="223.0" x2="430.0" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="434.9" y1="223.0" x2="434.9" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="430.0" y="302.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 kN</text><g opacity="1.0"><line x1="446.0" y1="250.0" x2="551.3" y2="250.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="560.6,250.0 549.6,245.4 549.6,254.6" fill="#e2614a"/></g><text x="566.6" y="241.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3,275 N</text><g transform="rotate(0.00 700.0 250.0)"><rect x="687.0" y="218.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="691.3" y="231.1" width="17.4" height="37.9" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="695.0" y1="223.0" x2="695.0" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="700.0" y1="223.0" x2="700.0" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="705.0" y1="223.0" x2="705.0" y2="277.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="700.0" y="302.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 kN</text><g opacity="1.0"><line x1="716.0" y1="250.0" x2="821.3" y2="250.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="830.6,250.0 819.6,245.4 819.6,254.6" fill="#e2614a"/></g><text x="836.6" y="241.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3,275 N</text><line x1="1130.0" y1="220.0" x2="1400.0" y2="220.0" stroke="#2e2e31" stroke-width="1.0"/><text x="1400.0" y="252.0" fill="#7fa86a" font-size="17" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6,549 N</text><text x="1400.0" y="274.0" fill="#7fa86a" font-size="12" text-anchor="end" font-weight="normal" font-style="normal">the most this pair can make</text><text x="150.0" y="455.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">4 kN + 2 kN</text><text x="150.0" y="476.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">2 kN moved across</text><g transform="rotate(0.00 430.0 450.0)"><rect x="417.0" y="418.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="422.2" y="435.0" width="15.6" height="30.0" rx="6.6" fill="#7f8ea3" opacity="0.9"/><line x1="425.1" y1="423.0" x2="425.1" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="430.0" y1="423.0" x2="430.0" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="434.9" y1="423.0" x2="434.9" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="430.0" y="502.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2 kN</text><g opacity="1.0"><line x1="446.0" y1="450.0" x2="516.3" y2="450.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="525.6,450.0 514.6,445.4 514.6,454.6" fill="#e2614a"/></g><text x="531.6" y="441.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2,275 N</text><g transform="rotate(0.00 700.0 450.0)"><rect x="687.0" y="418.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="690.4" y="427.1" width="19.1" height="45.8" rx="8.0" fill="#7f8ea3" opacity="0.9"/><line x1="695.0" y1="423.0" x2="695.0" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="700.0" y1="423.0" x2="700.0" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="705.0" y1="423.0" x2="705.0" y2="477.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="700.0" y="502.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4 kN</text><g opacity="1.0"><line x1="716.0" y1="450.0" x2="853.1" y2="450.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="862.4,450.0 851.4,445.4 851.4,454.6" fill="#e2614a"/></g><text x="868.4" y="441.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4,182 N</text><line x1="1130.0" y1="420.0" x2="1400.0" y2="420.0" stroke="#2e2e31" stroke-width="1.0"/><text x="1400.0" y="452.0" fill="#e2614a" font-size="17" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6,457 N</text><text x="1400.0" y="474.0" fill="#e2614a" font-size="12" text-anchor="end" font-weight="normal" font-style="normal">-1.4%</text><text x="150.0" y="655.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">5 kN + 1 kN</text><text x="150.0" y="676.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">4 kN moved across</text><g transform="rotate(0.00 430.0 650.0)"><rect x="417.0" y="618.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="423.1" y="639.0" width="13.9" height="22.0" rx="5.8" fill="#7f8ea3" opacity="0.9"/><line x1="425.1" y1="623.0" x2="425.1" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="430.0" y1="623.0" x2="430.0" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="434.9" y1="623.0" x2="434.9" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="430.0" y="702.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 kN</text><g opacity="1.0"><line x1="446.0" y1="650.0" x2="478.1" y2="650.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="487.4,650.0 476.4,645.4 476.4,654.6" fill="#e2614a"/></g><text x="493.4" y="641.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1,183 N</text><g transform="rotate(0.00 700.0 650.0)"><rect x="687.0" y="618.0" width="26" height="64" rx="7.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="689.5" y="623.1" width="20.9" height="53.8" rx="8.8" fill="#7f8ea3" opacity="0.9"/><line x1="695.0" y1="623.0" x2="695.0" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="700.0" y1="623.0" x2="700.0" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="705.0" y1="623.0" x2="705.0" y2="677.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="700.0" y="702.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5 kN</text><g opacity="1.0"><line x1="716.0" y1="650.0" x2="881.6" y2="650.0" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="891.0,650.0 880.0,645.4 880.0,654.6" fill="#e2614a"/></g><text x="897.0" y="641.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4,999 N</text><line x1="1130.0" y1="620.0" x2="1400.0" y2="620.0" stroke="#2e2e31" stroke-width="1.0"/><text x="1400.0" y="652.0" fill="#e2614a" font-size="17" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6,182 N</text><text x="1400.0" y="674.0" fill="#e2614a" font-size="12" text-anchor="end" font-weight="normal" font-style="normal">-5.6%</text><line x1="150.0" y1="800.0" x2="1400.0" y2="800.0" stroke="#2e2e31" stroke-width="1.0"/><text x="150.0" y="852.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Where the uneven split comes from</text><text x="150.0" y="871.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">A car in a left turn throws its weight onto the right-hand wheels. That is the same picture as the bottom row above, happening to a real car.</text><rect x="290" y="908" width="100" height="168" rx="28" fill="none" stroke="#6f6a63" stroke-width="1.6"/><text x="340.0" y="996.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">car</text><g transform="rotate(0.00 273.0 944.0)"><rect x="263.5" y="920.0" width="19" height="48" rx="5.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="268.2" y="935.4" width="9.6" height="17.1" rx="4.0" fill="#7f8ea3" opacity="0.9"/><line x1="270.0" y1="925.0" x2="270.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="273.0" y1="925.0" x2="273.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="276.0" y1="925.0" x2="276.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 407.0 944.0)"><rect x="397.5" y="920.0" width="19" height="48" rx="5.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="400.0" y="924.6" width="14.0" height="38.8" rx="5.9" fill="#7f8ea3" opacity="0.9"/><line x1="404.0" y1="925.0" x2="404.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="407.0" y1="925.0" x2="407.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="410.0" y1="925.0" x2="410.0" y2="963.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 273.0 1040.0)"><rect x="263.5" y="1016.0" width="19" height="48" rx="5.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="268.2" y="1031.1" width="9.7" height="17.7" rx="4.1" fill="#7f8ea3" opacity="0.9"/><line x1="270.0" y1="1021.0" x2="270.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="273.0" y1="1021.0" x2="273.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="276.0" y1="1021.0" x2="276.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 407.0 1040.0)"><rect x="397.5" y="1016.0" width="19" height="48" rx="5.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="400.1" y="1021.0" width="13.8" height="37.9" rx="5.8" fill="#7f8ea3" opacity="0.9"/><line x1="404.0" y1="1021.0" x2="404.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="407.0" y1="1021.0" x2="407.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="410.0" y1="1021.0" x2="410.0" y2="1059.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="246.0" y="948.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">inside wheels</text><text x="246.0" y="964.0" fill="#4aa8a0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">unloaded</text><text x="434.0" y="948.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">outside wheels</text><text x="434.0" y="964.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">squashed</text><g opacity="1.0"><line x1="306.0" y1="1116.0" x2="376.6" y2="1116.0" stroke="#8a7bd8" stroke-width="2.8" stroke-linecap="round"/><polygon points="386.0,1116.0 375.0,1111.4 375.0,1120.6" fill="#8a7bd8"/></g><text x="398.0" y="1120.0" fill="#8a7bd8" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">weight moves this way in a left turn</text><text x="700.0" y="914.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Cornering does not remove weight from the car. It moves it.</text><text x="700.0" y="944.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">And moving it is expensive, because the tire you press harder gives back</text><text x="700.0" y="966.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">less than the tire you unload gives up. That is the whole cost, and it is</text><text x="700.0" y="988.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">why a lower car corners better, why anti-roll bars change the way a car</text><text x="700.0" y="1010.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">handles, and why every racing engineer cares where the weight sits.</text><text x="700.0" y="1032.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="700.0" y="1054.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Nothing here involves the driver, the engine, or the road surface. It is</text><text x="700.0" y="1076.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">a property of rubber.</text><text x="40.0" y="1160.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] Sedan_Pac02Tire.tir  ·  MF 2002 pure slip  ·  offsets removed  ·  Fz0′ 3929 N  ·  LMUY 1 · LKY 1 · LFZO 0.81  ·  loads are illustrative round numbers [ASSUMED]; forces are the model's peak lateral force at each load</text><text x="40" y="1182" fill="#6f6a63" font-size="11" font-style="italic">Peak lateral force per tire, evaluated at each load. Even split 6,549 N; 4+2 -1.4%; 5+1 -5.6%.</text></svg>