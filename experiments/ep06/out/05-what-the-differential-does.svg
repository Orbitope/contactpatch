<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="1060" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What the differential does, and who needs it more</text><text x="40" y="70" fill="#6f6a63" font-size="13">The rear axle of the rear-drive car, at the point in the corner where the differential costs it the most. Both wheels are on the same axle at the same instant; the only difference is whether the differential may send them different torque.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Arrow length is the driving force at that wheel. The inside wheel is unloaded by the cornering, so it can take less -- and an open differential makes that the whole axle's problem.</text><text x="120.0" y="156.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Open differential</text><text x="120.0" y="175.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">equal torque, both wheels</text><g opacity="1.0"><line x1="380.0" y1="510.0" x2="380.0" y2="207.7" stroke="#6f6a63" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="380.0,200.0 376.2,209.0 383.8,209.0" fill="#6f6a63"/></g><text x="380.0" y="188.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(0.00 250.0 400.0)"><rect x="231.0" y="352.0" width="38" height="96" rx="10.5" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="239.0" y="382.3" width="22.0" height="35.4" rx="9.2" fill="#e16149" opacity="0.9"/><line x1="241.8" y1="357.0" x2="241.8" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="250.0" y1="357.0" x2="250.0" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="258.2" y1="357.0" x2="258.2" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g opacity="1.0"><line x1="250.0" y1="344.0" x2="250.0" y2="349.9" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="250.0,341.4 245.8,351.4 254.2,351.4" fill="#e2614a"/></g><text x="250.0" y="478.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">inside</text><text x="250.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.18 kN on it</text><text x="250.0" y="522.0" fill="#e2614a" font-size="13" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.09 kN driving</text><g transform="rotate(0.00 510.0 400.0)"><rect x="491.0" y="352.0" width="38" height="96" rx="10.5" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="493.9" y="359.7" width="32.3" height="80.6" rx="13.6" fill="#e16149" opacity="0.9"/><line x1="501.8" y1="357.0" x2="501.8" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="510.0" y1="357.0" x2="510.0" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="518.2" y1="357.0" x2="518.2" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g opacity="1.0"><line x1="510.0" y1="344.0" x2="510.0" y2="349.9" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="510.0,341.4 505.8,351.4 514.2,351.4" fill="#e2614a"/></g><text x="510.0" y="478.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">outside</text><text x="510.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.92 kN on it</text><text x="510.0" y="522.0" fill="#e2614a" font-size="13" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.09 kN driving</text><text x="380.0" y="568.0" fill="#e8e4dd" font-size="14" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">axle total 0.18 kN</text><text x="120.0" y="606.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">The split is forced to 50/50, so the outside wheel is held down to whatever the light inside one can take.</text><text x="820.0" y="156.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Ideal differential</text><text x="820.0" y="175.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">torque follows grip</text><g opacity="1.0"><line x1="1080.0" y1="510.0" x2="1080.0" y2="207.7" stroke="#6f6a63" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="1080.0,200.0 1076.2,209.0 1083.8,209.0" fill="#6f6a63"/></g><text x="1080.0" y="188.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(0.00 950.0 400.0)"><rect x="931.0" y="352.0" width="38" height="96" rx="10.5" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="938.8" y="381.4" width="22.4" height="37.3" rx="9.4" fill="#e16149" opacity="0.9"/><line x1="941.8" y1="357.0" x2="941.8" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="950.0" y1="357.0" x2="950.0" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="958.2" y1="357.0" x2="958.2" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g opacity="1.0"><line x1="950.0" y1="344.0" x2="950.0" y2="339.9" stroke="#4aa8a0" stroke-width="3.0" stroke-linecap="round"/><polygon points="950.0,331.4 945.8,341.4 954.2,341.4" fill="#4aa8a0"/></g><text x="950.0" y="478.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">inside</text><text x="950.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.37 kN on it</text><text x="950.0" y="522.0" fill="#4aa8a0" font-size="13" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.44 kN driving</text><g transform="rotate(0.00 1210.0 400.0)"><rect x="1191.0" y="352.0" width="38" height="96" rx="10.5" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1193.8" y="359.7" width="32.3" height="80.6" rx="13.6" fill="#e16149" opacity="0.9"/><line x1="1201.8" y1="357.0" x2="1201.8" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1210.0" y1="357.0" x2="1210.0" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1218.2" y1="357.0" x2="1218.2" y2="443.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g opacity="1.0"><line x1="1210.0" y1="344.0" x2="1210.0" y2="307.8" stroke="#4aa8a0" stroke-width="3.0" stroke-linecap="round"/><polygon points="1210.0,299.3 1205.8,309.3 1214.2,309.3" fill="#4aa8a0"/></g><text x="1210.0" y="478.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">outside</text><text x="1210.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5.06 kN on it</text><text x="1210.0" y="522.0" fill="#4aa8a0" font-size="13" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1.55 kN driving</text><text x="1080.0" y="568.0" fill="#e8e4dd" font-size="14" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">axle total 1.98 kN</text><text x="820.0" y="606.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Each wheel takes what its own load allows. This is the best an LSD could manage, so it is the optimistic bound.</text><line x1="60.0" y1="660.0" x2="1420.0" y2="660.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="700.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal"></text><text x="360.0" y="700.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">Open diff</text><text x="660.0" y="700.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">Ideal diff</text><text x="960.0" y="700.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">a perfect diff is worth</text><text x="60.0" y="726.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">Rear-wheel drive</text><text x="360.0" y="726.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12.160 s</text><text x="660.0" y="726.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12.086 s</text><text x="960.0" y="726.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.073 s</text><text x="60.0" y="752.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">Front-wheel drive</text><text x="360.0" y="752.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12.356 s</text><text x="660.0" y="752.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12.054 s</text><text x="960.0" y="752.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.302 s</text><text x="60.0" y="778.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">front drive costs</text><text x="360.0" y="778.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.196 s</text><text x="660.0" y="778.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-0.033 s</text><text x="960.0" y="778.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"></text><text x="60.0" y="828.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">This is happening at s = 83 m, which is 13 m INTO the corner, not on the way out of it. That is where the inside wheel is lightest, so that is where an</text><text x="60.0" y="850.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">open differential hurts. Out on the straight the car is level, both driven wheels can take plenty, and the engine is the limit instead — the differential makes no</text><text x="60.0" y="872.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">difference there at all.</text><text x="60.0" y="894.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="916.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Rear drive gains 0.073 s from a perfect differential. Front drive gains 0.302 s — roughly twice as much. That is not a coincidence: the front-drive car's driven wheels are also its</text><text x="60.0" y="938.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">steering wheels, so they are closer to the edge already, and recovering traction is worth more to the axle with less to spare.</text><text x="60.0" y="960.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="982.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Rear drive is faster either way, so the conclusion holds. The size of it does not: +0.196 s with an open diff, -0.033 s with a perfect one. The reference car has a factory</text><text x="60.0" y="1004.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">limited-slip differential, so the truth is between — and quoting the open-diff number alone would have overstated the front-drive penalty by about 60%.</text><text x="40.0" y="1020.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + optimal control + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg - 54% front  -  100 nodes  -  [SOURCED] RV-1 params §1  -  both bounds [ASSUMED]; sampled at s = 83 m, where the open diff costs the axle the most</text><text x="40" y="1042" fill="#6f6a63" font-size="11" font-style="italic">Every wheel's longitudinal force is capped at its own capability in both cases. The open diff adds the 50/50 split constraint on top, which limits the driven pair to twice the weaker wheel.</text></svg>