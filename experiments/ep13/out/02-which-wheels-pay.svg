i-monospace, SFMono-Regular, Menlo, monospace">+488</text><g opacity="1.0"><line x1="207.3" y1="489.0" x2="207.3" y2="484.9" stroke="#e2614a" stroke-width="4.4" stroke-linecap="round"/><polygon points="207.3,495.1 212.3,483.1 202.3,483.1" fill="#e2614a"/></g><text x="191.3" y="496.0" fill="#e2614a" font-size="12" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-171</text><g opacity="1.0"><line x1="332.7" y1="489.0" x2="332.7" y2="489.3" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="332.7,479.1 327.7,491.1 337.7,491.1" fill="#4aa8a0"/></g><text x="348.7" y="488.1" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+279</text><path d="M 402.4,316.6 A 168,168 0 0 0 137.6,316.6" fill="none" stroke="#e2614a" stroke-width="3.2" opacity="0.9"/><g opacity="1.0"><line x1="148.6" y1="325.2" x2="147.0" y2="323.9" stroke="#e2614a" stroke-width="3.2" stroke-linecap="round"/><polygon points="137.6,316.6 145.0,329.8 152.3,320.6" fill="#e2614a"/></g><text x="60.0" y="650.0" fill="#e2614a" font-size="15" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+825 N.m asked for</text><text x="60.0" y="676.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1058 N right minus left</text><text x="60.0" y="712.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Just past the brake point, still loading up</text><text x="60.0" y="733.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the front tires. The car is turning 0.051</text><text x="60.0" y="754.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">rad/s LESS than the reference asks, so the</text><text x="60.0" y="775.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">controller adds rotation: more force to the</text><text x="60.0" y="796.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">right-hand wheels than the left.</text><text x="560.0" y="152.0" fill="#e8e4dd" font-size="18" text-anchor="start" font-weight="600" font-style="normal">Mid-corner</text><text x="560.0" y="176.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">105 m along the road   18.7 m/s</text><g transform="rotate(0.000 770.0 420.0)"><rect x="715.0" y="305.0" width="110" height="230" rx="27.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 761.0,321.0 L 770.0,309.0 L 779.0,321.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-7.12 707.3 351.0)"><rect x="696.3" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="701.5" y="341.7" width="11.7" height="18.6" rx="4.9" fill="#7f8ea3" opacity="0.9"/><line x1="703.4" y1="331.0" x2="703.4" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="707.3" y1="331.0" x2="707.3" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="711.1" y1="331.0" x2="711.1" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-7.12 832.7 351.0)"><rect x="821.7" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="824.2" y="330.0" width="17.1" height="42.0" rx="7.2" fill="#7f8ea3" opacity="0.9"/><line x1="828.9" y1="331.0" x2="828.9" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="832.7" y1="331.0" x2="832.7" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="836.6" y1="331.0" x2="836.6" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 707.3 489.0)"><rect x="696.3" y="464.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="701.5" y="479.8" width="11.6" height="18.3" rx="4.9" fill="#7f8ea3" opacity="0.9"/><line x1="703.4" y1="469.0" x2="703.4" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="707.3" y1="469.0" x2="707.3" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="711.1" y1="469.0" x2="711.1" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 832.7 489.0)"><rect x="821.7" y="464.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="824.7" y="470.2" width="16.1" height="37.6" rx="6.8" fill="#7f8ea3" opacity="0.9"/><line x1="828.9" y1="469.0" x2="828.9" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="832.7" y1="469.0" x2="832.7" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="836.6" y1="469.0" x2="836.6" y2="509.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="691.3" y="354.9" fill="#4aa8a0" font-size="12" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+6</text><g opacity="1.0"><line x1="832.7" y1="351.0" x2="832.7" y2="359.0" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="832.7,348.8 827.7,360.8 837.7,360.8" fill="#4aa8a0"/></g><text x="848.7" y="353.9" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+63</text><g opacity="1.0"><line x1="707.3" y1="489.0" x2="707.3" y2="474.3" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="707.3,464.1 702.3,476.1 712.3,476.1" fill="#4aa8a0"/></g><text x="691.3" y="480.5" fill="#4aa8a0" font-size="12" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+705</text><g opacity="1.0"><line x1="832.7" y1="489.0" x2="832.7" y2="470.6" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="832.7,460.4 827.7,472.4 837.7,472.4" fill="#4aa8a0"/></g><text x="848.7" y="478.7" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+809</text><path d="M 902.4,316.6 A 168,168 0 0 0 637.6,316.6" fill="none" stroke="#e2614a" stroke-width="3.2" opacity="0.9"/><g opacity="1.0"><line x1="648.6" y1="325.2" x2="647.0" y2="323.9" stroke="#e2614a" stroke-width="3.2" stroke-linecap="round"/><polygon points="637.6,316.6 645.0,329.8 652.3,320.6" fill="#e2614a"/></g><text x="560.0" y="650.0" fill="#e2614a" font-size="15" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+130 N.m asked for</text><text x="560.0" y="676.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+161 N right minus left</text><text x="560.0" y="712.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Steady state, at the highest lateral</text><text x="560.0" y="733.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">acceleration of the lap. The error has been</text><text x="560.0" y="754.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">driven to almost nothing (0.001 rad/s), and</text><text x="560.0" y="775.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the 130 N.m holding it there is the PID's</text><text x="560.0" y="796.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">integral term: a standing moment, not a</text><text x="560.0" y="817.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">correction.</text><text x="1060.0" y="152.0" fill="#e8e4dd" font-size="18" text-anchor="start" font-weight="600" font-style="normal">Exit</text><text x="1060.0" y="176.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">135 m along the road   20.1 m/s</text><g transform="rotate(0.000 1270.0 420.0)"><rect x="1215.0" y="305.0" width="110" height="230" rx="27.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1261.0,321.0 L 1270.0,309.0 L 1279.0,321.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-0.02 1207.3 351.0)"><rect x="1196.3" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1200.2" y="336.3" width="14.2" height="29.4" rx="6.0" fill="#7f8ea3" opacity="0.9"/><line x1="1203.5" y1="331.0" x2="1203.5" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1207.3" y1="331.0" x2="1207.3" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1211.1" y1="331.0" x2="1211.1" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-0.02 1332.7 351.0)"><rect x="1321.7" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1324.2" y="330.4" width="16.9" height="41.2" rx="7.1" fill="#7f8ea3" opacity="0.9"/><line x1="1328.9" y1="331.0" x2="1328.9" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1332.7" y1="331.0" x2="1332.7" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1336.5" y1="331.0" x2="1336.5" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1207.3 489.0)"><rect x="1196.3" y="464.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1199.9" y="472.8" width="14.8"