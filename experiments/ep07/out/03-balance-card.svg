" stroke-width="1"/><line x1="1260" y1="150" x2="1260" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="228" x2="1340" y2="228" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="305" x2="1340" y2="305" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="382" x2="1340" y2="382" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="460" x2="1340" y2="460" stroke="#6f6a63" stroke-width="1"/><line x1="1020" y1="150" x2="1020" y2="460" stroke="#6f6a63" stroke-width="1"/><text x="1032" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">40</text><text x="1115" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">47</text><text x="1198" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">54</text><text x="1281" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">61</text><text x="1328" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">65</text><text x="1010" y="464" fill="#6f6a63" font-size="11" text-anchor="end">55.32</text><text x="1010" y="361" fill="#6f6a63" font-size="11" text-anchor="end">55.70</text><text x="1010" y="257" fill="#6f6a63" font-size="11" text-anchor="end">56.08</text><text x="1010" y="154" fill="#6f6a63" font-size="11" text-anchor="end">56.47</text><text x="1180.0" y="506" fill="#e8e4dd" font-size="12.5" text-anchor="middle">front mass fraction (%)</text><text x="962" y="305.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 962 305.0)">% through the corner</text><rect x="1185.9" y="150" width="35.6" height="310" fill="#e0a53c" opacity="0.10"/><path d="M 1031.9,403.9 L 1114.8,164.1 L 1197.8,169.0 L 1280.7,252.7 L 1328.1,445.9" fill="none" stroke="#4aa8a0" stroke-width="2.2"/><circle cx="1031.9" cy="403.9" r="3.5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.5"/><circle cx="1114.8" cy="164.1" r="3.5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.5"/><circle cx="1197.8" cy="169.0" r="3.5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.5"/><circle cx="1280.7" cy="252.7" r="3.5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.5"/><circle cx="1328.1" cy="445.9" r="3.5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.5"/><path d="M 1031.9,427.6 L 1114.8,194.3 L 1197.8,233.4 L 1280.7,332.2 L 1328.1,413.7" fill="none" stroke="#e2614a" stroke-width="2.2"/><circle cx="1031.9" cy="427.6" r="3.5" fill="#e2614a" stroke="#e2614a" stroke-width="1.5"/><circle cx="1114.8" cy="194.3" r="3.5" fill="#e2614a" stroke="#e2614a" stroke-width="1.5"/><circle cx="1197.8" cy="233.4" r="3.5" fill="#e2614a" stroke="#e2614a" stroke-width="1.5"/><circle cx="1280.7" cy="332.2" r="3.5" fill="#e2614a" stroke="#e2614a" stroke-width="1.5"/><circle cx="1328.1" cy="413.7" r="3.5" fill="#e2614a" stroke="#e2614a" stroke-width="1.5"/><text x="100.0" y="556.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Hollow markers are solves that stopped on the iteration limit; their times are not evidence (FINDINGS F39). Filled markers converged cleanly.</text><text x="100.0" y="578.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Within the 0.02 s these solves resolve, rear drive is fastest at 40% and 47% front and front drive at 54% and 61% — each wants the end of the range that loads the wheels it drives.</text><text x="100.0" y="600.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Understeer gradient runs -0.37 to +0.68 deg/g across the same sweep, against a 0.2 deg/g measurement floor — five times the resolution, where the lap times are barely one.</text><text x="100.0" y="622.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Yaw inertia is held fixed, so this isolates balance. A real engine move would change polar moment too — Episode 8.</text><text x="40.0" y="750.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + optimal control + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg held fixed  -  100 nodes  -  front mass fraction [ASSUMED] outside 0.53-0.56</text><text x="40" y="772" fill="#6f6a63" font-size="11" font-style="italic">Every solve constrains slip angle to +/-12 degrees. Absolute times are specific to this invented corner; the comparable quantities are the shape of each curve and where its optimum sits.</text></svg>