<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="698" viewBox="0 0 1480 698" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="698" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Reality check — our numbers against published values</text><text x="40" y="70" fill="#6f6a63" font-size="13">Each bar is the range the literature or the reference sheet says to expect. The dot is what this model produces. Nothing here is checked against our own code; every band comes from outside the project.</text><text x="60.0" y="154.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Slip angle where a tire makes its best grip</text><text x="60.0" y="174.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">General vehicle-dynamics range for a road tire · citation not yet pinned (FINDINGS O5)</text><rect x="620" y="139" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="788.0" y="139.0" width="168.0" height="22" rx="3" fill="#4aa8a0" opacity="0.45"/><text x="788.0" y="180.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6</text><text x="956.0" y="180.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12</text><circle cx="902.8" cy="150.0" r="7" fill="#7fa86a" stroke="#1a1a1c" stroke-width="2"/><text x="1202.0" y="155.0" fill="#7fa86a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.1 °</text><text x="1202.0" y="174.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">inside the published range</text><text x="60.0" y="228.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Peak grip of one tire at this car's resting corner load</text><text x="60.0" y="248.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">Published skidpad figures, sports coupe on summer tires · citation not yet pinned (FINDINGS O5)</text><rect x="620" y="213" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="760.0" y="213.0" width="186.7" height="22" rx="3" fill="#4aa8a0" opacity="0.45"/><text x="760.0" y="254.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.85</text><text x="946.7" y="254.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.05</text><circle cx="959.7" cy="224.0" r="7" fill="#e2614a" stroke="#1a1a1c" stroke-width="2"/><text x="1202.0" y="229.0" fill="#e2614a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.064 g</text><text x="1202.0" y="248.0" fill="#e2614a" font-size="10.5" text-anchor="start" font-weight="600" font-style="normal">OUTSIDE the published range</text><text x="1202.0" y="263.0" fill="#6f6a63" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">Known and expected: this is a 245-section tire on a car that wears 215s. Open item O1 tracks rescaling it.</text><text x="60.0" y="302.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Grip accelerating vs grip cornering (μx ÷ μy)</text><text x="60.0" y="322.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="italic">Road tires grip slightly better longitudinally · textbook, qualitative</text><rect x="620" y="287" width="560" height="22" rx="4" fill="#2e2e31" opacity="0.55"/><rect x="788.0" y="287.