othing thrown away</text><line x1="60.0" y1="730.0" x2="1420.0" y2="730.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="764.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The open differential must feed both wheels equally, so it is limited by twice whatever the lighter inside wheel can hold — and the inside wheel is</text><text x="60.0" y="785.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">light because the corner has already put the weight on the outside one. The other two devices recover that force by sending the outside wheel more</text><text x="60.0" y="806.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">than the inside one, which is the same asymmetry that steers the car.</text><text x="40.0" y="880.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, steady left corner R=40 m, a_y=9.0 m/s2, v=19.0 m/s  -  [ASSUMED] LSD torque bias 1.5:1, locking 0.5  -  [LIKELY] track width  -  RUNG 2 — mechanism and ordering only, not a real car (rule 15)</text><text x="40" y="902" fill="#6f6a63" font-size="11" font-style="italic">Arrow length is longitudinal force at the contact patch, one scale across all three cars. Contact-patch shading is static load; the corner is a steady left-hander at the load in the stamp below.</text></svg>