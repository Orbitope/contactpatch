<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="940" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">The fastest setup is the one that crashes</text><text x="40" y="70" fill="#6f6a63" font-size="13">Horizontal: how quick the car is when nothing goes wrong — the number a setup sheet would quote. Vertical: how often it fails to get round once the driver's hands shake and the grip is not what was expected.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Failure rate counts only laps that never left the tire model's fitted region — rule 4 applied per lap.</text><text x="150.0" y="194.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Clean pace against dirty-day failure rate</text><line x1="312" y1="216" x2="312" y2="640" stroke="#2e2e31" stroke-width="1"/><line x1="475" y1="216" x2="475" y2="640" stroke="#2e2e31" stroke-width="1"/><line x1="638" y1="216" x2="638" y2="640" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="322" x2="800" y2="322" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="428" x2="800" y2="428" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="534" x2="800" y2="534" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="640" x2="800" y2="640" stroke="#6f6a63" stroke-width="1"/><line x1="150" y1="216" x2="150" y2="640" stroke="#6f6a63" stroke-width="1"/><text x="150" y="660" fill="#6f6a63" font-size="11" text-anchor="middle">19.0</text><text x="367" y="660" fill="#6f6a63" font-size="11" text-anchor="middle">19.4</text><text x="583" y="660" fill="#6f6a63" font-size="11" text-anchor="middle">19.9</text><text x="800" y="660" fill="#6f6a63" font-size="11" text-anchor="middle">20.3</text><text x="140" y="625" fill="#6f6a63" font-size="11" text-anchor="end">0%</text><text x="140" y="528" fill="#6f6a63" font-size="11" text-anchor="end">25%</text><text x="140" y="432" fill="#6f6a63" font-size="11" text-anchor="end">50%</text><text x="140" y="336" fill="#6f6a63" font-size="11" text-anchor="end">75%</text><text x="140" y="239" fill="#6f6a63" font-size="11" text-anchor="end">100%</text><text x="475.0" y="686" fill="#e8e4dd" font-size="12.5" text-anchor="middle">lap time with no perturbation (s)</text><text x="92" y="428.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 92 428.0)">laps that left the road, perturbed</text><text x="158.0" y="234.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">fast, and loses laps</text><text x="158.0" y="628.0" fill="#4aa8a0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">slower, and keeps them</text><line x1="225.3" y1="572.8" x2="225.3" y2="519.7" stroke="#7fa86a" stroke-width="1.8" opacity="0.75"/><circle cx="225.3" cy="585.0" r="7" fill="#7fa86a"/><text x="239.3" y="590.0" fill="#7fa86a" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">47% front</text><line x1="370.1" y1="620.2" x2="370.1" y2="603.1" stroke="#e0a53c" stroke-width="1.8" opacity="0.75"/><circle cx="370.1" cy="620.7" r="7" fill="#e0a53c"/><text x="384.1" y="625.7" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">54% front</text><line x1="569.8" y1="620.7" x2="569.8" y2="608.8" stroke="#e2614a" stroke-width="1.8" opacity="0.75"/><circle cx="569.8" cy="620.7" r="7" fill="#e2614a"/><text x="583.8" y="625.7" fill="#e2614a" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">61% front</text><line x1="724.7" y1="620.7" x2="724.7" y2="608.8" stroke="#8a7bd8" stroke-width="1.8" opacity="0.75"/><circle cx="724.7" cy="620.7" r="7" fill="#8a7bd8"/><text x="738.7" y="625.7" fill="#8a7bd8" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">65% front</text><text x="840.0" y="180.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">what each design is betting on</text><text x="840.0" y="560.0" fill="#4aa8a0" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">40% front is not on this chart.</text><text x="840.0" y="580.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">No unperturbed lap time to plot against: it</text><text x="840.0" y="598.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">fails 100% of laps before any disturbance at</text><text x="840.0" y="616.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">all.</text><text x="840.0" y="210.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">47% front</text><text x="840.0" y="230.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">19.14 s clean, 9% of dirty laps lost</text><text x="840.0" y="248.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">and 0.16 s of scatter on the ones it keeps</text><text x="840.0" y="286.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">54% front</text><text x="840.0" y="306.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">19.43 s clean, 0% of dirty laps lost</text><text x="840.0" y="324.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">and 0.19 s of scatter on the ones it keeps</text><text x="840.0" y="362.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">61% front</text><text x="840.0" y="382.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">19.82 s clean, 0% of dirty laps lost</text><text x="840.0" y="400.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">and 0.27 s of scatter on the ones it keeps</text><text x="840.0" y="438.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">65% front</text><text x="840.0" y="458.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">20.13 s clean, 0% of dirty laps lost</text><text x="840.0" y="476.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">and 0.23 s of scatter on the ones it keeps</text><line x1="150.0" y1="700.0" x2="1180.0" y2="700.0" stroke="#2e2e31" stroke-width="1.0"/><text x="150.0" y="732.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Optimal control could not have produced this chart. A minimum-time solver knows the grip and sees the whole road, so lower grip returns a new plan rather than a crash —</text><text x="150.0" y="753.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">fragility only exists for a driver that has to react to something it did not expect. Every point here is the same policy, nothing retrained, so the differences are the cars.</text><text x="150.0" y="774.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="150.0" y="795.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The rates are LOWER BOUNDS wherever a discarded lap both failed and left the fitted region: those are real crashes we cannot attribute to the car rather than to our</text><text x="150.0" y="816.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">extrapolation, so they are dropped rather than counted. The ordering is robust to that; the magnitudes are floors. See FINDINGS F70.</text><text x="40.0" y="900.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] Episode 10's policy (experiments/ep10/out/policy.pt), DEPLOYED, nothing retrained  -  120 rollouts per design (headline rates); 40 for the condition grid  -  [ASSUMED] steering noise sigma 0.01, grip +/-20% per lap  -  slip envelope penalised at 0.5</text><text x="40" y="922" fill="#6f6a63" font-size="11" font-style="italic">Bars are 95% Wilson intervals — the normal approximation is worst near 0% and 100%, which is where this lives. Rule 4 is applied per lap: laps that exceeded 12 degrees of slip are discarded individually, not by condition. Absolute times are not comparable with Seasons 1-2 (rule 6).</text></svg>