weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1460</text><g opacity="1.0"><line x1="1332.7" y1="489.0" x2="1332.7" y2="465.8" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="1332.7,455.6 1327.7,467.6 1337.7,467.6" fill="#4aa8a0"/></g><text x="1348.7" y="476.3" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+945</text><path d="M 1137.6,316.6 A 168,168 0 0 1 1402.4,316.6" fill="none" stroke="#e2614a" stroke-width="3.2" opacity="0.9"/><g opacity="1.0"><line x1="1413.4" y1="307.9" x2="1411.8" y2="309.2" stroke="#e2614a" stroke-width="3.2" stroke-linecap="round"/><polygon points="1402.4,316.6 1417.0,312.6 1409.8,303.3" fill="#e2614a"/></g><text x="1060.0" y="650.0" fill="#e2614a" font-size="15" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-521 N.m asked for</text><text x="1060.0" y="676.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-702 N right minus left</text><text x="1060.0" y="712.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Power down, unwinding the steering. The car is</text><text x="1060.0" y="733.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">turning 0.018 rad/s MORE than the reference</text><text x="1060.0" y="754.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">asks, so the controller takes rotation away:</text><text x="1060.0" y="775.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">more force to the left-hand wheels than the</text><text x="1060.0" y="796.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">right.</text><line x1="60.0" y1="820.0" x2="1440.0" y2="820.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="856.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">A differential cannot do this. It has one behaviour, set by which wheel is turning faster, and Episode 12 showed that the same device therefore</text><text x="60.0" y="878.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">pushes the car wide at part throttle and turns it in when the inside wheel spins. A controller chooses, instant by instant, and the three panels</text><text x="60.0" y="900.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">above are the same hardware being asked for three different things inside one corner.</text><text x="40.0" y="933.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long exit (393 m), grip_use swept to failure  -  [MEASURED] reference model K=0.20 deg/g, grip ceiling 0.95 g</text><text x="40.0" y="946.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED — CITATION OUTSTANDING] ~9% skidpad ceiling, FSAE  -  [LIKELY] track width — the moment arm; conclusion re-run at +/-3%  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="962" fill="#6f6a63" font-size="11" font-style="italic">One lap, at the highest aggression both the passive and the controlled car complete. Contact-patch shading is vertical load. Teal pushes the car forward, red drags it back; the car is nose-up and turning left.</text></svg>