<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" font-family="Inter, system-ui, sans-serif"><rect width="1520" height="700" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Episode 8 - polar moment against balance</text><text x="40" y="70" fill="#6f6a63" font-size="13">How quickly the car answers the wheel, how much it overshoots, and what any of it is worth in a lap time. One line per weight distribution.</text><text x="100.0" y="132.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">A - How fast it answers</text><line x1="180" y1="150" x2="180" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="260" y1="150" x2="260" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="340" y1="150" x2="340" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="228" x2="420" y2="228" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="305" x2="420" y2="305" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="382" x2="420" y2="382" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="460" x2="420" y2="460" stroke="#6f6a63" stroke-width="1"/><line x1="100" y1="150" x2="100" y2="460" stroke="#6f6a63" stroke-width="1"/><text x="100" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">0.75</text><text x="174" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">0.90</text><text x="248" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.05</text><text x="322" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.20</text><text x="420" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.40</text><text x="90" y="464" fill="#6f6a63" font-size="11" text-anchor="end">126.3</text><text x="90" y="361" fill="#6f6a63" font-size="11" text-anchor="end">223.9</text><text x="90" y="257" fill="#6f6a63" font-size="11" text-anchor="end">321.6</text><text x="90" y="154" fill="#6f6a63" font-size="11" text-anchor="end">419.2</text><text x="260.0" y="506" fill="#e8e4dd" font-size="12.5" text-anchor="middle">polar moment (x reference)</text><text x="42" y="305.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 42 305.0)">rise time (ms)</text><path d="M 100.0,353.4 L 173.8,309.5 L 247.7,266.1 L 321.5,223.2 L 420.0,166.6" fill="none" stroke="#4aa8a0" stroke-width="2"/><path d="M 100.0,393.6 L 173.8,354.5 L 247.7,315.8 L 321.5,277.7 L 420.0,226.4" fill="none" stroke="#3e7773" stroke-width="2"/><path d="M 100.0,419.0 L 173.8,383.6 L 247.7,348.7 L 321.5,313.7 L 420.0,267.7" fill="none" stroke="#334647" stroke-width="2"/><path d="M 100.0,433.9 L 173.8,402.1 L 247.7,369.8 L 321.5,337.5 L 420.0,294.7" fill="none" stroke="#523836" stroke-width="2"/><path d="M 100.0,441.8 L 173.8,411.6 L 247.7,381.5 L 321.5,350.8 L 420.0,310.0" fill="none" stroke="#9a4c40" stroke-width="2"/><path d="M 100.0,443.4 L 173.8,414.3 L 247.7,384.6 L 321.5,355.0 L 420.0,315.8" fill="none" stroke="#e2614a" stroke-width="2"/><text x="560.0" y="132.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">B - How much it overshoots</text><line x1="640" y1="150" x2="640" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="720" y1="150" x2="720" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="800" y1="150" x2="800" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="560" y1="228" x2="880" y2="228" stroke="#2e2e31" stroke-width="1"/><line x1="560" y1="305" x2="880" y2="305" stroke="#2e2e31" stroke-width="1"/><line x1="560" y1="382" x2="880" y2="382" stroke="#2e2e31" stroke-width="1"/><line x1="560" y1="460" x2="880" y2="460" stroke="#6f6a63" stroke-width="1"/><line x1="560" y1="150" x2="560" y2="460" stroke="#6f6a63" stroke-width="1"/><text x="560" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">0.75</text><text x="634" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">0.90</text><text x="708" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.05</text><text x="782" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.20</text><text x="880" y="480" fill="#6f6a63" font-size="11" text-anchor="middle">1.40</text><text x="550" y="464" fill="#6f6a63" font-size="11" text-anchor="end">0.0</text><text x="550" y="361" fill="#6f6a63" font-size="11" text-anchor="end">0.3</text><text x="550" y="257" fill="#6f6a63" font-size="11" text-anchor="end">0.6</text><text x="550" y="154" fill="#6f6a63" font-size="11" text-anchor="end">0.9</text><text x="720.0" y="506" fill="#e8e4dd" font-size="12.5" text-anchor="middle">polar moment (x reference)</text><text x="502" y="305.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 502 305.0)">overshoot (%)</text><path d="M 560.0,381.2 L 633.8,395.3 L 707.7,410.1 L 781.5,424.8 L 880.0,443.4" fill="none" stroke="#4aa8a0" stroke-width="2"/><text x="888.0" y="447.4" fill="#4aa8a0" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">38%</text><path d="M 560.0,384.7 L 633.8,394.7 L 707.7,405.6 L 781.5,416.9 L 880.0,432.3" fill="none" stroke="#3e7773" stroke-width="2"/><text x="888.0" y="436.3" fill="#3e7773" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">43%</text><path d="M 560.0,387.0 L 633.8,395.3 L 707.7,404.4 L 781.5,413.8 L 880.0,426.7" fill="none" stroke="#334647" stroke-width="2"/><text x="888.0" y="430.7" fill="#334647" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">48%</text><path d="M 560.0,359.3 L 633.8,381.0 L 707.7,396.7 L 781.5,409.0 L 880.0,422.7" fill="none" stroke="#523836" stroke-width="2"/><text x="888.0" y="426.7" fill="#523836" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">53%</text><path d="M 560.0,260.1 L 633.8,317.7 L 707.7,359.1 L 781.5,388.2 L 880.0,413.5" fill="none" stroke="#9a4c40" stroke-width="2"/><text x="888.0" y="417.5" fill="#9a4c40" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">58%</text><path d="M 560.0,166.6 L 633.8,246.0 L 707.7,307.7 L 781.5,353.9 L 880.0,396.1" fill="none" stroke="#e2614a" stroke-width="2"/><text x="888.0" y="400.1" fill="#e2614a" font-size="10" text-anchor="start" font-weight="normal" font-style="normal">62%</text><text x="1020.0" y="132.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">C - Lap time by layout</text><line x1="1096" y1="150" x2="1096" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="1172" y1="150" x2="1172" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="1248" y1="150" x2="1248" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="1324" y1="150" x2="1324" y2="460" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="228" x2="1400" y2="228" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="305" x2="1400" y2="305" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="382" x2="1400" y2="382" stroke="#2e2e31" stroke-width="1"/><line x1="1020" y1="460" x2="1400" y2="460" stroke="#6f6a63" stroke-width="1"/><line x1="1020" y1="150" x2="1020" y2="460" stroke="#6f6a63" stroke-width="1"/><text x="1010" y="464" fill="#6f6a63" font-size="11" text-anchor="end">11.99</text><text x="1010" y="361" fill="#6f6a63" font-size="11" text-anchor="end">12.04</text><text x="1010" y="257" fill="#6f6a63" font-size="11" text-anchor="end">12.10</text><text x="1010" y="154" fill="#6f6a63" font-size="11" text-anchor="end">12.15</text><text x="1210.0" y="506" fill="#e8e4dd" font-size="12.5" text-anchor="middle">layout</text><text x="962" y="305.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 962 305.0)">time (s)</text><circle cx="1058.0" cy="310.8" r="5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.8"/><text x="1058.0" y="478.0" fill="#6f6a63" font-size="9" text-anchor="middle" font-weight="normal" font-style="normal">Front</text><circle cx="1134.0" cy="249.6" r="5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.8"/><text x="1134.0" y="478.0" fill="#6f6a63" font-size="9" text-anchor="middle" font-weight="normal" font-style="normal">Front</text><circle cx="1210.0" cy="289.7" r="5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.8"/><text x="1210.0" y="478.0" fill="#6f6a63" font-size="9" text-anchor="middle" font-weight="normal" font-style="normal">Front-mid,</text><circle cx="1286.0" cy="360.4" r="5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.8"/><text x="1286.0" y="478.0" fill="#6f6a63" font-size="9" text-anchor="middle" font-weight="normal" font-style="normal">Mid</text><circle cx="1362.0" cy="289.0" r="5" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.8"/><text x="1362.0" y="478.0" fill="#6f6a63" font-size="9" text-anchor="middle" font-weight="normal" font-style="normal">Rear</text><text x="1020.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Lap time spans only 0.056 s across all five layouts, while rise time spans 154 ms.</text><text x="100.0" y="512.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Rise time falls with polar moment and rises with front weight; overshoot does the opposite. Both directions match the linear model D4 validated against.</text><text x="100.0" y="534.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Hollow markers in panel C are solves that stopped on the iteration limit — their times are not evidence (FINDINGS F39).</text><text x="100.0" y="556.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Steady-state yaw rate is independent of polar moment to one part in ten thousand (D4), so none of this moves the understeer gradient. Inertia is a transient effect only.</text><text x="40.0" y="660.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model (transient) + double-track (lap time) + Sedan_Pac02Tire.tir  -  m 1360 kg held fixed  -  [SOURCED] i_zz range 0.75-1.40x, RV-1 params §2  -  layout archetype values [ASSUMED] §2</text><text x="40" y="682" fill="#6f6a63" font-size="11" font-style="italic">Transient metrics from a step steer on the bicycle model; lap times from four-wheel minimum-time solves. Absolute times are specific to this invented corner.</text></svg>