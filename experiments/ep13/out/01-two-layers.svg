<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" font-family="Inter, system-ui, sans-serif"><rect width="1560" height="1000" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Two layers: how much to rotate, and who pays for it</text><text x="40" y="70" fill="#6f6a63" font-size="13">One instant in one left-hand corner. The driver has asked for more rotation than the car is producing; a controller turns that gap into a single number, and an allocator turns that number into four forces.</text><text x="70.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">1. How much do you want to rotate?</text><text x="70.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">A reference model says what this steering angle at this speed should produce.</text><g transform="rotate(0.000 300.0 430.0)"><rect x="241.0" y="305.0" width="118" height="250" rx="29.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 291.0,321.0 L 300.0,309.0 L 309.0,321.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-3.98 232.6 355.0)"><rect x="220.6" y="328.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="224.9" y="339.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="228.2" y1="333.0" x2="228.2" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="232.6" y1="333.0" x2="232.6" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="237.0" y1="333.0" x2="237.0" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-3.98 367.4 355.0)"><rect x="355.4" y="328.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="358.7" y="335.7" width="17.4" height="38.7" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="363.0" y1="333.0" x2="363.0" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="367.4" y1="333.0" x2="367.4" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="371.8" y1="333.0" x2="371.8" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 232.6 505.0)"><rect x="220.6" y="478.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="224.9" y="489.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="228.2" y1="483.0" x2="228.2" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="232.6" y1="483.0" x2="232.6" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="237.0" y1="483.0" x2="237.0" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 367.4 505.0)"><rect x="355.4" y="478.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="358.7" y="485.7" width="17.4" height="38.7" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="363.0" y1="483.0" x2="363.0" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="367.4" y1="483.0" x2="367.4" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="371.8" y1="483.0" x2="371.8" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><line x1="300.0" y1="430.0" x2="300.0" y2="240.0" stroke="#2e2e31" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="300.0" y1="430.0" x2="363.9" y2="294.3" stroke="#7f8ea3" stroke-width="1.2" opacity="0.5"/><line x1="300.0" y1="430.0" x2="383.3" y2="270.4" stroke="#e0a53c" stroke-width="1.2" opacity="0.5"/><path d="M 300.0,280.0 A 150,150 0 0 1 363.9,294.3" fill="none" stroke="#7f8ea3" stroke-width="3.2"/><g opacity="1.0"><line x1="369.4" y1="282.5" x2="368.6" y2="284.3" stroke="#7f8ea3" stroke-width="3.2" stroke-linecap="round"/><polygon points="363.9,294.3 374.3,284.8 364.5,280.2" fill="#7f8ea3"/></g><path d="M 300.0,250.0 A 180,180 0 0 1 383.3,270.4" fill="none" stroke="#e0a53c" stroke-width="3.2"/><g opacity="1.0"><line x1="389.3" y1="258.9" x2="388.4" y2="260.6" stroke="#e0a53c" stroke-width="3.2" stroke-linecap="round"/><polygon points="383.3,270.4 394.2,261.4 384.5,256.4" fill="#e0a53c"/></g><path d="M 376.6,267.1 A 180,180 0 0 1 383.3,270.4" fill="none" stroke="#e2614a" stroke-width="8" opacity="0.55" stroke-linecap="round"/><text x="300.0" y="214.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">where the nose points after 1 s</text><text x="70.0" y="620.0" fill="#e0a53c" font-size="14" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">asked for   +0.481 rad/s (+27.6 deg/s)</text><text x="70.0" y="644.0" fill="#7f8ea3" font-size="14" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">getting     +0.440 rad/s (+25.2 deg/s)</text><text x="70.0" y="674.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">short by 0.041 rad/s</text><text x="70.0" y="708.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The car is not turning as tightly as the</text><text x="70.0" y="729.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">linear model says it should. Its front tires</text><text x="70.0" y="750.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">are near their peak and have stopped repaying</text><text x="70.0" y="771.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">steering angle with cornering force.</text><text x="640.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">2. One number</text><text x="640.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">The upper layer's entire output.</text><rect x="620" y="340" width="300" height="180" rx="14" fill="none" stroke="#e2614a" stroke-width="2" opacity="0.8"/><text x="770.0" y="390.0" fill="#6f6a63" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">desired yaw moment</text><text x="770.0" y="444.0" fill="#e2614a" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+996</text><text x="770.0" y="474.0" fill="#e2614a" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal">N.m</text><text x="770.0" y="504.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">PID on the gap, one scalar</text><g opacity="1.0"><line x1="590.0" y1="430.0" x2="607.5" y2="430.0" stroke="#6f6a63" stroke-width="2.2" stroke-linecap="round"/><polygon points="616.0,430.0 606.0,425.8 606.0,434.2" fill="#6f6a63"/></g><g opacity="1.0"><line x1="924.0" y1="430.0" x2="943.5" y2="430.0" stroke="#6f6a63" stroke-width="2.2" stroke-linecap="round"/><polygon points="952.0,430.0 942.0,425.8 942.0,434.2" fill="#6f6a63"/></g><text x="620.0" y="570.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The upper layer knows nothing about</text><text x="620.0" y="591.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">wheels. Everything it has learned about</text><text x="620.0" y="612.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the car is in this one number, which is</text><text x="620.0" y="633.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">what makes the two halves separable at</text><text x="620.0" y="654.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">all.</text><text x="1010.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">3. Which wheels pay for it?</text><text x="1010.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">A QP spends the leftover freedom on tire workload.</text><g transform="rotate(0.000 1180.0 430.0)"><rect x="1121.0" y="305.0" width="118" height="250" rx="29.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1171.0,321.0 L 1180.0,309.0 L 1189.0,321.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-3.98 1112.6 355.0)"><rect x="1100.6" y="328.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1104.9" y="339.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="1108.2" y1="333.0" x2="1108.2" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1112.6" y1="333.0" x2="1112.6" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.0" y1="333.0" x2="1117.0" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-3.98 1247.4 355.0)"><rect x="1235.4" y="328.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1238.7" y="335.7" width="17.4" height="38.7" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="1243.0" y1="333.0" x2="1243.0" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1247.4" y1="333.0" x2="1247.4" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1251.8" y1="333.0" x2="1251.8" y2="377.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1112.6 505.0)"><rect x="1100.6" y="478.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1104.9" y="489.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="1108.2" y1="483.0" x2="1108.2" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1112.6" y1="483.0" x2="1112.6" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.0" y1="483.0" x2="1117.0" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1247.4 505.0)"><rect x="1235.4" y="478.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1238.7" y="485.7" width="17.4" height="38.7" rx="7.3" fill="#7f8ea3" opacity="0.9"/><line x1="1243.0" y1="483.0" x2="1243.0" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1247.4" y1="483.0" x2="1247.4" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1251.8" y1="483.0" x2="1251.8" y2="527.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="1112.6" y1="355.0" x2="1112.6" y2="393.2" stroke="#e2614a" stroke-width="4.4" stroke-linecap="round"/><polygon points="1112.6,403.4 1117.6,391.4 1107.6,391.4" fill="#e2614a"/></g><text x="1096.6" y="383.2" fill="#e2614a" font-size="12" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-261</text><g opacity="1.0"><line x1="1247.4" y1="355.0" x2="1247.4" y2="265.2" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="1247.4,255.0 1242.4,267.0 1252.4,267.0" fill="#4aa8a0"/></g><text x="1263.4" y="309.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+539</text><g opacity="1.0"><line x1="1112.6" y1="505.0" x2="1112.6" y2="544.0" stroke="#e2614a" stroke-width="4.4" stroke-linecap="round"/><polygon points="1112.6,554.2 1117.6,542.2 1107.6,542.2" fill="#e2614a"/></g><text x="1096.6" y="533.6" fill="#e2614a" font-size="12" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-265</text><g opacity="1.0"><line x1="1247.4" y1="505.0" x2="1247.4" y2="471.8" stroke="#4aa8a0" stroke-width="4.4" stroke-linecap="round"/><polygon points="1247.4,461.6 1242.4,473.6 1252.4,473.6" fill="#4aa8a0"/></g><text x="1263.4" y="487.3" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+234</text><path d="M 1349.4,297.6 A 215,215 0 0 0 1010.6,297.6" fill="none" stroke="#e2614a" stroke-width="3.2" opacity="0.9"/><g opacity="1.0"><line x1="1021.6" y1="306.3" x2="1020.0" y2="305.0" stroke="#e2614a" stroke-width="3.2" stroke-linecap="round"/><polygon points="1010.6,297.6 1018.0,310.9 1025.2,301.6" fill="#e2614a"/></g><text x="1180.0" y="199.0" fill="#e2614a" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">and the car rotates</text><text x="1010.0" y="680.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">total drive     +247 N</text><text x="1010.0" y="704.0" fill="#e2614a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">left/right gap  +1298 N</text><text x="1010.0" y="738.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The driver's demand for total force is met</text><text x="1010.0" y="759.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">exactly; the difference between the right-hand</text><text x="1010.0" y="780.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">wheels and the left-hand ones is the moment.</text><text x="1010.0" y="801.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">More force on the right turns the nose left.</text><line x1="70.0" y1="830.0" x2="1420.0" y2="830.0" stroke="#2e2e31" stroke-width="1.0"/><text x="70.0" y="864.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">That split — one layer deciding how much rotation you want, another deciding who pays — is the classical architecture, and the reason it has lasted</text><text x="70.0" y="886.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">is that the halves can be built, tuned and argued about separately. The upper layer is a vehicle-dynamics judgement with two numbers in it. The</text><text x="70.0" y="908.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">lower layer is a convex optimisation with a unique answer. Neither has to know how the other works.</text><text x="40.0" y="947.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long exit (393 m), grip_use swept to failure  -  [MEASURED] reference model K=0.20 deg/g, grip ceiling 0.95 g</text><text x="40.0" y="960.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED — CITATION OUTSTANDING] ~9% skidpad ceiling, FSAE  -  [LIKELY] track width — the moment arm; conclusion re-run at +/-3%  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="982" fill="#6f6a63" font-size="11" font-style="italic">Arrow length is longitudinal force at the contact patch, to scale within the panel; teal pushes forward, red drags back. Both cars are drawn nose-up and are turning left. One instant, taken where the controller is working hardest.</text></svg>