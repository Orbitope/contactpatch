<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="940" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Two methods that share nothing but the physics</text><text x="40" y="70" fill="#6f6a63" font-size="13">A policy that learned to drive by crashing several hundred thousand times, and a solver that computed the answer in one shot. Asked the same question about the same cars.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Each curve is normalised to its own mean and spread. The absolute times are NOT comparable — different entry speed, and only one of them enforces the slip envelope. Only designs where BOTH methods gave a trustworthy answer are compared.</text><text x="140.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Normalised lap time against balance</text><line x1="295" y1="170" x2="295" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="450" y1="170" x2="450" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="605" y1="170" x2="605" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="140" y1="282" x2="760" y2="282" stroke="#2e2e31" stroke-width="1"/><line x1="140" y1="395" x2="760" y2="395" stroke="#2e2e31" stroke-width="1"/><line x1="140" y1="508" x2="760" y2="508" stroke="#2e2e31" stroke-width="1"/><line x1="140" y1="620" x2="760" y2="620" stroke="#6f6a63" stroke-width="1"/><line x1="140" y1="170" x2="140" y2="620" stroke="#6f6a63" stroke-width="1"/><text x="163" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">40</text><text x="324" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">47</text><text x="484" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">54</text><text x="645" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">61</text><text x="737" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">65</text><text x="130" y="572" fill="#6f6a63" font-size="11" text-anchor="end">-2</text><text x="130" y="486" fill="#6f6a63" font-size="11" text-anchor="end">-1</text><text x="130" y="399" fill="#6f6a63" font-size="11" text-anchor="end">+0</text><text x="130" y="312" fill="#6f6a63" font-size="11" text-anchor="end">+1</text><text x="130" y="226" fill="#6f6a63" font-size="11" text-anchor="end">+2</text><text x="450.0" y="666" fill="#e8e4dd" font-size="12.5" text-anchor="middle">front mass fraction (%)</text><text x="82" y="395.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 82 395.0)">standard deviations from that method's own mean</text><line x1="140" y1="395.0" x2="760" y2="395.0" stroke="#6f6a63" stroke-width="1" stroke-dasharray="3 5"/><path d="M 323.7,507.9 L 484.4,441.0 L 645.2,350.7 L 737.0,280.4" fill="none" stroke="#e2614a" stroke-width="2.8"/><line x1="323.7" y1="540.2" x2="323.7" y2="475.6" stroke="#e2614a" stroke-width="1.6" opacity="0.8"/><circle cx="323.7" cy="507.9" r="4" fill="#e2614a"/><line x1="484.4" y1="470.9" x2="484.4" y2="411.1" stroke="#e2614a" stroke-width="1.6" opacity="0.8"/><circle cx="484.4" cy="441.0" r="4" fill="#e2614a"/><line x1="645.2" y1="379.0" x2="645.2" y2="322.3" stroke="#e2614a" stroke-width="1.6" opacity="0.8"/><circle cx="645.2" cy="350.7" r="4" fill="#e2614a"/><line x1="737.0" y1="309.4" x2="737.0" y2="251.4" stroke="#e2614a" stroke-width="1.6" opacity="0.8"/><circle cx="737.0" cy="280.4" r="4" fill="#e2614a"/><path d="M 323.7,496.1 L 484.4,453.0 L 645.2,358.7 L 737.0,272.3" fill="none" stroke="#4aa8a0" stroke-width="2.8" stroke-dasharray="8 6"/><circle cx="323.7" cy="496.1" r="4" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.6"/><circle cx="484.4" cy="453.0" r="4" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.6"/><circle cx="645.2" cy="358.7" r="4" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.6"/><circle cx="737.0" cy="272.3" r="4" fill="#4aa8a0" stroke="#4aa8a0" stroke-width="1.6"/><rect x="137.0" y="170" width="52" height="450" fill="#6f6a63" opacity="0.07"/><line x1="155.0" y1="387.0" x2="171.0" y2="403.0" stroke="#6f6a63" stroke-width="2.4"/><line x1="155.0" y1="403.0" x2="171.0" y2="387.0" stroke="#6f6a63" stroke-width="2.4"/><text x="163.0" y="162.0" fill="#6f6a63" font-size="10" text-anchor="middle" font-weight="600" font-style="normal">excluded</text><text x="163.0" y="654.0" fill="#6f6a63" font-size="9.5" text-anchor="middle" font-weight="normal" font-style="normal">policy cannot drive it</text><line x1="810" y1="196" x2="852" y2="196" stroke="#e2614a" stroke-width="3"/><text x="864.0" y="201.0" fill="#e2614a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">the learned driver</text><text x="864.0" y="221.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">PPO, 5,000,000 steps, 12 rollouts per car</text><text x="864.0" y="237.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">deployed lap time; bars are one s.d. over jittered rollouts</text><line x1="810" y1="276" x2="852" y2="276" stroke="#4aa8a0" stroke-width="3" stroke-dasharray="8 6"/><text x="864.0" y="281.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">the solver</text><text x="864.0" y="301.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">Episode 7, minimum-time collocation</text><text x="864.0" y="317.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">unconverged solves are excluded, not drawn hollow</text><text x="810.0" y="370.0" fill="#e8e4dd" font-size="20" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shape correlation +0.99</text><text x="810.0" y="394.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">between the two normalised curves</text><text x="810.0" y="426.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">spread across balance:</text><text x="810.0" y="446.0" fill="#e2614a" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">learned  0.998 s</text><text x="810.0" y="464.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">solved   0.205 s</text><text x="810.0" y="494.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">fastest balance:</text><text x="810.0" y="514.0" fill="#e2614a" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">learned  47% front</text><text x="810.0" y="532.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">solved   47% front</text><line x1="140.0" y1="668.0" x2="1400.0" y2="668.0" stroke="#2e2e31" stroke-width="1.0"/><text x="140.0" y="700.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">This is the strongest check available in this project, and it is worth being precise about what it does and does not show.</text><text x="140.0" y="721.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="140.0" y="742.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">What is shared: the tire file, the four-wheel model, the corner. What is not: everything else. One method searches a continuous optimisation problem with exact</text><text x="140.0" y="763.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">gradients and perfect foresight; the other stumbles into a policy by trial and error and cannot see past the next two seconds of road.</text><text x="140.0" y="784.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="140.0" y="805.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">If both say the same thing about how balance affects lap time, that is hard to explain by a shared bug, because there is almost no shared code to hold one.</text><text x="140.0" y="826.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">If they disagree, one of them is wrong and the disagreement says where to look. Either outcome is worth more than another run of the same method.</text><text x="40.0" y="900.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] PPO on the double-track model, 5,000,000 steps, ONE policy  -  front mass fraction resampled 0.40-0.65 per episode  -  12 rollouts per design  -  [ASSUMED] reward = progress; slip envelope penalised at 0.5 per step of excess  -  absolute times NOT comparable — rule 6</text><text x="40" y="922" fill="#6f6a63" font-size="11" font-style="italic">Normalisation is to each method's own mean and standard deviation across the COMPARED designs, so only the shape is being compared. Raw times are in results.json for both.</text></svg>