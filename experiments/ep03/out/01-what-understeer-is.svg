<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="1000" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What understeer actually is</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same car on the same 30 m circle, driven gently and then as hard as it will go. Nothing about the car changes — only how fast it is going round.</text><text x="80.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Cruising — 0.20 g</text><text x="80.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">7.8 m/s (28 km/h)</text><g opacity="1.0"><line x1="330.0" y1="598.0" x2="330.0" y2="154.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="330.0,146.0 325.8,156.0 334.2,156.0" fill="#6f6a63"/></g><text x="330.0" y="134.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction the car is travelling</text><g transform="rotate(2.030 330.0 372.0)"><rect x="290.0" y="282.0" width="80.0" height="180.0" rx="20.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 321.0,298.0 L 330.0,286.0 L 339.0,298.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-4.94 284.8 318.0)"><line x1="284.8" y1="168.0" x2="284.8" y2="468.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="277.2" y="299.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="280.5" y="307.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="282.8" y1="304.0" x2="282.8" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="284.8" y1="304.0" x2="284.8" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="286.7" y1="304.0" x2="286.7" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-4.94 375.2 318.0)"><line x1="375.2" y1="168.0" x2="375.2" y2="468.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="367.8" y="299.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="371.0" y="307.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="373.3" y1="304.0" x2="373.3" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="375.2" y1="304.0" x2="375.2" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="377.2" y1="304.0" x2="377.2" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 284.8 426.0)"><rect x="277.2" y="407.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="280.5" y="415.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="282.8" y1="412.0" x2="282.8" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="284.8" y1="412.0" x2="284.8" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="286.7" y1="412.0" x2="286.7" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 375.2 426.0)"><rect x="367.8" y="407.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="371.0" y="415.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="373.3" y1="412.0" x2="373.3" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="375.2" y1="412.0" x2="375.2" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="377.2" y1="412.0" x2="377.2" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="480.0" y="296.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">front tires sliding</text><rect x="480" y="304" width="14.2" height="13" rx="3" fill="#e0a53c" opacity="0.85"/><text x="500.2" y="315.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.66°</text><text x="480.0" y="420.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">rear tires sliding</text><rect x="480" y="428" width="13.5" height="13" rx="3" fill="#4aa8a0" opacity="0.85"/><text x="499.5" y="439.0" fill="#4aa8a0" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.62°</text><text x="80.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">steering angle</text><text x="80.0" y="694.0" fill="#e8e4dd" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.9°</text><text x="260.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">front slides more than rear by</text><text x="260.0" y="694.0" fill="#e0a53c" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.03°</text><text x="450.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">nose points out of the corner by</text><text x="450.0" y="694.0" fill="#8a7bd8" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.0°</text><text x="780.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">At the limit — 1.01 g</text><text x="780.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">17.2 m/s (62 km/h)</text><g opacity="1.0"><line x1="1030.0" y1="598.0" x2="1030.0" y2="154.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="1030.0,146.0 1025.8,156.0 1034.2,156.0" fill="#6f6a63"/></g><text x="1030.0" y="134.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction the car is travelling</text><g transform="rotate(-2.906 1030.0 372.0)"><rect x="990.0" y="282.0" width="80.0" height="180.0" rx="20.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1021.0,298.0 L 1030.0,286.0 L 1039.0,298.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-6.30 984.8 318.0)"><line x1="984.8" y1="168.0" x2="984.8" y2="468.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="977.2" y="299.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="980.5" y="307.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="982.8" y1="304.0" x2="982.8" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="984.8" y1="304.0" x2="984.8" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="986.7" y1="304.0" x2="986.7" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-6.30 1075.2 318.0)"><line x1="1075.2" y1="168.0" x2="1075.2" y2="468.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="1067.8" y="299.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1071.0" y="307.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="1073.3" y1="304.0" x2="1073.3" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1075.2" y1="304.0" x2="1075.2" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1077.2" y1="304.0" x2="1077.2" y2="332.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 984.8 426.0)"><rect x="977.2" y="407.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="980.5" y="415.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="982.8" y1="412.0" x2="982.8" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="984.8" y1="412.0" x2="984.8" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="986.7" y1="412.0" x2="986.7" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1075.2 426.0)"><rect x="1067.8" y="407.0" width="15.0" height="38.0" rx="4.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1071.0" y="415.3" width="8.5" height="21.3" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="1073.3" y1="412.0" x2="1073.3" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1075.2" y1="412.0" x2="1075.2" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1077.2" y1="412.0" x2="1077.2" y2="440.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="1180.0" y="296.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">front tires sliding</text><rect x="1180" y="304" width="150.0" height="13" rx="3" fill="#e0a53c" opacity="0.85"/><text x="1336.0" y="315.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6.94°</text><text x="1180.0" y="420.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">rear tires sliding</text><rect x="1180" y="428" width="119.9" height="13" rx="3" fill="#4aa8a0" opacity="0.85"/><text x="1305.9" y="439.0" fill="#4aa8a0" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5.55°</text><text x="780.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">steering angle</text><text x="780.0" y="694.0" fill="#e8e4dd" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6.3°</text><text x="960.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">front slides more than rear by</text><text x="960.0" y="694.0" fill="#e0a53c" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.40°</text><text x="1150.0" y="672.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">nose points into the corner by</text><text x="1150.0" y="694.0" fill="#8a7bd8" font-size="17" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.9°</text><line x1="60.0" y1="720.0" x2="1420.0" y2="720.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="762.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Understeer is the gap between those two numbers</text><text x="60.0" y="796.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">A cornering tire only makes grip by sliding slightly — that is Episode 1. So every axle runs at some slip angle.</text><text x="60.0" y="819.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal">Understeer means the front axle has to slide more than the rear to hold the same corner. You feel it as needing</text><text x="60.0" y="842.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">more steering than the corner geometrically requires, and as the car running wide when you ask for more.</text><text x="60.0" y="865.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="888.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Measured on this car: about 0.2° of extra steering per extra g (0.1-0.3 across the uncertainty in the car's own numbers). A real road</text><text x="60.0" y="911.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">car is 1.8-5.5. Ours is nearly neutral, and that is the model telling the truth about itself — a two-wheeled car cannot lean on its</text><text x="60.0" y="934.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">outside tires, and that is where most of a real car's understeer comes from.</text><text x="40.0" y="960.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model + Sedan_Pac02Tire.tir  ·  offsets removed  ·  m 1360 kg · L 2.575 m · 54% front · h 0.460 m  ·  [SOURCED] RV-1 parameters, vehicle-reference-parameters.md §1  ·  skidpad radius 30 m [ASSUMED]  ·  understeer gradient fitted over |a_y| ≤ 0.5 g [SOURCED definition, §4]</text><text x="40" y="982" fill="#6f6a63" font-size="11" font-style="italic">A car that understeers is not broken. It is a car whose front tires give up first — which is what almost every manufacturer deliberately builds, because running wide is recoverable and spinning is not.</text></svg>