<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="620" viewBox="0 0 1480 620" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="620" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">The most important graph in vehicle dynamics</text><text x="40" y="70" fill="#6f6a63" font-size="13">Peak friction coefficient falls as load rises — steadily, by 0.046 per additional kN — and that single fact is why sharing load evenly beats sharing it any other way.</text><text x="100.0" y="112.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">A · Peak grip against load</text><text x="100.0" y="131.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">one tire, swept from 0.5 to 9.5 kN</text><line x1="220" y1="130" x2="220" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="340" y1="130" x2="340" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="460" y1="130" x2="460" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="580" y1="130" x2="580" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="215" x2="700" y2="215" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="300" x2="700" y2="300" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="385" x2="700" y2="385" stroke="#2e2e31" stroke-width="1"/><line x1="100" y1="470" x2="700" y2="470" stroke="#6f6a63" stroke-width="1"/><line x1="100" y1="130" x2="100" y2="470" stroke="#6f6a63" stroke-width="1"/><text x="100" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0</text><text x="220" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">2</text><text x="340" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">4</text><text x="460" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">6</text><text x="580" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">8</text><text x="700" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">10</text><text x="90" y="440" fill="#6f6a63" font-size="11" text-anchor="end">0.80</text><text x="90" y="372" fill="#6f6a63" font-size="11" text-anchor="end">0.90</text><text x="90" y="304" fill="#6f6a63" font-size="11" text-anchor="end">1.00</text><text x="90" y="236" fill="#6f6a63" font-size="11" text-anchor="end">1.10</text><text x="90" y="168" fill="#6f6a63" font-size="11" text-anchor="end">1.20</text><text x="400.0" y="516" fill="#e8e4dd" font-size="12.5" text-anchor="middle">load (kN)</text><text x="42" y="300.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 42 300.0)">peak μ (Fy_peak / Fz)</text><path d="M 130.0,159.7 L 139.2,164.5 L 148.3,169.3 L 157.5,174.0 L 166.6,178.8 L 175.8,183.5 L 184.9,188.3 L 194.1,193.1 L 203.2,197.8 L 212.4,202.6 L 221.5,207.3 L 230.7,212.1 L 239.8,216.9 L 249.0,221.6 L 258.1,226.4 L 267.3,231.2 L 276.4,235.9 L 285.6,240.7 L 294.7,245.4 L 303.9,250.2 L 313.1,255.0 L 322.2,259.7 L 331.4,264.5 L 340.5,269.2 L 349.7,274.0 L 358.8,278.8 L 368.0,283.5 L 377.1,288.3 L 386.3,293.1 L 395.4,297.8 L 404.6,302.6 L 413.7,307.3 L 422.9,312.1 L 432.0,316.9 L 441.2,321.6 L 450.3,326.4 L 459.5,331.1 L 468.6,335.9 L 477.8,340.7 L 486.9,345.4 L 496.1,350.2 L 505.3,355.0 L 514.4,359.7 L 523.6,364.5 L 532.7,369.2 L 541.9,374.0 L 551.0,378.8 L 560.2,383.5 L 569.3,388.3 L 578.5,393.0 L 587.6,397.8 L 596.8,402.6 L 605.9,407.3 L 615.1,412.1 L 624.2,416.8 L 633.4,421.6 L 642.5,426.4 L 651.7,431.1 L 660.8,435.9 L 670.0,440.7" fill="none" stroke="#e2614a" stroke-width="2.8"/><path d="M 130.0,159.7 L 670.0,440.7" fill="none" stroke="#e0a53c" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="160.0" cy="175.3" r="4.5" fill="#e8e4dd"/><text x="160.0" y="163.3" fill="#e8e4dd" font-size="11" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.18 at 1 kN</text><circle cx="640.0" cy="425.1" r="4.5" fill="#e8e4dd"/><text x="640.0" y="413.1" fill="#e8e4dd" font-size="11" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.82 at 9 kN</text><text x="112.0" y="148.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">if grip scaled with load, this line would be flat</text><text x="830.0" y="112.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">B · What that costs a pair</text><text x="830.0" y="131.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">6 kN shared between two tires, increasingly unevenly</text><line x1="944" y1="130" x2="944" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1058" y1="130" x2="1058" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1172" y1="130" x2="1172" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="1286" y1="130" x2="1286" y2="470" stroke="#2e2e31" stroke-width="1"/><line x1="830" y1="215" x2="1400" y2="215" stroke="#2e2e31" stroke-width="1"/><line x1="830" y1="300" x2="1400" y2="300" stroke="#2e2e31" stroke-width="1"/><line x1="830" y1="385" x2="1400" y2="385" stroke="#2e2e31" stroke-width="1"/><line x1="830" y1="470" x2="1400" y2="470" stroke="#6f6a63" stroke-width="1"/><line x1="830" y1="130" x2="830" y2="470" stroke="#6f6a63" stroke-width="1"/><text x="830" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">0</text><text x="972" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">1</text><text x="1115" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">2</text><text x="1258" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">3</text><text x="1400" y="490" fill="#6f6a63" font-size="11" text-anchor="middle">4</text><text x="820" y="474" fill="#6f6a63" font-size="11" text-anchor="end">0%</text><text x="820" y="400" fill="#6f6a63" font-size="11" text-anchor="end">1%</text><text x="820" y="326" fill="#6f6a63" font-size="11" text-anchor="end">3%</text><text x="820" y="252" fill="#6f6a63" font-size="11" text-anchor="end">4%</text><text x="820" y="178" fill="#6f6a63" font-size="11" text-anchor="end">6%</text><text x="1115.0" y="516" fill="#e8e4dd" font-size="12.5" text-anchor="middle">kN moved from one tire to the other</text><text x="772" y="300.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 772 300.0)">grip lost, pair total (%)</text><path d="M 830.0,470.0 L 839.7,469.9 L 849.3,469.7 L 859.0,469.2 L 868.6,468.6 L 878.3,467.9 L 888.0,466.9 L 897.6,465.8 L 907.3,464.6 L 916.9,463.1 L 926.6,461.5 L 936.3,459.7 L 945.9,457.8 L 955.6,455.6 L 965.3,453.4 L 974.9,450.9 L 984.6,448.3 L 994.2,445.5 L 1003.9,442.5 L 1013.6,439.3 L 1023.2,436.0 L 1032.9,432.5 L 1042.5,428.9 L 1052.2,425.1 L 1061.9,421.1 L 1071.5,416.9 L 1081.2,412.6 L 1090.8,408.1 L 1100.5,403.4 L 1110.2,398.6 L 1119.8,393.6 L 1129.5,388.4 L 1139.2,383.0 L 1148.8,377.5 L 1158.5,371.8 L 1168.1,366.0 L 1177.8,359.9 L 1187.5,353.7 L 1197.1,347.4 L 1206.8,340.8 L 1216.4,334.1 L 1226.1,327.2 L 1235.8,320.2 L 1245.4,313.0 L 1255.1,305.6 L 1264.7,298.0 L 1274.4,290.3 L 1284.1,282.4 L 1293.7,274.3 L 1303.4,266.1 L 1313.1,257.7 L 1322.7,249.1 L 1332.4,240.3 L 1342.0,231.4 L 1351.7,222.3 L 1361.4,213.1 L 1371.0,203.6 L 1380.7,194.1 L 1390.3,184.3 L 1400.0,174.3" fill="none" stroke="#8a7bd8" stroke-width="2.8"/><circle cx="830.0" cy="470.0" r="4.5" fill="#e8e4dd" stroke="#1a1a1c" stroke-width="1.5"/><circle cx="1110.2" cy="398.6" r="4.5" fill="#e8e4dd" stroke="#1a1a1c" stroke-width="1.5"/><circle cx="1400.0" cy="174.3" r="4.5" fill="#e8e4dd" stroke="#1a1a1c" stroke-width="1.5"/><text x="842.0" y="456.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">curves upward — twice the imbalance costs more than twice</text><text x="1392.0" y="148.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">the three dots are the split_load_figure snapshots above</text><text x="40.0" y="580.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] Sedan_Pac02Tire.tir  ·  MF 2002 pure slip  ·  offsets removed  ·  Fz0′ 3929 N  ·  LMUY 1 · LKY 1 · LFZO 0.81  ·  fit is peak μ = -0.0459·kN + 1.229, R²=1.0000 over the swept range — the curve is not actually linear, this line is a reading aid; panel B holds total load fixed at 6 kN</text><text x="40" y="602" fill="#6f6a63" font-size="11" font-style="italic">Panel A is one tire; panel B is two, sharing the same total. Neither curve is a straight line, and that is the entire reason weight transfer matters to a car.</text></svg>