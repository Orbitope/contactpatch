<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" font-family="Inter, system-ui, sans-serif"><rect width="1560" height="980" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">The same controller asks for opposite things in one corner</text><text x="40" y="70" fill="#6f6a63" font-size="13">Three moments from a single lap of the same 40 m corner. Force arrows are to one scale across all three panels, and the grey bar behind each wheel is what that tire had left to give.</text><text x="60.0" y="152.0" fill="#e8e4dd" font-size="18" text-anchor="start" font-weight="600" font-style="normal">Turn-in</text><text x="60.0" y="176.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">78 m along the road   19.3 m/s</text><g transform="rotate(0.000 270.0 420.0)"><rect x="215.0" y="305.0" width="110" height="230" rx="27.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 261.0,321.0 L 270.0,309.0 L 279.0,321.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-4.24 207.3 351.0)"><rect x="196.3" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="201.4" y="341.3" width="11.8" height="19.3" rx="5.0" fill="#7f8ea3" opacity="0.9"/><line x1="203.5" y1="331.0" x2="203.5" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="207.3" y1="331.0" x2="207.3" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="211.2" y1="331.0" x2="211.2" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-4.24 332.7 351.0)"><rect x="321.7" y="326.0" width="22" height="50" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="324.1" y="330.0" width="17.1" height="42.0" rx="7.2" fill="#7f8ea3" opacity="0.9"/><line x1="328.8" y1="331.0" x2="328.8" y2="371.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="332.7" y1="3