.0°</text><text x="1248.0" y="523.0" fill="#6f6a63" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3,760 N</text><text x="1248.0" y="546.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">2% less than the peak —</text><text x="1248.0" y="562.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">more angle, less grip</text><text x="1248.0" y="588.0" fill="#8a7bd8" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="italic">past our 12° trust limit</text><text x="160.0" y="600.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">Those same five tires, drawn the way engineers usually draw them. Every point on this curve is one of the pictures above.</text><line x1="160.0" y1="760.0" x2="1330.0" y2="760.0" stroke="#6f6a63" stroke-width="1.0"/><path d="M 160.0,760.0 L 163.9,757.6 L 167.8,755.2 L 171.7,752.9 L 175.7,750.5 L 179.6,748.1 L 183.5,745.8 L 187.4,743.4 L 191.3,741.1 L 195.2,738.8 L 199.1,736.5 L 203.0,734.2 L 207.0,731.9 L 210.9,729.7 L 214.8,727.5 L 218.7,725.3 L 222.6,723.1 L 226.5,720.9 L 230.4,718.8 L 234.3,716.7 L 238.3,714.7 L 242.2,712.7 L 246.1,710.7 L 250.0,708.7 L 253.9,706.8 L 257.8,704.9 L 261.7,703.0 L 265.7,701.2 L 269.6,699.4 L 273.5,697.6 L 277.4,695.9 L 281.3,694.2 L 285.2,692.6 L 289.1,690.9 L 293.0,689.4 L 297.0,687.8 L 300.9,686.3 L 304.8,684.8 L 308.7,683.4 L 312.6,682.0 L 316.5,680.6 L 320.4,679.3 L 324.3,678.0 L 328.3,676.7 L 332.2,675.5 L 336.1,674.3 L 340.0,673.1 L 343.9,672.0 L 347.8,670.9 L 351.7,669.8 L 355.7,668.8 L 359.6,667.8 L 363.5,666.8 L 367.4,665.9 L 371.3,664.9 L 375.2,664.0 L 379.1,663.2 L 383.0,662.3 L 387.0,661.5 L 390.9,660.7 L 394.8,659.9 L 398.7,659.2 L 402.6,658.5 L 406.5,657.8 L 410.4,657.1 L 414.3,656.5 L 418.3,655.8 L 422.2,655.2 L 426.1,654.6 L 430.0,654.0 L 433.9,653.5 L 437.8,653.