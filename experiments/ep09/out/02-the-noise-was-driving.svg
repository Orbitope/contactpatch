<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="940" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Why the noise was doing the braking</text><text x="40" y="70" fill="#6f6a63" font-size="13">The car's brakes are stronger than its engine — 12 kN against 4.5 kN — so the map from the policy's throttle action to actual force has a kink at zero. That kink is real physics. What it does to a noisy policy is not.</text><line x1="258" y1="190" x2="258" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="385" y1="190" x2="385" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="512" y1="190" x2="512" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="130" y1="298" x2="640" y2="298" stroke="#2e2e31" stroke-width="1"/><line x1="130" y1="405" x2="640" y2="405" stroke="#2e2e31" stroke-width="1"/><line x1="130" y1="512" x2="640" y2="512" stroke="#2e2e31" stroke-width="1"/><line x1="130" y1="620" x2="640" y2="620" stroke="#6f6a63" stroke-width="1"/><line x1="130" y1="190" x2="130" y2="620" stroke="#6f6a63" stroke-width="1"/><text x="130" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">-1.0</text><text x="258" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">-0.5</text><text x="385" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+0.0</text><text x="512" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+0.5</text><text x="640" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+1.0</text><text x="120" y="624" fill="#6f6a63" font-size="11" text-anchor="end">-12</text><text x="120" y="520" fill="#6f6a63" font-size="11" text-anchor="end">-8</text><text x="120" y="416" fill="#6f6a63" font-size="11" text-anchor="end">-4</text><text x="120" y="311" fill="#6f6a63" font-size="11" text-anchor="end">+0</text><text x="120" y="207" fill="#6f6a63" font-size="11" text-anchor="end">+4</text><text x="385.0" y="666" fill="#e8e4dd" font-size="12.5" text-anchor="middle">throttle action</text><text x="72" y="405.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 72 405.0)">force at the wheels (kN)</text><path d="M 130.0,620.0 L 132.6,616.9 L 135.1,613.7 L 137.7,610.6 L 140.2,607.5 L 142.8,604.4 L 145.3,601.2 L 147.9,598.1 L 150.4,595.0 L 152.9,591.9 L 155.5,588.7 L 158.1,585.6 L 160.6,582.5 L 163.2,579.3 L 165.7,576.2 L 168.2,573.1 L 170.8,570.0 L 173.4,566.8 L 175.9,563.7 L 178.4,560.6 L 181.0,557.5 L 183.5,554.3 L 186.1,551.2 L 188.7,548.1 L 191.2,544.9 L 193.8,541.8 L 196.3,538.7 L 198.9,535.6 L 201.4,532.4 L 203.9,529.3 L 206.5,526.2 L 209.1,523.1 L 211.6,519.9 L 214.2,516.8 L 216.7,513.7 L 219.3,510.5 L 221.8,507.4 L 224.3,504.3 L 226.9,501.2 L 229.4,498.0 L 232.0,494.9 L 234.6,491.8 L 237.1,488.7 L 239.6,485.5 L 242.2,482.4 L 244.8,479.3 L 247.3,476.1 L 249.8,473.0 L 252.4,469.9 L 254.9,466.8 L 257.5,463.6 L 260.1,460.5 L 262.6,457.4 L 265.1,454.3 L 267.7,451.1 L 270.2,448.0 L 272.8,444.9 L 275.4,441.7 L 277.9,438.6 L 280.4,435.5 L 283.0,432.4 L 285.5,429.2 L 288.1,426.1 L 290.6,423.0 L 293.2,419.9 L 295.8,416.7 L 298.3,413.6 L 300.9,410.5 L 303.4,407.3 L 306.0,404.2 L 308.5,401.1 L 311.0,398.0 L 313.6,394.8 L 316.1,391.7 L 318.7,388.6 L 321.2,385.5 L 323.8,382.3 L 326.4,379.2 L 328.9,376.1 L 331.5,372.9 L 334.0,369.8 L 336.6,366.7 L 339.1,363.6 L 341.6,360.4 L 344.2,357.3 L 346.8,354.2 L 349.3,351.1 L 351.9,347.9 L 354.4,344.8 L 357.0,341.7 L 359.5,338.5 L 362.1,335.4 L 364.6,332.3 L 367.1,329.2 L 369.7,326.0 L 372.2,322.9 L 374.8,319.8 L 377.4,316.7 L 379.9,313.5 L 382.4,310.4 L 385.0,307.3 L 387.6,306.1 L 390.1,304.9 L 392.7,303.8 L 395.2,302.6 L 397.8,301.4 L 400.3,300.2 L 402.9,299.1 L 405.4,297.9 L 408.0,296.7 L 410.5,295.5 L 413.1,294.4 L 415.6,293.2 L 418.2,292.0 L 420.7,290.9 L 423.3,289.7 L 425.8,288.5 L 428.3,287.3 L 430.9,286.2 L 433.4,285.0 L 436.0,283.8 L 438.6,282.6 L 441.1,281.5 L 443.6,280.3 L 446.2,279.1 L 448.8,278.0 L 451.3,276.8 L 453.9,275.6 L 456.4,274.4 L 458.9,273.3 L 461.5,272.1 L 464.1,270.9 L 466.6,269.7 L 469.2,268.6 L 471.7,267.4 L 474.2,266.2 L 476.8,265.1 L 479.4,263.9 L 481.9,262.7 L 484.5,261.5 L 487.0,260.4 L 489.5,259.2 L 492.1,258.0 L 494.6,256.8 L 497.2,255.7 L 499.8,254.5 L 502.3,253.3 L 504.8,252.2 L 507.4,251.0 L 509.9,249.8 L 512.5,248.6 L 515.0,247.5 L 517.6,246.3 L 520.2,245.1 L 522.7,243.9 L 525.2,242.8 L 527.8,241.6 L 530.4,240.4 L 532.9,239.3 L 535.5,238.1 L 538.0,236.9 L 540.5,235.7 L 543.1,234.6 L 545.7,233.4 L 548.2,232.2 L 550.8,231.0 L 553.3,229.9 L 555.8,228.7 L 558.4,227.5 L 561.0,226.4 L 563.5,225.2 L 566.0,224.0 L 568.6,222.8 L 571.1,221.7 L 573.7,220.5 L 576.2,219.3 L 578.8,218.1 L 581.4,217.0 L 583.9,215.8 L 586.5,214.6 L 589.0,213.5 L 591.5,212.3 L 594.1,211.1 L 596.7,209.9 L 599.2,208.8 L 601.8,207.6 L 604.3,206.4 L 606.9,205.2 L 609.4,204.1 L 612.0,202.9 L 614.5,201.7 L 617.0,200.6 L 619.6,199.4 L 622.1,198.2 L 624.7,197.0 L 627.2,195.9 L 629.8,194.7 L 632.3,193.5 L 634.9,192.3 L 637.5,191.2 L 640.0,190.0" fill="none" stroke="#e8e4dd" stroke-width="2.6"/><circle cx="385.0" cy="307.3" r="7" fill="none" stroke="#e0a53c" stroke-width="2.4"/><text x="399.0" y="297.3" fill="#e0a53c" font-size="12" text-anchor="start" font-weight="600" font-style="normal">the kink</text><text x="130.0" y="168.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">A · The action-to-force map</text><line x1="938" y1="190" x2="938" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="1075" y1="190" x2="1075" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="1212" y1="190" x2="1212" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="800" y1="298" x2="1350" y2="298" stroke="#2e2e31" stroke-width="1"/><line x1="800" y1="405" x2="1350" y2="405" stroke="#2e2e31" stroke-width="1"/><line x1="800" y1="512" x2="1350" y2="512" stroke="#2e2e31" stroke-width="1"/><line x1="800" y1="620" x2="1350" y2="620" stroke="#6f6a63" stroke-width="1"/><line x1="800" y1="190" x2="800" y2="620" stroke="#6f6a63" stroke-width="1"/><text x="800" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">-0.4</text><text x="983" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+0.0</text><text x="1167" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+0.4</text><text x="1350" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">+0.8</text><text x="790" y="581" fill="#6f6a63" font-size="11" text-anchor="end">-4</text><text x="790" y="495" fill="#6f6a63" font-size="11" text-anchor="end">-2</text><text x="790" y="409" fill="#6f6a63" font-size="11" text-anchor="end">+0</text><text x="790" y="323" fill="#6f6a63" font-size="11" text-anchor="end">+2</text><text x="790" y="237" fill="#6f6a63" font-size="11" text-anchor="end">+4</text><text x="1075.0" y="666" fill="#e8e4dd" font-size="12.5" text-anchor="middle">the policy's MEAN throttle action</text><text x="742" y="405.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 742 405.0)">force actually delivered (kN)</text><path d="M 800.0,611.4 L 822.9,585.6 L 845.8,559.8 L 868.8,534.0 L 891.7,508.2 L 914.6,482.4 L 937.5,456.6 L 960.4,430.8 L 983.3,405.0 L 1006.2,395.3 L 1029.2,385.6 L 1052.1,376.0 L 1075.0,366.3 L 1097.9,356.6 L 1120.8,346.9 L 1143.8,337.3 L 1166.7,327.6 L 1189.6,317.9 L 1212.5,308.2 L 1235.4,298.6 L 1258.3,288.9 L 1281.2,279.2 L 1304.2,269.5 L 1327.1,259.9 L 1350.0,250.2" fill="none" stroke="#6f6a63" stroke-width="2.2" stroke-dasharray="7 6"/><path d="M 800.0,614.6 L 822.9,593.6 L 845.8,571.9 L 868.8,550.4 L 891.7,529.5 L 914.6,509.3 L 937.5,489.3 L 960.4,469.7 L 983.3,452.0 L 1006.2,434.8 L 1029.2,418.8 L 1052.1,402.2 L 1075.0,389.4 L 1097.9,373.8 L 1120.8,362.4 L 1143.8,349.1 L 1166.7,336.6 L 1189.6,326.7 L 1212.5,316.4 L 1235.4,306.3 L 1258.3,296.0 L 1281.2,287.5 L 1304.2,278.9 L 1327.1,270.6 L 1350.0,263.3" fill="none" stroke="#e2614a" stroke-width="2.8"/><text x="800.0" y="168.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">B · What the policy actually delivers</text><text x="800.0" y="187.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">sampling with standard deviation 0.37</text><text x="1344.0" y="240.2" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">what the mean action asks for</text><text x="1344.0" y="285.3" fill="#e2614a" font-size="11" text-anchor="end" font-weight="600" font-style="normal">what sampling delivers</text><line x1="983.3" y1="405.0" x2="983.3" y2="452.0" stroke="#e0a53c" stroke-width="2"/><text x="993.3" y="428.5" fill="#e0a53c" font-size="11" text-anchor="start" font-weight="600" font-style="normal">1.1 kN of braking</text><text x="993.3" y="443.5" fill="#e0a53c" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">the mean action does not have</text><line x1="70.0" y1="670.0" x2="1400.0" y2="670.0" stroke="#2e2e31" stroke-width="1.0"/><text x="70.0" y="702.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">A straight line through a kink is not a straight line. Average a spread of throttle actions around zero and the samples that fall below zero are multiplied by 12 kN while</text><text x="70.0" y="723.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the ones above are multiplied by 4.5 — so the average FORCE is braking even when the average ACTION is not. E[f(a)] is not f(E[a]).</text><text x="70.0" y="744.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="70.0" y="765.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">THE POLICY NEVER LEARNED TO BRAKE. It learned a mean throttle that produces braking once its own noise is added, and the corner is only survivable with that braking</text><text x="70.0" y="786.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">included. Switch the noise off to deploy it and the braking disappears with it.</text><text x="70.0" y="807.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="70.0" y="828.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Nothing here is a bug in the physics. The brakes really are stronger than the engine. The problem is that a Gaussian policy and a kinked actuator make a driver whose</text><text x="70.0" y="849.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">behaviour lives in the noise, and no training curve shows that.</text><text x="40.0" y="900.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] PPO on the double-track model, 1,200,000 steps  -  seed 0  -  std init [-2.5, -1.0]  -  [ASSUMED] reward = progress only; slip envelope NOT enforced</text><text x="40" y="922" fill="#6f6a63" font-size="11" font-style="italic">Panel B is a Monte Carlo over 20,000 samples per mean action, through the same clipping and force map the environment applies.</text></svg>