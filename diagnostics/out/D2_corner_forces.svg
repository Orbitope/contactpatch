<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="820" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Which way the tires push, and why left mirrors right</text><text x="40" y="70" fill="#6f6a63" font-size="13">A car holding a steady circle. The wheels are pointed slightly away from where they are travelling, and the grip that produces is what bends the car's path. Two of D2's sign checks, drawn.</text><text x="150.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Turning left</text><text x="150.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">0.76 g</text><g opacity="1.0"><line x1="380.0" y1="580.0" x2="380.0" y2="128.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="380.0,120.0 375.8,130.0 384.2,130.0" fill="#6f6a63"/></g><text x="380.0" y="108.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(-0.255 380.0 350.0)"><rect x="336.0" y="250.0" width="88" height="200" rx="22.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 371.0,266.0 L 380.0,254.0 L 389.0,266.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-5.12 330.1 290.0)"><line x1="330.1" y1="170.0" x2="330.1" y2="410.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="321.6" y="268.0" width="17" height="44" rx="4.7" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="325.0" y="277.7" width="10.0" height="24.7" rx="4.2" fill="#7f8ea3" opacity="0.9"/><line x1="327.6" y1="273.0" x2="327.6" y2="307.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="330.1" y1="273.0" x2="330.1" y2="307.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="332.