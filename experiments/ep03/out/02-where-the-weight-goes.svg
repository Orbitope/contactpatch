<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="940" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Where the weight goes when you brake</text><text x="40" y="70" fill="#6f6a63" font-size="13">The car weighs 1,360 kg no matter what it is doing — 13.3 kN pressing on the road, always. What changes is how that weight is shared between the front and rear tires.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">The shaded band across each tire is its contact patch. Bigger band, more weight on that tire. Nothing is added or removed — it only moves.</text><text x="130.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Braking hard</text><text x="130.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">-5 m/s² (-0.51 g)</text><g transform="rotate(0.000 300.0 380.0)"><rect x="254.0" y="275.0" width="92" height="210" rx="23.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 291.0,291.0 L 300.0,279.0 L 309.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 247.7 317.0)"><rect x="238.7" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="241.0" y="297.7" width="13.3" height="38.6" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="244.9" y1="299.0" x2="244.9" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="247.7" y1="299.0" x2="247.7" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="250.4" y1="299.0" x2="250.4" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 352.3 317.0)"><rect x="343.3" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="345.7" y="297.7" width="13.3" height="38.6" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="349.6" y1="299.0" x2="349.6" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="352.3" y1="299.0" x2="352.3" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="355.1" y1="299.0" x2="355.1" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 247.7 443.0)"><rect x="238.7" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="243.8" y="437.9" width="7.7" height="10.1" rx="3.2" fill="#7f8ea3" opacity="0.9"/><line x1="244.9" y1="425.0" x2="244.9" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="247.7" y1="425.0" x2="247.7" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="250.4" y1="425.0" x2="250.4" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 352.3 443.0)"><rect x="343.3" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="348.4" y="437.9" width="7.7" height="10.1" rx="3.2" fill="#7f8ea3" opacity="0.9"/><line x1="349.6" y1="425.0" x2="349.6" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="352.3" y1="425.0" x2="352.3" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="355.1" y1="425.0" x2="355.1" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="428.0" y1="458.0" x2="428.0" y2="312.2" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="428.0,302.0 423.0,314.0 433.0,314.0" fill="#e2614a"/></g><text x="442.0" y="374.0" fill="#e2614a" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">weight shifts</text><text x="442.0" y="390.0" fill="#e2614a" font-size="11.5" text-anchor="start" font-weight="600" font-style="normal">onto the front</text><text x="150.0" y="314.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="150.0" y="332.0" fill="#e2614a" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">8.42 kN</text><text x="150.0" y="458.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="150.0" y="476.0" fill="#e2614a" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.92 kN</text><text x="150.0" y="530.0" fill="#e8e4dd" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">total 13.34 kN</text><text x="150.0" y="548.0" fill="#e2614a" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">+17% on the front</text><text x="570.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Steady</text><text x="570.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">no braking, no throttle</text><g transform="rotate(0.000 740.0 380.0)"><rect x="694.0" y="275.0" width="92" height="210" rx="23.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 731.0,291.0 L 740.0,279.0 L 749.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 687.7 317.0)"><rect x="678.7" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="682.0" y="302.6" width="11.4" height="28.7" rx="4.8" fill="#7f8ea3" opacity="0.9"/><line x1="685.0" y1="299.0" x2="685.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="687.7" y1="299.0" x2="687.7" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="690.5" y1="299.0" x2="690.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 792.3 317.0)"><rect x="783.3" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="786.6" y="302.6" width="11.4" height="28.7" rx="4.8" fill="#7f8ea3" opacity="0.9"/><line x1="789.5" y1="299.0" x2="789.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="792.3" y1="299.0" x2="792.3" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="795.0" y1="299.0" x2="795.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 687.7 443.0)"><rect x="678.7" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="682.9" y="433.0" width="9.6" height="20.0" rx="4.1" fill="#7f8ea3" opacity="0.9"/><line x1="685.0" y1="425.0" x2="685.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="687.7" y1="425.0" x2="687.7" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="690.5" y1="425.0" x2="690.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 792.3 443.0)"><rect x="783.3" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="787.5" y="433.0" width="9.6" height="20.0" rx="4.1" fill="#7f8ea3" opacity="0.9"/><line x1="789.5" y1="425.0" x2="789.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="792.3" y1="425.0" x2="792.3" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="795.0" y1="425.0" x2="795.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="590.0" y="314.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="590.0" y="332.0" fill="#6f6a63" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7.20 kN</text><text x="590.0" y="458.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="590.0" y="476.0" fill="#6f6a63" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6.14 kN</text><text x="590.0" y="530.0" fill="#e8e4dd" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">total 13.34 kN</text><text x="1010.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Accelerating hard</text><text x="1010.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">+5 m/s² (+0.51 g)</text><g transform="rotate(0.000 1180.0 380.0)"><rect x="1134.0" y="275.0" width="92" height="210" rx="23.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1171.0,291.0 L 1180.0,279.0 L 1189.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 1127.7 317.0)"><rect x="1118.7" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1123.0" y="307.6" width="9.4" height="18.8" rx="4.0" fill="#7f8ea3" opacity="0.9"/><line x1="1125.0" y1="299.0" x2="1125.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1127.7" y1="299.0" x2="1127.7" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1130.5" y1="299.0" x2="1130.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1232.3 317.0)"><rect x="1223.3" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1227.6" y="307.6" width="9.4" height="18.8" rx="4.0" fill="#7f8ea3" opacity="0.9"/><line x1="1229.5" y1="299.0" x2="1229.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1232.3" y1="299.0" x2="1232.3" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1235.0" y1="299.0" x2="1235.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1127.7 443.0)"><rect x="1118.7" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1121.9" y="428.0" width="11.6" height="29.9" rx="4.9" fill="#7f8ea3" opacity="0.9"/><line x1="1125.0" y1="425.0" x2="1125.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1127.7" y1="425.0" x2="1127.7" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1130.5" y1="425.0" x2="1130.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1232.3 443.0)"><rect x="1223.3" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1226.5" y="428.0" width="11.6" height="29.9" rx="4.9" fill="#7f8ea3" opacity="0.9"/><line x1="1229.5" y1="425.0" x2="1229.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1232.3" y1="425.0" x2="1232.3" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1235.0" y1="425.0" x2="1235.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="1308.0" y1="302.0" x2="1308.0" y2="447.8" stroke="#4aa8a0" stroke-width="3.0" stroke-linecap="round"/><polygon points="1308.0,458.0 1313.0,446.0 1303.0,446.0" fill="#4aa8a0"/></g><text x="1322.0" y="374.0" fill="#4aa8a0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">weight shifts</text><text x="1322.0" y="390.0" fill="#4aa8a0" font-size="11.5" text-anchor="start" font-weight="600" font-style="normal">onto the rear</text><text x="1030.0" y="314.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="1030.0" y="332.0" fill="#4aa8a0" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5.99 kN</text><text x="1030.0" y="458.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="1030.0" y="476.0" fill="#4aa8a0" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7.35 kN</text><text x="1030.0" y="530.0" fill="#e8e4dd" font-size="12" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">total 13.34 kN</text><text x="1030.0" y="548.0" fill="#4aa8a0" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">-17% on the front</text><line x1="60.0" y1="660.0" x2="1420.0" y2="660.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="700.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Why this matters, and it is Episode 2 again</text><text x="60.0" y="734.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Braking at 0.5 g puts about 17% more weight on the front tires and takes the same off the rear. The total never changes.</text><text x="60.0" y="756.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="778.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">But grip does not follow weight one-for-one — a tire pressed harder gives back less than proportionally (Episode 2). So the</text><text x="60.0" y="800.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">front tires gain less grip than the rear ones lose, and the car has less total grip while braking than while cruising.</text><text x="60.0" y="822.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="844.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Double the height of the centre of gravity and you double the transfer. That is the entire reason sports cars are low, and it is why</text><text x="60.0" y="866.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the GR86's 460 mm figure is the number Toyota's engineers put in the press kit.</text><text x="40.0" y="900.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model + Sedan_Pac02Tire.tir  ·  offsets removed  ·  m 1360 kg · L 2.575 m · h 0.460 m · 54% front  ·  [SOURCED] RV-1 parameters, vehicle-reference-parameters.md §1  ·  acceleration values [ASSUMED] round numbers for illustration</text><text x="40" y="922" fill="#6f6a63" font-size="11" font-style="italic">Longitudinal load transfer is m·a_x·h/L, exactly — no tuning, no fudge factor. D2 asserts the signs, the conservation, and the proportionality to centre-of-gravity height.</text></svg>