ext x="90" y="168" fill="#6f6a63" font-size="11" text-anchor="end">6</text><text x="330.0" y="496" fill="#e8e4dd" font-size="12.5" text-anchor="middle">lateral acceleration (g)</text><text x="42" y="295.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 42 295.0)">wheel load (kN)</text><path d="M 137.2,269.0 L 145.0,267.0 L 153.6,264.9 L 162.9,262.6 L 173.0,260.1 L 183.8,257.4 L 195.3,254.6 L 207.6,251.5 L 220.6,248.3 L 234.4,244.9 L 248.9,241.4 L 264.2,237.6 L 280.2,233.7 L 296.9,229.7 L 314.4,225.4 L 332.7,221.0 L 351.7,216.5 L 371.4,211.8 L 391.9,206.9 L 413.1,201.9 L 435.0,196.9 L 457.8,191.7 L 481.2,186.5 L 505.4,181.4" fill="none" stroke="#e2614a" stroke-width="2.2"/><text x="554.0" y="185.4" fill="#e2614a" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">outside front</text><path d="M 137.2,296.4 L 145.0,294.9 L 153.6,293.2 L 162.9,291.4 L 173.0,289.4 L 183.8,287.3 L 195.3,285.0 L 207.6,282.5 L 220.6,279.9 L 234.4,277.2 L 248.9,274.3 L 264.2,271.2 L 280.2,268.0 L 296.9,264.6 L 314.4,261.1 L 332.7,257.4 L 351.7,253.5 L 371.4,249.4 L 391.9,245.1 L 413.1,240.7 L 435.0,236.0 L 457.8,231.0 L 481.2,225.8 L 505.4,220.1" fill="none" stroke="#e0a53c" stroke-width="2.2"/><text x="554.0" y="224.1" fill="#e0a53c" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">outside rear</text><path d="M 137.2,287.1 L 145.0,289.0 L 153.6,291.1 L 162.9,293.3 L 173.0,295.7 L 183.8,298.3 L 195.3,301.1 L 207.6,304.1 L 220.6,307.2 L 234.4,310.5 L 248.9,314.1 L 264.2,317.8 L 280.2,321.7 L 296.9,325.8 L 314.4,330.1 L 332.7,334.6 L 351.7,339.3 L 371.4,344.3 L 391.9,349.4 L 413.1,354.8 L 435.0,360.4 L 457.8,366.3 L 481.2,372.6 L 505.4,379.3" fill="none" stroke="#4aa8a0" stroke-width="2.2"/><text x="554.0" y="383.3" fill="#4aa8a0" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">inside front</text><path d="M 137.2,311.4 L 145.0,313.0 L 153.6,314.8 L 162.9,316.7 L 173.0,318.7 L 183.8,320.9