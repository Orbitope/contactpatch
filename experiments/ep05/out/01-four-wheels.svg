<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="1010" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What the second track buys you</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same car on the same circle as Episode 3 — but now it has a left and a right. Cornering leans on the outside wheels, and because grip falls as load rises, that costs the car grip nothing spent.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Contact-patch size is load. Watch the inside pair shrink.</text><text x="110.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Cruising - 0.20 g</text><text x="110.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">7.8 m/s, turning left</text><g opacity="1.0"><line x1="360.0" y1="650.0" x2="360.0" y2="158.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="360.0,150.0 355.8,160.0 364.2,160.0" fill="#6f6a63"/></g><text x="360.0" y="138.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(2.031 360.0 400.0)"><rect x="308.0" y="280.0" width="104" height="240" rx="26.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 351.0,296.0 L 360.0,284.0 L 369.0,296.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-4.94 300.3 328.0)"><rect x="289.3" y="301.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="293.9" y="315.1" width="12.9" height="25.7" rx="5.4" fill="#7f8ea3" opacity="0.9"/><line x1="296.4" y1="306.0" x2="296.4" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="300.3" y1="306.0" x2="300.3" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="304.2" y1="306.0" x2="304.2" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-4.94 419.7 328.0)"><rect x="408.7" y="301.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="412.5" y="311.5" width="14.4" height="33.0" rx="6.1" fill="#7f8ea3" opacity="0.9"/><line x1="415.8" y1="306.0" x2="415.8" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="419.7" y1="306.0" x2="419.7" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="423.6" y1="306.0" x2="423.6" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 300.3 472.0)"><rect x="289.3" y="445.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="294.3" y="461.0" width="12.1" height="22.0" rx="5.1" fill="#7f8ea3" opacity="0.9"/><line x1="296.4" y1="450.0" x2="296.4" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="300.3" y1="450.0" x2="300.3" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="304.2" y1="450.0" x2="304.2" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 419.7 472.0)"><rect x="408.7" y="445.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="413.0" y="458.0" width="13.4" height="28.0" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="415.8" y1="450.0" x2="415.8" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="419.7" y1="450.0" x2="419.7" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="423.6" y1="450.0" x2="423.6" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="210.0" y="324.0" fill="#e2614a" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3.15 kN</text><text x="510.0" y="324.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.07 kN</text><text x="210.0" y="494.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.68 kN</text><text x="510.0" y="494.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3.44 kN</text><text x="360.0" y="700.0" fill="#e8e4dd" font-size="13" text-anchor="middle" font-weight="600" font-style="normal">outside pair carries 1.3x the inside pair</text><text x="360.0" y="722.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">total 13.34 kN - unchanged</text><text x="810.0" y="150.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">At the limit - 0.93 g</text><text x="810.0" y="169.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">16.5 m/s, turning left</text><g opacity="1.0"><line x1="1060.0" y1="650.0" x2="1060.0" y2="158.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="1060.0,150.0 1055.8,160.0 1064.2,160.0" fill="#6f6a63"/></g><text x="1060.0" y="138.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(-2.287 1060.0 400.0)"><rect x="1008.0" y="280.0" width="104" height="240" rx="26.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1051.0,296.0 L 1060.0,284.0 L 1069.0,296.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-6.83 1000.3 328.0)"><rect x="989.3" y="301.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="995.3" y="321.7" width="10.0" height="12.5" rx="4.2" fill="#7f8ea3" opacity="0.9"/><line x1="996.4" y1="306.0" x2="996.4" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1000.3" y1="306.0" x2="1000.3" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1004.1" y1="306.0" x2="1004.1" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-6.83 1119.7 328.0)"><rect x="1108.7" y="301.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1111.2" y="305.3" width="17.1" height="45.4" rx="7.2" fill="#7f8ea3" opacity="0.9"/><line x1="1115.9" y1="306.0" x2="1115.9" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1119.7" y1="306.0" x2="1119.7" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1123.5" y1="306.0" x2="1123.5" y2="350.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1000.3 472.0)"><rect x="989.3" y="445.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="995.3" y="466.1" width="9.9" height="11.9" rx="4.2" fill="#7f8ea3" opacity="0.9"/><line x1="996.4" y1="450.0" x2="996.4" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1000.3" y1="450.0" x2="1000.3" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1004.1" y1="450.0" x2="1004.1" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1119.7 472.0)"><rect x="1108.7" y="445.0" width="22" height="54" rx="6.1" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1111.8" y="452.5" width="15.7" height="38.9" rx="6.6" fill="#7f8ea3" opacity="0.9"/><line x1="1115.9" y1="450.0" x2="1115.9" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1119.7" y1="450.0" x2="1119.7" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1123.5" y1="450.0" x2="1123.5" y2="494.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="910.0" y="324.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.48 kN</text><text x="1210.0" y="324.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5.63 kN</text><text x="910.0" y="494.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.40 kN</text><text x="1210.0" y="494.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.82 kN</text><text x="1060.0" y="700.0" fill="#e8e4dd" font-size="13" text-anchor="middle" font-weight="600" font-style="normal">outside pair carries 3.6x the inside pair</text><text x="1060.0" y="722.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">total 13.34 kN - unchanged</text><line x1="60.0" y1="760.0" x2="1420.0" y2="760.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="800.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">At the limit the outside wheels carry roughly four times what the inside wheels do. The total never changes -- it is the same</text><text x="60.0" y="822.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">car -- but Episode 2 already told us what that costs: two tires sharing a load unevenly make less grip than two sharing it evenly.</text><text x="60.0" y="844.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="866.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">That is the whole upgrade. The two-wheeled model could not represent this, and so it could not represent an anti-roll bar either,</text><text x="60.0" y="888.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">because a bar is a device for choosing WHICH axle suffers the uneven split.</text><text x="40.0" y="970.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg - track 1.505/1.495 m - h 0.460 m - roll front 55%  -  [SOURCED] RV-1 params §1, track width [LIKELY]  -  30 m skidpad [ASSUMED], constant speed (SAE J266)</text><text x="40" y="992" fill="#6f6a63" font-size="11" font-style="italic">Load transfer is m*a_y*h as a moment, divided between the axles by roll stiffness and converted to force by each axle's track width. No fitting parameters. D5 asserts the four loads always sum to the car's weight.</text></svg>