<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Inter, system-ui, sans-serif"><rect width="1400" height="880" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Seed by seed</text><text x="40" y="70" fill="#6f6a63" font-size="13">Every trained seed on its own: worst slip angle it ever reached against the tire file's own +/-12 deg fit, and what share of the whole run it spent past that line. Rule 5's minimum is 3 seeds per configuration; here the seeds do not agree with each other.</text><text x="260.0" y="136.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">worst slip angle reached (deg)</text><text x="900.0" y="136.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">share of the run past +/-12 deg</text><text x="60.0" y="178.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">H seed 0</text><text x="60.0" y="198.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 FAILED  finished=True</text><rect x="260" y="156" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="156" width="336.6" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><line x1="533.5" y1="150" x2="533.5" y2="186" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="604.6" y="174.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.8 deg</text><rect x="900" y="156" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="156" width="56.6" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><text x="964.6" y="174.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.0%</text><text x="60.0" y="262.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">H seed 1</text><text x="60.0" y="282.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 FAILED  finished=True</text><rect x="260" y="240" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="240" width="240.3" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><line x1="533.5" y1="234" x2="533.5" y2="270" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="508.3" y="258.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.5 deg</text><rect x="900" y="240" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="240" width="0.0" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><text x="908.0" y="258.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.0%</text><text x="60.0" y="346.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">H seed 2</text><text x="60.0" y="366.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 FAILED  finished=False</text><rect x="260" y="324" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="324" width="214.0" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><line x1="533.5" y1="318" x2="533.5" y2="354" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="482.0" y="342.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">9.4 deg</text><rect x="900" y="324" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="324" width="0.0" height="26" rx="4" fill="#4aa8a0" opacity="0.9"/><text x="908.0" y="342.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.0%</text><text x="60.0" y="430.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">E seed 0</text><text x="60.0" y="450.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 FAILED  finished=False</text><rect x="260" y="408" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="408" width="308.7" height="26" rx="4" fill="#e2614a" opacity="0.9"/><line x1="533.5" y1="402" x2="533.5" y2="438" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="576.7" y="426.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">13.5 deg</text><rect x="900" y="408" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="408" width="352.0" height="26" rx="4" fill="#e2614a" opacity="0.9"/><text x="1260.0" y="426.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">24.7%</text><text x="60.0" y="514.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">E seed 1</text><text x="60.0" y="534.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 FAILED  finished=False</text><rect x="260" y="492" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="492" width="382.6" height="26" rx="4" fill="#e2614a" opacity="0.9"/><line x1="533.5" y1="486" x2="533.5" y2="522" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="650.6" y="510.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">16.8 deg</text><rect x="900" y="492" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="492" width="50.0" height="26" rx="4" fill="#e2614a" opacity="0.9"/><text x="958.0" y="510.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3.5%</text><text x="60.0" y="598.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">E seed 2</text><text x="60.0" y="618.0" fill="#4aa8a0" font-size="11" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D6 PASSED  finished=True</text><rect x="260" y="576" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="260" y="576" width="199.9" height="26" rx="4" fill="#e2614a" opacity="0.9"/><line x1="533.5" y1="570" x2="533.5" y2="606" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="4 3"/><text x="467.9" y="594.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">8.8 deg</text><rect x="900" y="576" width="440" height="26" rx="4" fill="#2e2e31" opacity="0.5"/><rect x="900" y="576" width="0.0" height="26" rx="4" fill="#e2614a" opacity="0.9"/><text x="908.0" y="594.0" fill="#e8e4dd" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.0%</text><text x="533.5" y="122.0" fill="#e8e4dd" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">+/-12 deg bound</text><line x1="60.0" y1="690.0" x2="1340.0" y2="690.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="720.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The dashed line is the +/-12 deg slip angle every minimum-time solve in this project also enforces, and the edge of the region physics/tire.py was</text><text x="60.0" y="740.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">fitted over — ours, not the tire file's own limit. A seed sitting past it is not a worse driver; it is a policy whose Mz or wheel-force number was</text><text x="60.0" y="760.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">computed by a curve fit that no longer applies.</text><text x="40.0" y="840.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] worst_slip_deg, envelope_occupancy from evaluate_variant's greedy rollout · 3 seeds/variant, 5,000,000 steps each</text><text x="40" y="862" fill="#6f6a63" font-size="11" font-style="italic">Bars are independent scales (left panel vs right panel); only positions within a panel are directly comparable.</text></svg>