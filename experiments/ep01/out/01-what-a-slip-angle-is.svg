2.2" r="4.5" fill="#e0a53c"/><text x="160.0" y="779.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">0°</text><text x="1330.0" y="779.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">20°</text><text x="1330.0" y="630.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">sideways force</text><text x="40.0" y="790.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] Sedan_Pac02Tire.tir  ·  MF 2002 pure slip  ·  offsets removed  ·  Fz0′ 3929 N  ·  LMUY 1 · LKY 1 · LFZO 0.81  ·  vertical load 3,601 N = RV-1 static front corner [DERIVED from SOURCED mass and weight distribution]</text><text x="40" y="812" fill="#6f6a63" font-size="11" font-style="italic">A tire is not a switch that grips until it lets go. Force builds steeply, then flattens: by 5° it is already making 91% of everything it will ever make, and the last few percent costs another 5°. Past the top, more angle buys nothing at all.</text></svg>