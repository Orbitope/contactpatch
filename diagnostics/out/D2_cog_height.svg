<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="800" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Why sports cars are low</text><text x="40" y="70" fill="#6f6a63" font-size="13">Two identical cars braking equally hard at 0.5 g. The only difference is how high the weight sits. Nothing else changes — same mass, same wheelbase, same tires.</text><text x="170.0" y="160.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">RV-1, 460 mm</text><text x="170.0" y="179.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">centre of gravity 460 mm above the road</text><g transform="rotate(0.000 380.0 380.0)"><rect x="334.0" y="275.0" width="92" height="210" rx="23.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 371.0,291.0 L 380.0,279.0 L 389.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 327.7 317.0)"><rect x="318.7" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="321.6" y="300.6" width="12.2" height="32.8" rx="5.1" fill="#7f8ea3" opacity="0.9"/><line x1="324.9" y1="299.0" x2="324.9" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="327.7" y1="299.0" x2="327.7" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="330.4" y1="299.0" x2="330.4" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 432.3 317.0)"><rect x="423.3" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="426.2" y="300.6" width="12.2" height="32.8" rx="5.1" fill="#7f8ea3" opacity="0.9"/><line x1="429.6" y1="299.0" x2="429.6" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="432.3" y1="299.0" x2="432.3" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="435.1" y1="299.0" x2="435.1" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 327.7 443.0)"><rect x="318.7" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="323.3" y="435.0" width="8.8" height="15.9" rx="3.7" fill="#7f8ea3" opacity="0.9"/><line x1="324.9" y1="425.0" x2="324.9" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="327.7" y1="425.0" x2="327.7" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="330.4" y1="425.0" x2="330.4" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 432.3 443.0)"><rect x="423.3" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="427.9" y="435.0" width="8.8" height="15.9" rx="3.7" fill="#7f8ea3" opacity="0.9"/><line x1="429.6" y1="425.0" x2="429.6" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="432.3" y1="425.0" x2="432.3" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="435.1" y1="425.0" x2="435.1" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="508.0" y1="458.0" x2="508.0" y2="312.2" stroke="#4aa8a0" stroke-width="3.0" stroke-linecap="round"/><polygon points="508.0,302.0 503.0,314.0 513.0,314.0" fill="#4aa8a0"/></g><text x="522.0" y="376.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1.19 kN</text><text x="522.0" y="394.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">moved forward</text><text x="230.0" y="314.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="230.0" y="332.0" fill="#4aa8a0" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">8.39 kN</text><text x="230.0" y="458.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="230.0" y="476.0" fill="#4aa8a0" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.94 kN</text><text x="790.0" y="160.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">the same car, 920 mm</text><text x="790.0" y="179.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">centre of gravity 920 mm above the road</text><g transform="rotate(0.000 1000.0 380.0)"><rect x="954.0" y="275.0" width="92" height="210" rx="23.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 991.0,291.0 L 1000.0,279.0 L 1009.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 947.7 317.0)"><rect x="938.7" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="941.1" y="297.7" width="13.3" height="38.6" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="945.0" y1="299.0" x2="945.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="947.7" y1="299.0" x2="947.7" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="950.5" y1="299.0" x2="950.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1052.3 317.0)"><rect x="1043.3" y="294.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1045.6" y="297.7" width="13.3" height="38.6" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="1049.5" y1="299.0" x2="1049.5" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1052.3" y1="299.0" x2="1052.3" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1055.0" y1="299.0" x2="1055.0" y2="335.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 947.7 443.0)"><rect x="938.7" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="943.9" y="437.9" width="7.7" height="10.1" rx="3.2" fill="#7f8ea3" opacity="0.9"/><line x1="945.0" y1="425.0" x2="945.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="947.7" y1="425.0" x2="947.7" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="950.5" y1="425.0" x2="950.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1052.3 443.0)"><rect x="1043.3" y="420.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1048.5" y="437.9" width="7.7" height="10.1" rx="3.2" fill="#7f8ea3" opacity="0.9"/><line x1="1049.5" y1="425.0" x2="1049.5" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1052.3" y1="425.0" x2="1052.3" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1055.0" y1="425.0" x2="1055.0" y2="461.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="1128.0" y1="458.0" x2="1128.0" y2="312.2" stroke="#e2614a" stroke-width="3.0" stroke-linecap="round"/><polygon points="1128.0,302.0 1123.0,314.0 1133.0,314.0" fill="#e2614a"/></g><text x="1142.0" y="376.0" fill="#e2614a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+2.38 kN</text><text x="1142.0" y="394.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">moved forward</text><text x="850.0" y="314.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="850.0" y="332.0" fill="#e2614a" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">9.58 kN</text><text x="850.0" y="458.0" fill="#6f6a63" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="850.0" y="476.0" fill="#e2614a" font-size="13.5" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3.75 kN</text><line x1="60.0" y1="610.0" x2="1420.0" y2="610.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="654.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Twice the height, twice the transfer — 1.19 kN becomes 2.38 kN. It is exactly proportional, with no fudge factor: the</text><text x="60.0" y="676.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">transfer is m·a_x·h/L, and h is the only thing that changed.</text><text x="60.0" y="698.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="720.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">And transfer costs grip, because a tire pressed harder gives back less than proportionally (Episode 2). So the tall car has</text><text x="60.0" y="742.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">less total grip while braking than the low one — same tires, same weight, worse car. That is why Toyota put the GR86's</text><text x="60.0" y="764.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">460 mm centre of gravity in the press release.</text><text x="40.0" y="760.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model + Sedan_Pac02Tire.tir  ·  offsets removed  ·  m 1360 kg · L 2.575 m · h 0.460 m · 54% front  ·  [SOURCED] RV-1 parameters, vehicle-reference-parameters.md §1  ·  braking at -4.90 m/s2 [ASSUMED]  ·  tall variant is RV-1 with com_height doubled, nothing else changed</text><text x="40" y="782" fill="#6f6a63" font-size="11" font-style="italic">D2 asserts this proportionality exactly: doubling centre-of-gravity height doubles the transfer, to machine precision.</text></svg>