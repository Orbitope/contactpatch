<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="830" viewBox="0 0 1480 830" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="830" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What a slip angle is, and why grip has a top</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same tire with the same weight on it (3,601 N — one front corner of the car at rest). The only thing changing is the angle between where the wheel points and where it is actually going.</text><text x="40.0" y="92.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Angles are drawn true to scale — this is genuinely how small a slip angle is. Arrow length is force, to one scale across all five.</text><g opacity="1.0"><line x1="160.0" y1="458.0" x2="160.0" y2="161.7" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="160.0,154.0 156.2,163.0 163.8,163.0" fill="#6f6a63"/></g><text x="160.0" y="140.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(0.00 160.0 306.0)"><line x1="160.0" y1="161.0" x2="160.0" y2="451.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="145.0" y="268.0" width="30.0" height="76.0" rx="8.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="150.0" y="284.7" width="20.0" height="42.6" rx="8.4" fill="#7f8ea3" opacity="0.9"/><line x1="153.9" y1="273.0" x2="153.9" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="160.0" y1="273.0" x2="160.0" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="166.1" y1="273.0" x2="166.1" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><text x="160.0" y="501.0" fill="#e8e4dd" font-size="13.5" text-anchor="middle" font-weight="normal" font-style="normal">α = 0.0°</text><text x="160.0" y="523.0" fill="#6f6a63" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 N</text><text x="160.0" y="546.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">pointed exactly where it is</text><text x="160.0" y="562.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">going: no sideways force</text><g opacity="1.0"><line x1="432.0" y1="458.0" x2="432.0" y2="161.7" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="432.0,154.0 428.2,163.0 435.8,163.0" fill="#6f6a63"/></g><text x="432.0" y="140.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(2.00 432.0 306.0)"><line x1="432.0" y1="161.0" x2="432.0" y2="451.0" stroke="#6f6a63" stroke-width="1.1" opacity="0.75"/><rect x="417.0" y="268.0" width="30.0" height="76.0" rx="8.2" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="422.0" y="284.7" width="20.0" height="42.6" rx="8.4" fill="#7f8ea3" opacity="0.9"/><line x1="425.9" y1="273.0" x2="425.9" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="432.0" y1="273.0" x2="432.0" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="438.1" y1="273.0" x2="438.1" y2="339.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><path d="M 432.0,194.0 A 112.0,112.0 0 0 1 435.9,194.1" fill="none" stroke="#4aa8a0" stroke-width="1.8"/><text x="466.0" y="198.1" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal">2.0°</text><g opacity="1.0"><line x1="432.0" y1="306.0" x2="496.4" y2="306.0" stroke="#e2614a" stroke-width="3.4" stroke-linecap="round"/><polygon points="506.6,306.0 494.6,301.0 494.6,311.0" fill="#e2614a"/></g><text x="432.0" y="501.0" fill="#e8e4dd" font-size="13.5" text-anchor="middle" font-weight="nor