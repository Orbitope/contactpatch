<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="880" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Why a cornering car wants to be low and wide</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same car cornering at 0.82 g, with only its height or its width changed. Contact-patch size is load. Nothing else differs -- same mass, same tires, same corner.</text><text x="130.0" y="152.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">RV-1 as it is</text><text x="130.0" y="171.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">460 mm high, 1505 mm wide</text><g transform="rotate(0.000 300.0 380.0)"><rect x="256.0" y="280.0" width="88" height="200" rx="22.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 291.0,296.0 L 300.0,284.0 L 309.0,296.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 249.7 320.0)"><rect x="240.7" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="245.4" y="312.5" width="8.7" height="15.1" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="246.9" y1="302.0" x2="246.9" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="249.7" y1="302.0" x2="249.7" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="252.4" y1="302.0" x2="252.4" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 350.3 320.0)"><rect x="341.3" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="344.1" y="303.0" width="12.4" height="33.9" rx="5.2" fill="#7f8ea3" opacity="0.9"/><line x1="347.6" y1="302.0" x2="347.6" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="350.3" y1="302.0" x2="350.3" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="353.1" y1="302.0" x2="353.1" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 249.7 440.0)"><rect x="240.7" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="245.5" y="433.0" width="8.5" height="14.0" rx="3.6" fill="#7f8ea3" opacity="0.9"/><line x1="246.9" y1="422.0" x2="246.9" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="249.7" y1="422.0" x2="249.7" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="252.4" y1="422.0" x2="252.4" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 350.3 440.0)"><rect x="341.3" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="344.5" y="425.2" width="11.5" height="29.5" rx="4.8" fill="#7f8ea3" opacity="0.9"/><line x1="347.6" y1="422.0" x2="347.6" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="350.3" y1="422.0" x2="350.3" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="353.1" y1="422.0" x2="353.1" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="300.0" y="530.0" fill="#e0a53c" font-size="14" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.83 kN moved sideways</text><text x="300.0" y="552.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">inside front down to 1.77 kN</text><text x="300.0" y="576.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">lifts a wheel at 1.61 g</text><text x="570.0" y="152.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Half again as tall</text><text x="570.0" y="171.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">690 mm high</text><g transform="rotate(0.000 740.0 380.0)"><rect x="696.0" y="280.0" width="88" height="200" rx="22.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 731.0,296.0 L 740.0,284.0 L 749.0,296.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 689.7 320.0)"><rect x="680.7" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="685.8" y="314.8" width="7.8" height="10.4" rx="3.3" fill="#7f8ea3" opacity="0.9"/><line x1="687.0" y1="302.0" x2="687.0" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="689.7" y1="302.0" x2="689.7" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="692.5" y1="302.0" x2="692.5" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 790.3 320.0)"><rect x="781.3" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="783.6" y="300.7" width="13.3" height="38.6" rx="5.6" fill="#7f8ea3" opacity="0.9"/><line x1="787.5" y1="302.0" x2="787.5" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="790.3" y1="302.0" x2="790.3" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="793.0" y1="302.0" x2="793.0" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 689.7 440.0)"><rect x="680.7" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="685.9" y="434.9" width="7.7" height="10.1" rx="3.2" fill="#7f8ea3" opacity="0.9"/><line x1="687.0" y1="422.0" x2="687.0" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="689.7" y1="422.0" x2="689.7" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="692.5" y1="422.0" x2="692.5" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 790.3 440.0)"><rect x="781.3" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="784.2" y="423.3" width="12.3" height="33.4" rx="5.2" fill="#7f8ea3" opacity="0.9"/><line x1="787.5" y1="422.0" x2="787.5" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="790.3" y1="422.0" x2="790.3" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="793.0" y1="422.0" x2="793.0" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="740.0" y="530.0" fill="#e2614a" font-size="14" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.74 kN moved sideways</text><text x="740.0" y="552.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">inside front down to 0.86 kN</text><text x="740.0" y="576.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">lifts a wheel at 1.07 g</text><text x="740.0" y="604.0" fill="#e2614a" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">+50% vs the real car</text><text x="1010.0" y="152.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">A quarter wider</text><text x="1010.0" y="171.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">1881 mm wide</text><g transform="rotate(0.000 1180.0 380.0)"><rect x="1136.0" y="280.0" width="88" height="200" rx="22.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1171.0,296.0 L 1180.0,284.0 L 1189.0,296.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(0.00 1129.7 320.0)"><rect x="1120.7" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1125.2" y="311.5" width="9.0" height="17.0" rx="3.8" fill="#7f8ea3" opacity="0.9"/><line x1="1127.0" y1="302.0" x2="1127.0" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1129.7" y1="302.0" x2="1129.7" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1132.5" y1="302.0" x2="1132.5" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1230.3 320.0)"><rect x="1221.3" y="297.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1224.3" y="304.0" width="12.0" height="32.0" rx="5.0" fill="#7f8ea3" opacity="0.9"/><line x1="1227.5" y1="302.0" x2="1227.5" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1230.3" y1="302.0" x2="1230.3" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1233.0" y1="302.0" x2="1233.0" y2="338.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1129.7 440.0)"><rect x="1120.7" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1125.3" y="432.2" width="8.8" height="15.6" rx="3.7" fill="#7f8ea3" opacity="0.9"/><line x1="1127.0" y1="422.0" x2="1127.0" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1129.7" y1="422.0" x2="1129.7" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1132.5" y1="422.0" x2="1132.5" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1230.3 440.0)"><rect x="1221.3" y="417.0" width="18" height="46" rx="5.0" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1224.7" y="426.0" width="11.2" height="28.0" rx="4.7" fill="#7f8ea3" opacity="0.9"/><line x1="1227.5" y1="422.0" x2="1227.5" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1230.3" y1="422.0" x2="1230.3" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1233.0" y1="422.0" x2="1233.0" y2="458.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="1180.0" y="530.0" fill="#4aa8a0" font-size="14" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.46 kN moved sideways</text><text x="1180.0" y="552.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">inside front down to 2.14 kN</text><text x="1180.0" y="576.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">lifts a wheel at 2.01 g</text><text x="1180.0" y="604.0" fill="#4aa8a0" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">-20% vs the real car</text><line x1="60.0" y1="660.0" x2="1420.0" y2="660.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="700.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Transfer is mass x cornering force x height, divided by track width. Two levers, both geometric, neither costing anything at</text><text x="60.0" y="722.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the tires: make the car lower, or make it wider. Half again as tall moves half again as much load; a quarter wider moves a fifth</text><text x="60.0" y="744.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">less.</text><text x="60.0" y="766.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="788.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">And every kilonewton moved sideways is grip thrown away, because the overloaded tire never repays what the unloaded one gave up.</text><text x="60.0" y="810.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">That is why the reference car's 460 mm centre of gravity is the number its engineers put in the press release, and why race cars are</text><text x="60.0" y="832.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">as low and as wide as the rules allow.</text><text x="40.0" y="840.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg - track 1.505/1.495 m - h 0.460 m - roll front 55%  -  [SOURCED] RV-1 params §1, track width [LIKELY]  -  evaluated at 0.82 g [ASSUMED]</text><text x="40" y="862" fill="#6f6a63" font-size="11" font-style="italic">Lowering the centre of gravity and widening the track are the only two ways to reduce load transfer without changing the tires or the corner. Everything else -- bars, springs -- only redistributes it.</text></svg>