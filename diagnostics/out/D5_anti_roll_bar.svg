<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1020" viewBox="0 0 1480 1020" font-family="Inter, system-ui, sans-serif"><rect width="1480" height="1020" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What an anti-roll bar actually does</text><text x="40" y="70" fill="#6f6a63" font-size="13">Both cars are the same car in the same corner at the same speed. What a bar changes here is which end of the car absorbs the lean -- this sweep moves the front/rear split and holds the total roll stiffness fixed, which is what you get by stiffening one bar and softening the other.</text><text x="110.0" y="152.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Soft front bar - 40% of roll stiffness</text><text x="110.0" y="171.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">the front axle shares its load more evenly</text><g opacity="1.0"><line x1="360.0" y1="640.0" x2="360.0" y2="168.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="360.0,160.0 355.8,170.0 364.2,170.0" fill="#6f6a63"/></g><text x="360.0" y="148.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(-3.468 360.0 400.0)"><rect x="310.0" y="285.0" width="100" height="230" rx="25.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 351.0,301.0 L 360.0,289.0 L 369.0,301.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-4.48 302.6 331.0)"><rect x="292.1" y="305.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="297.2" y="321.7" width="10.9" height="18.7" rx="4.6" fill="#7f8ea3" opacity="0.9"/><line x1="299.1" y1="310.0" x2="299.1" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="302.6" y1="310.0" x2="302.6" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="306.2" y1="310.0" x2="306.2" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-4.48 417.4 331.0)"><rect x="406.9" y="305.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="409.9" y="312.3" width="14.8" height="37.4" rx="6.2" fill="#7f8ea3" opacity="0.9"/><line x1="413.8" y1="310.0" x2="413.8" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="417.4" y1="310.0" x2="417.4" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="420.9" y1="310.0" x2="420.9" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 302.6 469.0)"><rect x="292.1" y="443.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="298.0" y="463.3" width="9.4" height="11.4" rx="3.9" fill="#7f8ea3" opacity="0.9"/><line x1="299.1" y1="448.0" x2="299.1" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="302.6" y1="448.0" x2="302.6" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="306.2" y1="448.0" x2="306.2" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 417.4 469.0)"><rect x="406.9" y="443.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="409.7" y="449.2" width="15.3" height="39.6" rx="6.4" fill="#7f8ea3" opacity="0.9"/><line x1="413.8" y1="448.0" x2="413.8" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="417.4" y1="448.0" x2="417.4" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="420.9" y1="448.0" x2="420.9" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="212.0" y="326.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="212.0" y="344.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.51 kN moved</text><text x="212.0" y="474.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="212.0" y="492.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.28 kN moved</text><text x="508.0" y="344.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">inside front 2.03 kN</text><text x="508.0" y="492.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">inside rear 0.86 kN</text><text x="360.0" y="690.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">total moved: 3.79 kN</text><text x="360.0" y="714.0" fill="#4aa8a0" font-size="16" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">understeer gradient +0.05 deg/g</text><text x="810.0" y="152.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Stiff front bar - 70%</text><text x="810.0" y="171.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">the front axle takes more of the lean</text><g opacity="1.0"><line x1="1060.0" y1="640.0" x2="1060.0" y2="168.5" stroke="#6f6a63" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/><polygon points="1060.0,160.0 1055.8,170.0 1064.2,170.0" fill="#6f6a63"/></g><text x="1060.0" y="148.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">direction of travel</text><g transform="rotate(-1.093 1060.0 400.0)"><rect x="1010.0" y="285.0" width="100" height="230" rx="25.0" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1051.0,301.0 L 1060.0,289.0 L 1069.0,301.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(-7.25 1002.6 331.0)"><rect x="992.1" y="305.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="997.8" y="324.5" width="9.7" height="12.9" rx="4.1" fill="#7f8ea3" opacity="0.9"/><line x1="999.1" y1="310.0" x2="999.1" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1002.6" y1="310.0" x2="1002.6" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1006.2" y1="310.0" x2="1006.2" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(-7.25 1117.3 331.0)"><rect x="1106.8" y="305.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1109.3" y="309.2" width="16.2" height="43.7" rx="6.8" fill="#7f8ea3" opacity="0.9"/><line x1="1113.8" y1="310.0" x2="1113.8" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.3" y1="310.0" x2="1117.3" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1120.9" y1="310.0" x2="1120.9" y2="352.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1002.6 469.0)"><rect x="992.1" y="443.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="997.2" y="459.7" width="10.9" height="18.6" rx="4.6" fill="#7f8ea3" opacity="0.9"/><line x1="999.1" y1="448.0" x2="999.1" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1002.6" y1="448.0" x2="1002.6" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1006.2" y1="448.0" x2="1006.2" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1117.3 469.0)"><rect x="1106.8" y="443.0" width="21" height="52" rx="5.8" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1110.5" y="453.1" width="13.7" height="31.9" rx="5.7" fill="#7f8ea3" opacity="0.9"/><line x1="1113.8" y1="448.0" x2="1113.8" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.3" y1="448.0" x2="1117.3" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1120.9" y1="448.0" x2="1120.9" y2="490.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><text x="912.0" y="326.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">front</text><text x="912.0" y="344.0" fill="#e2614a" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.48 kN moved</text><text x="912.0" y="474.0" fill="#6f6a63" font-size="10.5" text-anchor="end" font-weight="normal" font-style="normal">rear</text><text x="912.0" y="492.0" fill="#e2614a" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.07 kN moved</text><text x="1208.0" y="344.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">inside front 1.10 kN</text><text x="1208.0" y="492.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">inside rear 2.02 kN</text><text x="1060.0" y="690.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">total moved: 3.55 kN</text><text x="1060.0" y="714.0" fill="#e2614a" font-size="16" text-anchor="middle" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">understeer gradient +0.40 deg/g</text><line x1="60.0" y1="760.0" x2="1420.0" y2="760.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="800.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The two cars move almost the same total load sideways. What differs is the split: the stiff-front car pushes more of it across the</text><text x="60.0" y="822.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">front axle and less across the rear.</text><text x="60.0" y="844.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="866.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">And an axle that shares its load unevenly makes less grip (Episode 2). So a stiff front bar deliberately weakens the front axle,</text><text x="60.0" y="888.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">which makes the car understeer more. That is the entire mechanism, and it is why a bar is the first thing anyone changes.</text><text x="60.0" y="910.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="932.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Measured: +0.05 deg/g with the soft front bar, +0.40 with the stiff one. The two-wheeled model of Episodes 1-4 returns +0.19 for both --</text><text x="60.0" y="954.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">it has no left and right for a bar to act between, so the knob does not exist for it.</text><text x="60.0" y="976.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="60.0" y="998.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">On the protocol: this sweep redistributes a fixed total roll stiffness, so both cars here lean by the same 5.4°. Bolting a bar ON instead raises the total and the car</text><text x="60.0" y="1020.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">leans less as well -- down to 3.4° at 70% front share. Both protocols are real and they are not the same experiment; see the body-roll figure.</text><text x="40.0" y="980.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg - track 1.505/1.495 m - h 0.460 m - roll front 55%  -  [SOURCED] RV-1 params §1, track width [LIKELY]  -  roll-share range [ASSUMED] §2 - see FINDINGS F31: our bar authority is weak, trust the direction not the size</text><text x="40" y="1002" fill="#6f6a63" font-size="11" font-style="italic">Redistributing a fixed total roll stiffness changes which axle gives up first without changing how far the car leans. Adding stiffness does both -- and only the redistribution changes the balance.</text></svg>