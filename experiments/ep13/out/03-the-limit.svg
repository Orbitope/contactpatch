<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="980" viewBox="0 0 1540 980" font-family="Inter, system-ui, sans-serif"><rect width="1540" height="980" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">How hard can the driver try before the car cannot do it?</text><text x="40" y="70" fill="#6f6a63" font-size="13">Same driver, same line, same speed plan. The plan is built for a fraction of the car's measured grip; turn that fraction up and the lap gets quicker until the car runs out of road or slides past the tire fit.</text><text x="150.0" y="178.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Lap time against how hard the driver tries</text><line x1="293" y1="200" x2="293" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="437" y1="200" x2="437" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="580" y1="200" x2="580" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="723" y1="200" x2="723" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="867" y1="200" x2="867" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="315" x2="1010" y2="315" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="430" x2="1010" y2="430" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="545" x2="1010" y2="545" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="660" x2="1010" y2="660" stroke="#6f6a63" stroke-width="1"/><line x1="150" y1="200" x2="150" y2="660" stroke="#6f6a63" stroke-width="1"/><text x="177" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.85</text><text x="311" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.90</text><text x="446" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.95</text><text x="580" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.00</text><text x="714" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.05</text><text x="849" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.10</text><text x="983" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.15</text><text x="140" y="606" fill="#6f6a63" font-size="11" text-anchor="end">14.4</text><text x="140" y="507" fill="#6f6a63" font-size="11" text-anchor="end">14.6</text><text x="140" y="408" fill="#6f6a63" font-size="11" text-anchor="end">14.8</text><text x="140" y="309" fill="#6f6a63" font-size="11" text-anchor="end">15.0</text><text x="140" y="210" fill="#6f6a63" font-size="11" text-anchor="end">15.2</text><text x="580.0" y="706" fill="#e8e4dd" font-size="12.5" text-anchor="middle">grip_use  —  the fraction of measured grip the speed plan assumes</text><text x="92" y="430.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 92 430.0)">lap time (s)</text><path d="M 176.9,281.5 L 210.5,307.0 L 244.1,331.1 L 277.7,353.7 L 311.3,377.7 L 344.8,397.6 L 378.4,417.4 L 412.0,436.0 L 445.6,454.2 L 479.2,472.3 L 512.8,489.5 L 546.4,505.1 L 580.0,520.2 L 613.6,533.4 L 647.2,544.7 L 680.8,548.9" fill="none" stroke="#7f8ea3" stroke-width="2.8" opacity="0.95"/><line x1="690.2" y1="200" x2="690.2" y2="660" stroke="#7f8ea3" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="680.8" cy="548.9" r="6" fill="#1a1a1c" stroke="#7f8ea3" stroke-width="2.6"/><path d="M 176.9,274.3 L 210.5,298.5 L 244.1,322.1 L 277.7,343.8 L 311.3,365.1 L 344.8,384.8 L 378.4,401.8 L 412.0,417.4 L 445.6,432.9 L 479.2,444.2" fill="none" stroke="#e0a53c" stroke-width="2.8" opacity="0.95"/><line x1="497.1" y1="200" x2="497.1" y2="660" stroke="#e0a53c" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="479.2" cy="444.2" r="6" fill="#1a1a1c" stroke="#e0a53c" stroke-width="2.6"/><path d="M 176.9,278.7 L 210.5,304.0 L 244.1,328.2 L 277.7,350.9 L 311.3,373.5 L 344.8,393.3 L 378.4,413.1 L 412.0,432.7 L 445.6,450.9 L 479.2,468.3 L 512.8,485.3 L 546.4,499.4 L 580.0,513.6 L 613.6,525.2 L 647.2,536.7 L 680.8,544.7 L 714.4,545.0 L 748.0,476.8" fill="none" stroke="#8a7bd8" stroke-width="2.8" opacity="0.95"/><line x1="748.2" y1="200" x2="748.2" y2="660" stroke="#8a7bd8" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="714.4" cy="545.0" r="6" fill="#1a1a1c" stroke="#8a7bd8" stroke-width="2.6"/><path d="M 176.9,283.0 L 210.5,308.4 L 244.1,332.5 L 277.7,356.5 L 311.3,379.9 L 344.8,400.4 L 378.4,420.2 L 412.0,440.0 L 445.6,459.1 L 479.2,478.2 L 512.8,495.5 L 546.4,512.2 L 580.0,527.7 L 613.6,541.9 L 647.2,554.9 L 680.8,565.9 L 714.4,575.8 L 748.0,585.7 L 781.6,546.6 L 815.2,481.0" fill="none" stroke="#4aa8a0" stroke-width="2.8" opacity="0.95"/><line x1="835.1" y1="200" x2="835.1" y2="660" stroke="#4aa8a0" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="748.0" cy="585.7" r="6" fill="#1a1a1c" stroke="#4aa8a0" stroke-width="2.6"/><path d="M 176.9,282.5 L 210.5,308.4 L 244.1,332.0 L 277.7,355.1 L 311.3,378.3 L 344.8,399.0 L 378.4,418.8 L 412.0,438.6 L 445.6,457.0 L 479.2,474.0 L 512.8,489.5 L 546.4,503.7 L 580.0,515.0 L 613.6,522.1 L 647.2,515.0 L 680.8,498.0 L 714.4,465.5 L 748.0,408.9" fill="none" stroke="#7fa86a" stroke-width="2.8" opacity="0.95"/><line x1="777.2" y1="200" x2="777.2" y2="660" stroke="#7fa86a" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="613.6" cy="522.1" r="6" fill="#1a1a1c" stroke="#7fa86a" stroke-width="2.6"/><text x="1004.0" y="190.0" fill="#6f6a63" font-size="11.5" text-anchor="end" font-weight="normal" font-style="normal">dashed line = the last aggression this car survives</text><text x="1060.0" y="190.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">the five configurations</text><line x1="1060" y1="215" x2="1102" y2="215" stroke="#4aa8a0" stroke-width="3.4"/><text x="1114.0" y="220.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">torque vectoring, four wheels</text><text x="1060.0" y="244.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.095</text><text x="1060.0" y="262.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.434 s</text><text x="1060.0" y="280.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.969 g</text><line x1="1060" y1="303" x2="1102" y2="303" stroke="#7fa86a" stroke-width="3.4"/><text x="1114.0" y="308.0" fill="#7fa86a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">torque-vectoring differential</text><text x="1060.0" y="332.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.073</text><text x="1060.0" y="350.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.562 s</text><text x="1060.0" y="368.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.948 g</text><line x1="1060" y1="391" x2="1102" y2="391" stroke="#8a7bd8" stroke-width="3.4"/><text x="1114.0" y="396.0" fill="#8a7bd8" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">allocator, no yaw control</text><text x="1060.0" y="420.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.063</text><text x="1060.0" y="438.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.516 s</text><text x="1060.0" y="456.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.981 g</text><line x1="1060" y1="479" x2="1102" y2="479" stroke="#7f8ea3" stroke-width="3.4"/><text x="1114.0" y="484.0" fill="#7f8ea3" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">open differential</text><text x="1060.0" y="508.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.041</text><text x="1060.0" y="526.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.508 s</text><text x="1060.0" y="544.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.965 g</text><line x1="1060" y1="567" x2="1102" y2="567" stroke="#e0a53c" stroke-width="3.4"/><text x="1114.0" y="572.0" fill="#e0a53c" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">limited-slip (1.5:1)</text><text x="1060.0" y="596.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  0.969</text><text x="1060.0" y="614.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.719 s</text><text x="1060.0" y="632.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.907 g</text><line x1="150.0" y1="736.0" x2="1240.0" y2="736.0" stroke="#2e2e31" stroke-width="1.0"/><text x="150.0" y="770.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">Every configuration drives the same plan, so at any point on this axis they are all attempting the same lap and take nearly the same time. The whole</text><text x="150.0" y="792.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">result is how far right each line reaches: the passive car gives up at 1.041, the controlled one at 1.095, which is +5.2% more cornering grip</text><text x="150.0" y="814.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">demanded and survived — and only +0.51% of lap time, because two thirds of this lap is a straight where the controller has nothing to do.</text><text x="40.0" y="927.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long exit (393 m), grip_use swept to failure  -  [MEASURED] reference model K=0.20 deg/g, grip ceiling 0.95 g</text><text x="40.0" y="940.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED — CITATION OUTSTANDING] ~9% skidpad ceiling, FSAE  -  [LIKELY] track width — the moment arm; conclusion re-run at +/-3%  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="962" fill="#6f6a63" font-size="11" font-style="italic">Circles mark each configuration's quickest valid lap. A lap counts as valid only if it stayed on the road AND inside the +/-12 degree tire fit; invalid laps are discarded, not plotted as fast times.</text></svg>