 font-style="normal">shading is friction-ellipse utilisation at that instant, hypot(Fx/Fx_peak, Fy/Fy_peak) — the same measure regardless of whether a human or a policy</text><text x="60.0" y="734.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">chose the forces.</text><text x="40.0" y="860.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] production run, 3 seeds/variant, 5,000,000 steps each · RUNG 2 — mechanism and ordering only, not a real car (rule 15)</text><text x="40" y="882" fill="#6f6a63" font-size="11" font-style="italic">The classical panel has no seed and no D6 verdict — it is not a trained policy.</text></svg>