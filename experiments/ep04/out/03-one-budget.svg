<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Inter, system-ui, sans-serif"><rect width="1180" height="520" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">One budget, spent three ways</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same tire at the same load (3,600 N). The ring is everything it can make; the arrow is what is being asked of it.</text><circle cx="250.0" cy="258.0" r="108.0" fill="#e2614a" opacity="0.08"/><circle cx="250.0" cy="258.0" r="108.0" fill="none" stroke="#e8e4dd" stroke-width="2.2"/><g opacity="1.0"><line x1="250.0" y1="258.0" x2="149.7" y2="258.0" stroke="#e2614a" stroke-width="2.6" stroke-linecap="round"/><polygon points="142.0,258.0 151.0,261.8 151.0,254.2" fill="#e2614a"/></g><text x="250.0" y="396.0" fill="#e8e4dd" font-size="14" text-anchor="middle" font-weight="600" font-style="normal">Turning only</text><text x="250.0" y="418.0" fill="#6f6a63" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">braking 0%   ·   cornering 100%</text><circle cx="590.0" cy="258.0" r="108.0" fill="#e2614a" opacity="0.08"/><circle cx="590.0" cy="258.0" r="108.0" fill="none" stroke="#e8e4dd" stroke-width="2.2"/><g opacity="1.0"><line x1="590.0" y1="258.0" x2="518.3" y2="328.2" stroke="#e2614a" stroke-width="2.6" stroke-linecap="round"/><polygon points="512.9,333.6 521.9,330.0 516.7,324.6" fill="#e2614a"/></g><text x="590.0" y="396.0" fill="#e8e4dd" font-size="14" text-anchor="middle" font-weight="600" font-style="normal">Braking AND turning</text><text x="590.0" y="418.0" fill="#6f6a63" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">braking 70%   ·   cornering 71%</text><circle cx="930.0" cy="258.0" r="108.0" fill="#e2614a" opacity="0.08"/><circle cx="930.0" cy="258.0" r="108.0" fill="none" stroke="#e8e4dd" stroke-width="2.2"/><g opacity="1.0"><line x1="930.0" y1="258.0" x2="930.0" y2="358.4" stroke="#e2614a" stroke-width="2.6" stroke-linecap="round"/><polygon points="930.0,366.0 933.8,357.0 926.2,357.0" fill="#e2614a"/></g><text x="930.0" y="396.0" fill="#e8e4dd" font-size="14" text-anchor="middle" font-weight="600" font-style="normal">Braking only</text><text x="930.0" y="418.0" fill="#6f6a63" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal">braking 100%   ·   cornering 0%</text><text x="590.0" y="104.0" fill="#6f6a63" font-size="13" text-anchor="middle" font-weight="italic" font-style="normal">the ring is the limit — the arrow can move around it, but never past it</text><text x="40.0" y="446.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">A tire does not get a separate allowance for stopping and for turning — it has one, and spending it one way leaves less for the other.</text><text x="40.0" y="466.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">Spend 70% of it braking and about 71% is left to corner with — which is why braking and turning at once is a trade, not a mistake.</text><text x="40.0" y="494.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] Sedan_Pac02Tire.tir  ·  MF 2002 pure slip  ·  offsets removed  ·  Fz0′ 3929 N  ·  LMUY 1 · LKY 1 · LFZO 0.81  ·  ellipse relation [ASSUMED] (D9): fy scaled by sqrt(1-(fx/fx_peak)^2); percentages [DERIVED] from it</text></svg>