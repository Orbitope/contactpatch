<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="Inter, system-ui, sans-serif"><rect width="1500" height="940" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">The throttle decides which way it steers you</text><text x="40" y="70" fill="#6f6a63" font-size="13">Yaw moment against how much force the driver asks of the rear axle, in one steady corner. Below the crossing a locking differential pushes the car wide; above it, the same device turns the car in.</text><text x="150.0" y="168.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Yaw moment against throttle</text><line x1="300" y1="190" x2="300" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="450" y1="190" x2="450" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="600" y1="190" x2="600" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="750" y1="190" x2="750" y2="620" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="298" x2="900" y2="298" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="405" x2="900" y2="405" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="512" x2="900" y2="512" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="620" x2="900" y2="620" stroke="#6f6a63" stroke-width="1"/><line x1="150" y1="190" x2="150" y2="620" stroke="#6f6a63" stroke-width="1"/><text x="150" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">0</text><text x="323" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">1500</text><text x="496" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">3000</text><text x="669" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">4500</text><text x="842" y="640" fill="#6f6a63" font-size="11" text-anchor="middle">6000</text><text x="140" y="615" fill="#6f6a63" font-size="11" text-anchor="end">-2121</text><text x="140" y="514" fill="#6f6a63" font-size="11" text-anchor="end">-1104</text><text x="140" y="404" fill="#6f6a63" font-size="11" text-anchor="end">+0</text><text x="140" y="299" fill="#6f6a63" font-size="11" text-anchor="end">+1054</text><text x="140" y="203" fill="#6f6a63" font-size="11" text-anchor="end">+2022</text><text x="525.0" y="666" fill="#e8e4dd" font-size="12.5" text-anchor="middle">force asked of the rear axle (N)</text><text x="92" y="405.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 92 405.0)">yaw moment (N.m)   negative = pushed wide</text><line x1="150" y1="400.1" x2="900" y2="400.1" stroke="#e8e4dd" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.6"/><text x="158.0" y="390.1" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">no effect either way</text><text x="892.0" y="208.0" fill="#4aa8a0" font-size="11.5" text-anchor="end" font-weight="600" font-style="normal">turns the car IN</text><text x="892.0" y="608.0" fill="#e2614a" font-size="11.5" text-anchor="end" font-weight="600" font-style="normal">pushes the car WIDE</text><path d="M 150.0,400.1 L 161.5,400.1 L 173.1,400.1 L 184.6,400.1 L 196.2,400.1 L 207.7,400.1 L 219.2,400.1 L 230.8,400.1 L 242.3,400.1 L 253.8,400.1 L 265.4,400.1 L 276.9,400.1 L 288.5,400.1 L 300.0,400.1 L 311.5,400.1 L 323.1,400.1 L 334.6,400.1 L 346.2,400.1 L 357.7,400.1 L 369.2,400.1 L 380.8,400.1 L 392.3,400.1 L 403.8,400.1 L 415.4,400.1 L 426.9,400.1 L 438.5,400.1 L 450.0,400.1 L 461.5,400.1 L 473.1,400.1 L 484.6,400.1 L 496.2,400.1 L 507.7,400.1 L 519.2,400.1 L 530.8,400.1 L 542.3,400.1 L 553.8,400.1 L 565.4,400.1 L 576.9,400.1 L 588.5,400.1 L 600.0,400.1 L 611.5,400.1 L 623.1,400.1 L 634.6,400.1 L 646.2,400.1 L 657.7,400.1 L 669.2,400.1 L 680.8,400.1 L 692.3,400.1 L 703.8,400.1 L 715.4,400.1 L 726.9,400.1 L 738.5,400.1 L 750.0,400.1 L 761.5,400.1 L 773.1,400.1 L 784.6,400.1 L 796.2,400.1 L 807.7,400.1 L 819.2,400.1 L 830.8,400.1 L 842.3,400.1 L 853.8,400.1 L 865.4,400.1 L 876.9,400.1 L 888.5,400.1 L 900.0,400.1" fill="none" stroke="#4aa8a0" stroke-width="3"/><path d="M 150.0,400.1 L 161.5,502.6 L 173.1,502.6 L 184.6,502.6 L 196.2,502.6 L 207.7,502.6 L 219.2,502.6 L 230.8,502.6 L 242.3,502.6 L 253.8,502.6 L 265.4,502.6 L 276.9,502.6 L 288.5,502.6 L 300.0,502.6 L 311.5,502.6 L 323.1,502.6 L 334.6,502.6 L 346.2,502.6 L 357.7,502.6 L 369.2,502.6 L 380.8,502.6 L 392.3,502.6 L 403.8,502.6 L 415.4,502.6 L 426.9,502.6 L 438.5,502.6 L 450.0,495.4 L 461.5,487.9 L 473.1,480.5 L 484.6,473.1 L 496.2,465.6 L 507.7,458.2 L 519.2,450.7 L 530.8,443.3 L 542.3,435.8 L 553.8,428.4 L 565.4,420.9 L 576.9,413.5 L 588.5,406.0 L 600.0,398.6 L 611.5,391.1 L 623.1,383.7 L 634.6,376.2 L 646.2,368.8 L 657.7,361.3 L 669.2,353.9 L 680.8,346.4 L 692.3,339.0 L 703.8,331.6 L 715.4,327.9 L 726.9,327.9 L 738.5,327.9 L 750.0,327.9 L 761.5,327.9 L 773.1,327.9 L 784.6,327.9 L 796.2,327.9 L 807.7,327.9 L 819.2,327.9 L 830.8,327.9 L 842.3,327.9 L 853.8,327.9 L 865.4,327.9 L 876.9,327.9 L 888.5,327.9 L 900.0,327.9" fill="none" stroke="#e0a53c" stroke-width="3"/><circle cx="597.6" cy="400.1" r="6" fill="#1a1a1c" stroke="#e0a53c" stroke-width="2.5"/><text x="597.6" y="384.1" fill="#e0a53c" font-size="11.5" text-anchor="middle" font-weight="600" font-style="normal">changes its mind at 3880 N</text><path d="M 150.0,400.1 L 161.5,605.1 L 173.1,605.1 L 184.6,605.1 L 196.2,605.1 L 207.7,605.1 L 219.2,605.1 L 230.8,605.1 L 242.3,605.1 L 253.8,605.1 L 265.4,605.1 L 276.9,605.1 L 288.5,599.7 L 300.0,592.2 L 311.5,584.8 L 323.1,577.3 L 334.6,569.9 L 346.2,562.4 L 357.7,555.0 L 369.2,547.5 L 380.8,540.1 L 392.3,532.6 L 403.8,525.2 L 415.4,517.7 L 426.9,510.3 L 438.5,502.8 L 450.0,495.4 L 461.5,487.9 L 473.1,480.5 L 484.6,473.1 L 496.2,465.6 L 507.7,458.2 L 519.2,450.7 L 530.8,443.3 L 542.3,435.8 L 553.8,428.4 L 565.4,420.9 L 576.9,413.5 L 588.5,406.0 L 600.0,398.6 L 611.5,391.1 L 623.1,383.7 L 634.6,376.2 L 646.2,368.8 L 657.7,361.3 L 669.2,353.9 L 680.8,346.4 L 692.3,339.0 L 703.8,331.6 L 715.4,324.1 L 726.9,316.7 L 738.5,309.2 L 750.0,301.8 L 761.5,294.3 L 773.1,286.9 L 784.6,279.4 L 796.2,272.0 L 807.7,264.5 L 819.2,257.1 L 830.8,249.6 L 842.3,242.2 L 853.8,234.7 L 865.4,227.3 L 876.9,219.8 L 888.5,212.4 L 900.0,204.9" fill="none" stroke="#e2614a" stroke-width="3"/><circle cx="597.6" cy="400.1" r="6" fill="#1a1a1c" stroke="#e2614a" stroke-width="2.5"/><text x="597.6" y="384.1" fill="#e2614a" font-size="11.5" text-anchor="middle" font-weight="600" font-style="normal">changes its mind at 3880 N</text><text x="940.0" y="180.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">the three devices</text><line x1="940" y1="205" x2="982" y2="205" stroke="#4aa8a0" stroke-width="3.4"/><text x="994.0" y="210.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">open</text><text x="940.0" y="234.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">part throttle       +0 N.m</text><text x="940.0" y="252.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">full throttle       +0 N.m</text><text x="940.0" y="274.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delivers 3880 of 6000 N</text><line x1="940" y1="321" x2="982" y2="321" stroke="#e0a53c" stroke-width="3.4"/><text x="994.0" y="326.0" fill="#e0a53c" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">limited-slip (1.5:1)</text><text x="940.0" y="350.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">part throttle    -1029 N.m</text><text x="940.0" y="368.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">full throttle     +725 N.m</text><text x="940.0" y="390.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delivers 4850 of 6000 N</text><line x1="940" y1="437" x2="982" y2="437" stroke="#e2614a" stroke-width="3.4"/><text x="994.0" y="442.0" fill="#e2614a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">welded</text><text x="940.0" y="466.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">part throttle    -2057 N.m</text><text x="940.0" y="484.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">full throttle    +1585 N.m</text><text x="940.0" y="506.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delivers 6000 of 6000 N</text><line x1="150.0" y1="672.0" x2="1200.0" y2="672.0" stroke="#2e2e31" stroke-width="1.0"/><text x="150.0" y="706.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">An open differential is the flat line: it feeds both wheels equally and resists nothing, so it has no handling effect to have — and it pays for that by delivering only</text><text x="150.0" y="727.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">3880 N of the 6000 N asked for, because it is limited by twice the weaker wheel. The other two recover that force, and the price is a car that steers itself.</text><text x="40.0" y="900.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, steady left corner R=40 m, a_y=9.0 m/s2, v=19.0 m/s  -  [ASSUMED] LSD torque bias 1.5:1, locking 0.5  -  [LIKELY] track width  -  RUNG 2 — mechanism and ordering only, not a real car (rule 15)</text><text x="40" y="922" fill="#6f6a63" font-size="11" font-style="italic">Circles mark where each device crosses from pushing wide to turning in. One steady corner and one car: rank ordering and the two signs are the result, the magnitudes are illustrative (rules 6 and 15).</text></svg>