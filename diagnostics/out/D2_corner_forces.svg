="0.5"/></g></g><g opacity="1.0"><line x1="1080.0" y1="288.0" x2="1169.8" y2="288.0" stroke="#e0a53c" stroke-width="3.2" stroke-linecap="round"/><polygon points="1180.0,288.0 1168.0,283.0 1168.0,293.0" fill="#e0a53c"/></g><text x="1192.0" y="280.0" fill="#e0a53c" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">front 5.5 kN</text><g opacity="1.0"><line x1="1080.0" y1="412.0" x2="1154.6" y2="412.0" stroke="#4aa8a0" stroke-width="3.2" stroke-linecap="round"/><polygon points="1164.8,412.0 1152.8,407.0 1152.8,417.0" fill="#4aa8a0"/></g><text x="1176.8" y="404.0" fill="#4aa8a0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">rear 4.7 kN</text><text x="1020.0" y="618.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">steer -5.11°  ·  grip points right, into the corner</text><line x1="60.0" y1="660.0" x2="1420.0" y2="660.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="700.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Both tires push toward the inside of the corner, and the front pushes harder — it has more weight on it and a longer lever to the centre of mass.</text><text x="60.0" y="722.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Mirror the steering input and every force mirrors with it, to within 0.2% (D2 asserts 0.5%). The residual is one deliberately retained term in the</text><text x="60.0" y="744.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">tire formula, not an asymmetry in the car — see FINDINGS D2.</text><text x="40.0" y="780.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] bicycle model + Sedan_Pac02Tire.tir  ·  offsets removed  ·  m 1360 kg · L 2.575 m · h 0.460 m · 54% front  ·  [SOURCED] RV-1 parameters, vehicle-reference-parameters.md §1  ·  arrow length is force, to one scale in both panels</text><text x="40" y="802" fill="#6f6a63" font-size="11" font-style="italic">A tire makes force by being pointed slightly away from where it is going. Everything a car does in a corner comes from those two arrows.</text></svg>