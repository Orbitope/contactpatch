<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Does the controller flatten design sensitivity?</text><text x="40" y="70" fill="#6f6a63" font-size="13">Spread in cornering-limit grip_use across each design sweep — smaller is flatter. Bars share one scale.</text><text x="40.0" y="122.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Layout, 1x power</text><rect x="260" y="130" width="296.4" height="16" fill="#e2614a" opacity="0.85"/><text x="564.4" y="143.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.271</text><rect x="260" y="152" width="18.2" height="16" fill="#4aa8a0" opacity="0.85"/><text x="286.2" y="165.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.017</text><text x="40.0" y="164.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">16.3x flatter</text><text x="40.0" y="200.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Layout, 2x power</text><rect x="260" y="208" width="780.0" height="16" fill="#e2614a" opacity="0.85"/><text x="1048.0" y="221.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.713</text><rect x="260" y="230" width="16.6" height="16" fill="#4aa8a0" opacity="0.85"/><text x="284.6" y="243.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.015</text><text x="40.0" y="242.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">47.1x flatter</text><text x="40.0" y="278.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Balance (RWD), 1x power</text><rect x="260" y="286" width="94.4" height="16" fill="#e2614a" opacity="0.85"/><text x="362.4" y="299.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.086</text><rect x="260" y="308" width="51.3" height="16" fill="#4aa8a0" opacity="0.85"/><text x="319.3" y="321.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.047</text><text x="40.0" y="320.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">1.8x flatter</text><text x="40.0" y="356.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Balance (RWD), 2x power</text><rect x="260" y="364" width="405.7" height="16" fill="#e2614a" opacity="0.85"/><text x="673.7" y="377.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.371</text><rect x="260" y="386" width="39.7" height="16" fill="#4aa8a0" opacity="0.85"/><text x="307.7" y="399.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.036</text><text x="40.0" y="398.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">10.2x flatter</text><text x="40.0" y="434.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Balance (FWD), 1x power</text><rect x="260" y="442" width="99.4" height="16" fill="#e2614a" opacity="0.85"/><text x="367.4" y="455.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.091</text><rect x="260" y="464" width="102.7" height="16" fill="#4aa8a0" opacity="0.85"/><text x="370.7" y="477.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.094</text><text x="40.0" y="476.0" fill="#e0a53c" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">no measurable flattening</text><text x="40.0" y="512.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">Balance (FWD), 2x power</text><rect x="260" y="520" width="99.4" height="16" fill="#e2614a" opacity="0.85"/><text x="367.4" y="533.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV off: 0.091</text><rect x="260" y="542" width="87.8" height="16" fill="#4aa8a0" opacity="0.85"/><text x="355.8" y="555.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">TV on: 0.080</text><text x="40.0" y="554.0" fill="#4aa8a0" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">1.1x flatter</text><line x1="40.0" y1="604.0" x2="1120.0" y2="604.0" stroke="#2e2e31" stroke-width="1.0"/><text x="40.0" y="630.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The front-driven balance sweep is not a gap in the result — its limit is a front-tire slip-angle ceiling, not a traction problem, so there is nothing for an allocator to redistribute.</text><text x="40.0" y="600.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long_exit, grip_use held fixed at 0.65, 2x power  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="602" fill="#6f6a63" font-size="11" font-style="italic">Rung 2 (rule 15) — a trend on a model with no roll camber, roll steer or compliance steer, not a claim about a real car.</text></svg>