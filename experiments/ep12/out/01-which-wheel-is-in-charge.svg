<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="960" viewBox="0 0 1540 960" font-family="Inter, system-ui, sans-serif"><rect width="1540" height="960" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">Which wheel is in charge?</text><text x="40" y="70" fill="#6f6a63" font-size="13">The same welded differential, in the same left-hand corner, at two throttle openings. A differential resists the two driven wheels turning at different speeds — and which wheel is turning faster changes with the throttle.</text><text x="60.0" y="152.0" fill="#e8e4dd" font-size="18" text-anchor="start" font-weight="600" font-style="normal">Part throttle</text><text x="60.0" y="176.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">1000 N asked of the rear axle</text><g transform="rotate(0.000 310.0 400.0)"><rect x="251.0" y="275.0" width="118" height="250" rx="29.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 301.0,291.0 L 310.0,279.0 L 319.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(14.00 242.6 325.0)"><rect x="230.6" y="298.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="234.9" y="309.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="238.2" y1="303.0" x2="238.2" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="242.6" y1="303.0" x2="242.6" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="247.0" y1="303.0" x2="247.0" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(14.00 377.4 325.0)"><rect x="365.4" y="298.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="368.9" y="306.5" width="17.0" height="37.0" rx="7.1" fill="#7f8ea3" opacity="0.9"/><line x1="373.0" y1="303.0" x2="373.0" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="377.4" y1="303.0" x2="377.4" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="381.8" y1="303.0" x2="381.8" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 242.6 475.0)"><rect x="230.6" y="448.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="234.9" y="459.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="238.2" y1="453.0" x2="238.2" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="242.6" y1="453.0" x2="242.6" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="247.0" y1="453.0" x2="247.0" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 377.4 475.0)"><rect x="365.4" y="448.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="368.9" y="456.5" width="17.0" height="37.0" rx="7.1" fill="#7f8ea3" opacity="0.9"/><line x1="373.0" y1="453.0" x2="373.0" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="377.4" y1="453.0" x2="377.4" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="381.8" y1="453.0" x2="381.8" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="310.0" y1="252.0" x2="310.0" y2="221.7" stroke="#6f6a63" stroke-width="2.0" stroke-linecap="round"/><polygon points="310.0,214.0 306.2,223.0 313.8,223.0" fill="#6f6a63"/></g><text x="310.0" y="204.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">travelling this way</text><text x="244.0" y="522.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">inside</text><text x="376.0" y="522.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">outside</text><g opacity="1.0"><line x1="251.0" y1="478.0" x2="251.0" y2="421.3" stroke="#4aa8a0" stroke-width="5.0" stroke-linecap="round"/><polygon points="251.0,409.4 245.1,423.4 256.9,423.4" fill="#4aa8a0"/></g><text x="233.0" y="443.7" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1876 N</text><g opacity="1.0"><line x1="369.0" y1="478.0" x2="369.0" y2="498.1" stroke="#e2614a" stroke-width="5.0" stroke-linecap="round"/><polygon points="369.0,510.0 374.9,496.0 363.1,496.0" fill="#e2614a"/></g><text x="387.0" y="494.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-876 N</text><text x="387.0" y="512.0" fill="#e2614a" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">dragged back</text><path d="M 167.5,311.0 A 168,168 0 0 1 452.5,311.0" fill="none" stroke="#e2614a" stroke-width="3.4" opacity="0.9"/><g opacity="1.0"><line x1="464.3" y1="303.6" x2="463.3" y2="304.2" stroke="#e2614a" stroke-width="3.4" stroke-linecap="round"/><polygon points="452.5,311.0 468.5,308.4 461.9,297.7" fill="#e2614a"/></g><text x="310.0" y="602.0" fill="#e2614a" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">twisted OUT of the corner</text><text x="60.0" y="650.0" fill="#e2614a" font-size="14" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-2057 N.m of yaw moment</text><text x="60.0" y="678.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The outside wheel travels further, so it turns faster. The</text><text x="60.0" y="698.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">device drags it back and pushes the inside wheel on.</text><text x="800.0" y="152.0" fill="#e8e4dd" font-size="18" text-anchor="start" font-weight="600" font-style="normal">Full throttle</text><text x="800.0" y="176.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">6000 N asked of the rear axle</text><g transform="rotate(0.000 1050.0 400.0)"><rect x="991.0" y="275.0" width="118" height="250" rx="29.5" fill="none" stroke="#6f6a63" stroke-width="1.8"/><path d="M 1041.0,291.0 L 1050.0,279.0 L 1059.0,291.0" fill="none" stroke="#6f6a63" stroke-width="1.6"/><g transform="rotate(14.00 982.6 325.0)"><rect x="970.6" y="298.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="974.9" y="309.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="978.2" y1="303.0" x2="978.2" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="982.6" y1="303.0" x2="982.6" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="987.0" y1="303.0" x2="987.0" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(14.00 1117.4 325.0)"><rect x="1105.4" y="298.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1108.9" y="306.5" width="17.0" height="37.0" rx="7.1" fill="#7f8ea3" opacity="0.9"/><line x1="1113.0" y1="303.0" x2="1113.0" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.4" y1="303.0" x2="1117.4" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1121.8" y1="303.0" x2="1121.8" y2="347.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 982.6 475.0)"><rect x="970.6" y="448.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="974.9" y="459.9" width="15.4" height="30.3" rx="6.5" fill="#7f8ea3" opacity="0.9"/><line x1="978.2" y1="453.0" x2="978.2" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="982.6" y1="453.0" x2="982.6" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="987.0" y1="453.0" x2="987.0" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g><g transform="rotate(0.00 1117.4 475.0)"><rect x="1105.4" y="448.0" width="24" height="54" rx="6.6" fill="#3a3a3f" stroke="#6f6a63" stroke-width="1.2"/><rect x="1108.9" y="456.5" width="17.0" height="37.0" rx="7.1" fill="#7f8ea3" opacity="0.9"/><line x1="1113.0" y1="453.0" x2="1113.0" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1117.4" y1="453.0" x2="1117.4" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/><line x1="1121.8" y1="453.0" x2="1121.8" y2="497.0" stroke="#6f6a63" stroke-width="0.8" opacity="0.5"/></g></g><g opacity="1.0"><line x1="1050.0" y1="252.0" x2="1050.0" y2="221.7" stroke="#6f6a63" stroke-width="2.0" stroke-linecap="round"/><polygon points="1050.0,214.0 1046.2,223.0 1053.8,223.0" fill="#6f6a63"/></g><text x="1050.0" y="204.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">travelling this way</text><text x="984.0" y="522.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">inside</text><text x="1116.0" y="522.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">outside</text><g opacity="1.0"><line x1="991.0" y1="478.0" x2="991.0" y2="418.9" stroke="#4aa8a0" stroke-width="5.0" stroke-linecap="round"/><polygon points="991.0,407.0 985.1,421.0 996.9,421.0" fill="#4aa8a0"/></g><text x="973.0" y="442.5" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1940 N</text><g opacity="1.0"><line x1="1109.0" y1="478.0" x2="1109.0" y2="341.4" stroke="#4aa8a0" stroke-width="5.0" stroke-linecap="round"/><polygon points="1109.0,329.5 1103.1,343.5 1114.9,343.5" fill="#4aa8a0"/></g><text x="1127.0" y="403.7" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+4060 N</text><path d="M 1192.5,311.0 A 168,168 0 0 0 907.5,311.0" fill="none" stroke="#4aa8a0" stroke-width="3.4" opacity="0.9"/><g opacity="1.0"><line x1="919.4" y1="318.4" x2="918.3" y2="317.7" stroke="#4aa8a0" stroke-width="3.4" stroke-linecap="round"/><polygon points="907.5,311.0 916.9,324.3 923.6,313.6" fill="#4aa8a0"/></g><text x="1050.0" y="602.0" fill="#4aa8a0" font-size="12.5" text-anchor="middle" font-weight="600" font-style="normal">twisted INTO the corner</text><text x="800.0" y="650.0" fill="#4aa8a0" font-size="14" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1585 N.m of yaw moment</text><text x="800.0" y="678.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The inside wheel has run out of grip and is spinning, so</text><text x="800.0" y="698.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">now IT is the faster one. Torque flows the other way, to</text><text x="800.0" y="718.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">the wheel that still grips.</text><line x1="60.0" y1="790.0" x2="1420.0" y2="790.0" stroke="#2e2e31" stroke-width="1.0"/><text x="60.0" y="824.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">This is one mechanism, not two. Torque flows from the faster-turning wheel to the slower one — that is all a limited-slip or welded differential does. Everything above follows</text><text x="60.0" y="845.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">from which wheel happens to be faster, and the throttle decides that. An earlier model of mine hard-coded the direction and could therefore only ever produce one of these two pictures.</text><text x="40.0" y="920.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, steady left corner R=40 m, a_y=9.0 m/s2, v=19.0 m/s  -  [ASSUMED] LSD torque bias 1.5:1, locking 0.5  -  [LIKELY] track width  -  RUNG 2 — mechanism and ordering only, not a real car (rule 15)</text><text x="40" y="942" fill="#6f6a63" font-size="11" font-style="italic">Arrow length is longitudinal force at the contact patch, to scale between the panels. Teal pushes the car forwards, red drags it back. Contact-patch shading is static load; the car is drawn nose-up and is turning left.</text></svg>