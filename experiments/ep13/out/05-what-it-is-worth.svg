<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1000" viewBox="0 0 1540 1000" font-family="Inter, system-ui, sans-serif"><rect width="1540" height="1000" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">What it is worth, and how much of it is the thing you think</text><text x="40" y="70" fill="#6f6a63" font-size="13">Against the best published figure, decomposed into the layer that earned it, and put through every number the result rests on.</text><text x="70.0" y="178.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Torque vectoring against the passive car</text><text x="70.0" y="197.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">percent improvement, four ways of asking</text><text x="330.0" y="231.0" fill="#e8e4dd" font-size="13" text-anchor="end" font-weight="normal" font-style="normal">cornering limit</text><rect x="340" y="214" width="290.0" height="24" rx="4" fill="#4aa8a0" opacity="0.85"/><text x="642.0" y="231.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+5.18%</text><text x="330.0" y="277.0" fill="#e8e4dd" font-size="13" text-anchor="end" font-weight="normal" font-style="normal">skidpad lateral g</text><rect x="340" y="260" width="72.9" height="24" rx="4" fill="#4aa8a0" opacity="0.85"/><text x="424.9" y="277.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+1.30%</text><text x="330.0" y="323.0" fill="#e8e4dd" font-size="13" text-anchor="end" font-weight="normal" font-style="normal">corner section time</text><rect x="340" y="306" width="38.9" height="24" rx="4" fill="#4aa8a0" opacity="0.85"/><text x="390.9" y="323.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.69%</text><text x="330.0" y="369.0" fill="#e8e4dd" font-size="13" text-anchor="end" font-weight="normal" font-style="normal">whole lap time</text><rect x="340" y="352" width="28.7" height="24" rx="4" fill="#4aa8a0" opacity="0.85"/><text x="380.7" y="369.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0.51%</text><line x1="844.0" y1="206" x2="844.0" y2="452" stroke="#e0a53c" stroke-width="2" stroke-dasharray="6 5"/><text x="844.0" y="472.0" fill="#e0a53c" font-size="12" text-anchor="middle" font-weight="600" font-style="normal">~9%: best published figure (FSAE, skidpad)</text><text x="844.0" y="490.0" fill="#6f6a63" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal">an outside ceiling — beating it would be a bug</text><text x="340.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">0%</text><text x="452.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">2%</text><text x="564.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">4%</text><text x="676.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">6%</text><text x="788.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">8%</text><text x="900.0" y="436.0" fill="#6f6a63" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal">10%</text><text x="70.0" y="486.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Which layer earned it?</text><text x="70.0" y="505.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">cornering limit, three configurations</text><text x="330.0" y="551.0" fill="#7f8ea3" font-size="13" text-anchor="end" font-weight="600" font-style="normal">open differential</text><rect x="340" y="535" width="75.8" height="22" rx="4" fill="#7f8ea3" opacity="0.85"/><text x="427.8" y="551.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.041</text><text x="330.0" y="593.0" fill="#8a7bd8" font-size="13" text-anchor="end" font-weight="600" font-style="normal">allocator, no yaw control</text><rect x="340" y="577" width="239.2" height="22" rx="4" fill="#8a7bd8" opacity="0.85"/><text x="591.2" y="593.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.063</text><text x="330.0" y="635.0" fill="#4aa8a0" font-size="13" text-anchor="end" font-weight="600" font-style="normal">torque vectoring, four wheels</text><rect x="340" y="619" width="484.2" height="22" rx="4" fill="#4aa8a0" opacity="0.85"/><text x="836.2" y="635.0" fill="#e8e4dd" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.095</text><line x1="340" y1="528" x2="340" y2="670" stroke="#6f6a63" stroke-width="1.2"/><text x="408.1" y="686.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">1.04</text><text x="559.6" y="686.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">1.06</text><text x="711.2" y="686.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">1.08</text><text x="862.7" y="686.0" fill="#6f6a63" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal">1.10</text><text x="340.0" y="706.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">note the axis starts at 1.031, not zero — these bars are a zoom on a 7.4-point range</text><text x="340.0" y="736.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">The middle bar is the same allocator with its yaw demand forced to zero:</text><text x="340.0" y="757.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">four wheels sharing brake and drive force in proportion to what each has</text><text x="340.0" y="778.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">left, and no yaw control at all. It accounts for 40% of the improvement.</text><text x="340.0" y="799.0" fill="#6f6a63" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">Most of what this system buys on this lap is not torque vectoring.</text><text x="980.0" y="306.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Does the conclusion survive?</text><text x="980.0" y="325.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">cornering-limit gain under every number it rests on</text><text x="980.0" y="354.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nominal    +5.18%</text><text x="980.0" y="384.0" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> +5.36%</text><text x="1064.0" y="384.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">track width x0.97</text><text x="980.0" y="408.0" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> +5.00%</text><text x="1064.0" y="408.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">track width x1.03</text><text x="980.0" y="432.0" fill="#e2614a" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> -0.34%</text><text x="1064.0" y="432.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">preview 30% less far ahead</text><text x="980.0" y="456.0" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+11.55%</text><text x="1064.0" y="456.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">preview 30% further ahead</text><text x="980.0" y="480.0" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> +5.18%</text><text x="1064.0" y="480.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">prefers the moment (s_mz=4)</text><text x="980.0" y="504.0" fill="#4aa8a0" font-size="13" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> +4.66%</text><text x="1064.0" y="504.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">prefers the force (s_mz=0.25)</text><text x="980.0" y="536.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">The driver's preview time is the one that</text><text x="980.0" y="554.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">matters: the same controller is worth nothing</text><text x="980.0" y="572.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">measurable to a driver who looks close, and</text><text x="980.0" y="590.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">11.6% to one who looks far.</text><text x="980.0" y="632.0" fill="#e8e4dd" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">steering disturbance, 40 seeds</text><text x="980.0" y="650.0" fill="#6f6a63" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">valid laps = finished, on the road, inside the fit</text><text x="980.0" y="676.0" fill="#7f8ea3" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> 31/40</text><text x="1050.0" y="676.0" fill="#7f8ea3" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">open diff</text><text x="1380.0" y="676.0" fill="#6f6a63" font-size="12.5" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.60 +/- 0.01 s</text><text x="980.0" y="700.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  3/40</text><text x="1050.0" y="700.0" fill="#e0a53c" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">LSD</text><text x="1380.0" y="700.0" fill="#6f6a63" font-size="12.5" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.66 +/- 0.04 s</text><text x="980.0" y="724.0" fill="#8a7bd8" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> 40/40</text><text x="1050.0" y="724.0" fill="#8a7bd8" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">allocator only</text><text x="1380.0" y="724.0" fill="#6f6a63" font-size="12.5" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.61 +/- 0.01 s</text><text x="980.0" y="748.0" fill="#4aa8a0" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> 40/40</text><text x="1050.0" y="748.0" fill="#4aa8a0" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">TV (4 wheels)</text><text x="1380.0" y="748.0" fill="#6f6a63" font-size="12.5" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.58 +/- 0.01 s</text><text x="980.0" y="772.0" fill="#7fa86a" font-size="12.5" text-anchor="start" font-weight="600" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> 40/40</text><text x="1050.0" y="772.0" fill="#7fa86a" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal">TV (rear axle)</text><text x="1380.0" y="772.0" fill="#6f6a63" font-size="12.5" text-anchor="end" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.60 +/- 0.02 s</text><line x1="70.0" y1="810.0" x2="1400.0" y2="810.0" stroke="#2e2e31" stroke-width="1.0"/><text x="70.0" y="844.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">The honest summary: the controller does what it says on the tin — it tracks the reference yaw rate, the allocator delivers the moment asked for, and</text><text x="70.0" y="866.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">the car survives +5.2% more cornering demand. But the lap-time number is +0.51%, an order of magnitude below the published skidpad figure, and most</text><text x="70.0" y="888.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">of what is left is the allocator rather than the yaw control. On this car, on this corner, with a driver who does not make mistakes, torque</text><text x="70.0" y="910.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">vectoring is a small effect measured carefully. To a driver who DOES make mistakes it is worth much more: under steering noise the passive car loses</text><text x="70.0" y="932.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">9 laps of 40 and the controlled one loses none.</text><text x="40.0" y="947.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long exit (393 m), grip_use swept to failure  -  [MEASURED] reference model K=0.20 deg/g, grip ceiling 0.95 g</text><text x="40.0" y="960.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED — CITATION OUTSTANDING] ~9% skidpad ceiling, FSAE  -  [LIKELY] track width — the moment arm; conclusion re-run at +/-3%  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="982" fill="#6f6a63" font-size="11" font-style="italic">Every percentage is against the open-differential car driven by the same driver on the same line. The 9% line is the most favourable published case, not a target.</text></svg>