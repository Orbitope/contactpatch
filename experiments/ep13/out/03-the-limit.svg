<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="980" viewBox="0 0 1540 980" font-family="Inter, system-ui, sans-serif"><rect width="1540" height="980" fill="#1a1a1c"/><text x="40" y="46" fill="#e8e4dd" font-size="21" font-weight="600">How hard can the driver try before the car cannot do it?</text><text x="40" y="70" fill="#6f6a63" font-size="13">Same driver, same line, same speed plan. The plan is built for a fraction of the car's measured grip; turn that fraction up and the lap gets quicker until the car runs out of road or slides past the tire fit.</text><text x="150.0" y="178.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">Lap time against how hard the driver tries</text><line x1="293" y1="200" x2="293" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="437" y1="200" x2="437" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="580" y1="200" x2="580" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="723" y1="200" x2="723" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="867" y1="200" x2="867" y2="660" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="315" x2="1010" y2="315" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="430" x2="1010" y2="430" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="545" x2="1010" y2="545" stroke="#2e2e31" stroke-width="1"/><line x1="150" y1="660" x2="1010" y2="660" stroke="#6f6a63" stroke-width="1"/><line x1="150" y1="200" x2="150" y2="660" stroke="#6f6a63" stroke-width="1"/><text x="177" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.85</text><text x="311" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.90</text><text x="446" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">0.95</text><text x="580" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.00</text><text x="714" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.05</text><text x="849" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.10</text><text x="983" y="680" fill="#6f6a63" font-size="11" text-anchor="middle">1.15</text><text x="140" y="600" fill="#6f6a63" font-size="11" text-anchor="end">14.4</text><text x="140" y="503" fill="#6f6a63" font-size="11" text-anchor="end">14.6</text><text x="140" y="405" fill="#6f6a63" font-size="11" text-anchor="end">14.8</text><text x="140" y="308" fill="#6f6a63" font-size="11" text-anchor="end">15.0</text><text x="140" y="210" fill="#6f6a63" font-size="11" text-anchor="end">15.2</text><text x="580.0" y="706" fill="#e8e4dd" font-size="12.5" text-anchor="middle">grip_use  —  the fraction of measured grip the speed plan assumes</text><text x="92" y="430.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 92 430.0)">lap time (s)</text><path d="M 176.9,280.3 L 210.5,305.4 L 244.1,329.1 L 277.7,351.4 L 311.3,375.1 L 344.8,397.4 L 378.4,417.8 L 412.0,437.8 L 445.6,458.5 L 479.2,476.8 L 512.8,495.9 L 546.4,513.0 L 580.0,526.9 L 613.6,540.9 L 647.2,553.4 L 680.8,563.2" fill="none" stroke="#7f8ea3" stroke-width="2.8" opacity="0.95"/><line x1="699.9" y1="200" x2="699.9" y2="660" stroke="#7f8ea3" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="680.8" cy="563.2" r="6" fill="#1a1a1c" stroke="#7f8ea3" stroke-width="2.6"/><path d="M 176.9,273.2 L 210.5,297.0 L 244.1,320.3 L 277.7,341.6 L 311.3,363.9 L 344.8,383.4 L 378.4,402.9 L 412.0,421.0 L 445.6,437.8 L 479.2,451.7" fill="none" stroke="#e0a53c" stroke-width="2.8" opacity="0.95"/><line x1="501.9" y1="200" x2="501.9" y2="660" stroke="#e0a53c" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="479.2" cy="451.7" r="6" fill="#1a1a1c" stroke="#e0a53c" stroke-width="2.6"/><path d="M 176.9,277.5 L 210.5,302.4 L 244.1,326.3 L 277.7,348.6 L 311.3,370.9 L 344.8,393.4 L 378.4,414.1 L 412.0,435.0 L 445.6,454.5 L 479.2,474.0 L 512.8,491.0 L 546.4,507.2 L 580.0,520.2 L 613.6,533.2 L 647.2,543.7 L 680.8,553.4 L 714.4,556.2 L 748.0,528.3" fill="none" stroke="#8a7bd8" stroke-width="2.8" opacity="0.95"/><line x1="757.8" y1="200" x2="757.8" y2="660" stroke="#8a7bd8" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="714.4" cy="556.2" r="6" fill="#1a1a1c" stroke="#8a7bd8" stroke-width="2.6"/><path d="M 176.9,281.7 L 210.5,306.8 L 244.1,330.5 L 277.7,354.2 L 311.3,377.2 L 344.8,399.9 L 378.4,421.0 L 412.0,441.9 L 445.6,462.8 L 479.2,482.3 L 512.8,500.7 L 546.4,518.6 L 580.0,533.2 L 613.6,546.4 L 647.2,559.0 L 680.8,569.0 L 714.4,578.8 L 748.0,586.8 L 781.6,542.3 L 815.2,481.0" fill="none" stroke="#4aa8a0" stroke-width="2.8" opacity="0.95"/><line x1="830.3" y1="200" x2="830.3" y2="660" stroke="#4aa8a0" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="748.0" cy="586.8" r="6" fill="#1a1a1c" stroke="#4aa8a0" stroke-width="2.6"/><path d="M 176.9,281.3 L 210.5,306.8 L 244.1,330.0 L 277.7,352.8 L 311.3,375.6 L 344.8,398.3 L 378.4,419.5 L 412.0,440.5 L 445.6,460.1 L 479.2,479.6 L 512.8,497.5 L 546.4,513.7 L 580.0,526.9 L 613.6,536.7 L 647.2,542.3 L 680.8,531.6 L 714.4,510.2 L 748.0,468.4 L 781.6,411.3" fill="none" stroke="#7fa86a" stroke-width="2.8" opacity="0.95"/><line x1="801.3" y1="200" x2="801.3" y2="660" stroke="#7fa86a" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="647.2" cy="542.3" r="6" fill="#1a1a1c" stroke="#7fa86a" stroke-width="2.6"/><text x="1004.0" y="190.0" fill="#6f6a63" font-size="11.5" text-anchor="end" font-weight="normal" font-style="normal">dashed line = the last aggression this car survives</text><text x="1060.0" y="190.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">the five configurations</text><line x1="1060" y1="215" x2="1102" y2="215" stroke="#4aa8a0" stroke-width="3.4"/><text x="1114.0" y="220.0" fill="#4aa8a0" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">torque vectoring, four wheels</text><text x="1060.0" y="244.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.093</text><text x="1060.0" y="262.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.419 s</text><text x="1060.0" y="280.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.967 g</text><line x1="1060" y1="303" x2="1102" y2="303" stroke="#7fa86a" stroke-width="3.4"/><text x="1114.0" y="308.0" fill="#7fa86a" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">torque-vectoring differential</text><text x="1060.0" y="332.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.082</text><text x="1060.0" y="350.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.511 s</text><text x="1060.0" y="368.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.953 g</text><line x1="1060" y1="391" x2="1102" y2="391" stroke="#8a7bd8" stroke-width="3.4"/><text x="1114.0" y="396.0" fill="#8a7bd8" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">allocator, no yaw control</text><text x="1060.0" y="420.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.066</text><text x="1060.0" y="438.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.482 s</text><text x="1060.0" y="456.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.974 g</text><line x1="1060" y1="479" x2="1102" y2="479" stroke="#7f8ea3" stroke-width="3.4"/><text x="1114.0" y="484.0" fill="#7f8ea3" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">open differential</text><text x="1060.0" y="508.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  1.045</text><text x="1060.0" y="526.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.468 s</text><text x="1060.0" y="544.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.961 g</text><line x1="1060" y1="567" x2="1102" y2="567" stroke="#e0a53c" stroke-width="3.4"/><text x="1114.0" y="572.0" fill="#e0a53c" font-size="13.5" text-anchor="start" font-weight="600" font-style="normal">limited-slip (1.5:1)</text><text x="1060.0" y="596.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit  0.971</text><text x="1060.0" y="614.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">best   14.697 s</text><text x="1060.0" y="632.0" fill="#6f6a63" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">peak   0.905 g</text><line x1="150.0" y1="736.0" x2="1240.0" y2="736.0" stroke="#2e2e31" stroke-width="1.0"/><text x="150.0" y="770.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">Every configuration drives the same plan, so at any point on this axis they are all attempting the same lap and take nearly the same time. The whole</text><text x="150.0" y="792.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">result is how far right each line reaches: the passive car gives up at 1.045, the controlled one at 1.093, which is +4.6% more cornering grip</text><text x="150.0" y="814.0" fill="#6f6a63" font-size="13" text-anchor="start" font-weight="normal" font-style="normal">demanded and survived — and only +0.34% of lap time, because two thirds of this lap is a straight where the controller has nothing to do.</text><text x="40.0" y="927.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model, closed-loop driver, long exit (393 m), grip_use swept to failure  -  [MEASURED] reference model K=0.20 deg/g, grip ceiling 0.95 g</text><text x="40.0" y="940.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[SOURCED — CITATION OUTSTANDING] ~9% skidpad ceiling, FSAE  -  [LIKELY] track width — the moment arm; conclusion re-run at +/-3%  -  RUNG 2 — ordering and direction only, not a real car (rule 15)</text><text x="40" y="962" fill="#6f6a63" font-size="11" font-style="italic">Circles mark each configuration's quickest valid lap. A lap counts as valid only if it stayed on the road AND inside the +/-12 degree tire fit; invalid laps are discarded, not plotted as fast times.</text></svg>