-anchor="middle">front share of roll stiffness</text><text x="602" y="295.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 602 295.0)">K (deg/g)</text><path d="M 680.6,366.2 L 732.1,333.3 L 783.5,300.6 L 835.0,268.1 L 886.5,235.6 L 937.9,203.1 L 989.4,170.5" fill="none" stroke="#e2614a" stroke-width="2.6"/><circle cx="680.6" cy="366.2" r="3.5" fill="#e2614a"/><circle cx="732.1" cy="333.3" r="3.5" fill="#e2614a"/><circle cx="783.5" cy="300.6" r="3.5" fill="#e2614a"/><circle cx="835.0" cy="268.1" r="3.5" fill="#e2614a"/><circle cx="886.5" cy="235.6" r="3.5" fill="#e2614a"/><circle cx="937.9" cy="203.1" r="3.5" fill="#e2614a"/><circle cx="989.4" cy="170.5" r="3.5" fill="#e2614a"/><path d="M 680.6,287.6 L 732.1,287.6 L 783.5,287.6 L 835.0,287.6 L 886.5,287.6 L 937.9,287.6 L 989.4,287.6" fill="none" stroke="#7f8ea3" stroke-width="2.2" stroke-dasharray="7 5"/><text x="1004.0" y="160.5" fill="#e2614a" font-size="11" text-anchor="end" font-weight="600" font-style="normal">four wheels</text><text x="1004.0" y="305.6" fill="#7f8ea3" font-size="11" text-anchor="end" font-weight="normal" font-style="normal">two wheels - flat</text><text x="670.0" y="436.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">the bicycle model cannot see the bar at all</text><text x="1100.0" y="122.0" fill="#e8e4dd" font-size="15" text-anchor="start" font-weight="600" font-style="normal">C - How close to lifting a wheel</text><line x1="1207" y1="140" x2="1207" y2="450" stroke="#2e2e31" stroke-width="1"/><line x1="1313" y1="140" x2="1313" y2="450" stroke="#2e2e31" stroke-width="1"/><line x1="1100" y1="218" x2="1420" y2="218" stroke="#2e2e31" stroke-width="1"/><line x1="1100" y1="295" x2="1420" y2="295" stroke="#2e2e31" stroke-width="1"/><line x1="1100" y1="372" x2="1420" y2="372" stroke="#2e2e31" stroke-width="1"/><line x1="1100" y1="450" x2="1420" y2="450" stroke="#6f6a63" stroke-width="1"/><line x1="1100" y1="140" x2="1100" y2="450" stroke="#6f6a63" stroke-width="1"/><text x="1100" y="470" fill="#6f6a63" font-size="11" text-anchor="middle">0.0</text><text x="1207" y="470" fill="#6f6a63" font-size="11" text-anchor="middle">0.6</text><text x="1313" y="470" fill="#6f6a63" font-size="11" text-anchor="middle">1.2</text><text x="1420" y="470" fill="#6f6a63" font-size="11" text-anchor="middle">1.8</text><text x="1090" y="454" fill="#6f6a63" font-size="11" text-anchor="end">0</text><text x="1090" y="376" fill="#6f6a63" font-size="11" text-anchor="end">1</text><text x="1090" y="299" fill="#6f6a63" font-size="11" text-anchor="end">2</text><text x="1090" y="222" fill="#6f6a63" font-size="11" text-anchor="end">3</text><text x="1090" y="144" fill="#6f6a63" font-size="11" text-anchor="end">4</text><text x="1260.0" y="496" fill="#e8e4dd" font-size="12.5" text-anchor="middle">lateral acceleration (g)</text><text x="1042" y="295.0" fill="#e8e4dd" font-size="12.5" text-anchor="middle" transform="rotate(-90 1042 295.0)">least-loaded wheel (kN)</text><path d="M 1115.1,224.8 L 1118.3,227.4 L 1121.8,230.2 L 1125.5,233.3 L 1129.6,236.7 L 1134.0,240.3 L 1138.7,244.1 L 1143.7,248.2 L 1148.9,252.5 L 1154.5,257.0 L 1160.4,261.8 L 1166.6,266.8 L 1173.1,272.0 L 1179.9,277.4 L 1187.0,283.1 L 1194.4,289.0 L 1202.1,295.1 L 1210.1,301.3 L 1218.4,307.8 L 1227.0,314.4 L 1236.0,321.1 L 1245.2,327.9 L 1254.7,334.7 L 1264.5,341.3" fill="none" stroke="#4aa8a0" stroke-width="2.6"/><line x1="1268.6" y1="140" x2="1268.6" y2="450" stroke="#e0a53c" stroke-width="1.4" stroke-dasharray="4 4"/><text x="1263.6" y="156.0" fill="#e0a53c" font-size="10" text-anchor="end" font-weight="normal" font-style="normal">grip limit</text><line x1="1385.5" y1="140" x2="1385.5" y2="450" stroke="#e2614a" stroke-width="1.4" stroke-dasharray="4 4"/><text x="1380.5" y="156.0" fill="#e2614a" font-size="10" text-anchor="end" font-weight="normal" font-style="normal">wheel lifts</text><line x1="1389.9" y1="140" x2="1389.9" y2="450" stroke="#8a7bd8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="1384.9" y="156.0" fill="#8a7bd8" font-size="10" text-anchor="end" font-weight="normal" font-style="normal">SSF</text><text x="1110.0" y="436.0" fill="#6f6a63" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal">the car runs out of grip long before it lifts</text><text x="100.0" y="500.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">Panel B is the Episode 5 result. Sweeping the front share of roll stiffness across the documented 0.40-0.70 range moves the understeer gradient from +0.05 to +0.40 deg/g in the four-wheel model, and by 0e+00 deg/g in the two-wheel one. Not approximated -- invisible.</text><text x="100.0" y="522.0" fill="#6f6a63" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal">But note what did NOT happen: at the nominal setup K went 0.19 -&gt; 0.22 deg/g, essentially unchanged. Both axles lose grip to transfer and the losses nearly cancel. The remaining gap to a real car's 1.8-5.5 deg/g is suspension compliance, roll camber and roll steer -- not this term.</text><text x="40.0" y="600.0" fill="#6f6a63" font-size="9.5" text-anchor="start" font-weight="normal" font-style="normal">[MEASURED] double-track model + Sedan_Pac02Tire.tir  -  offsets removed  -  m 1360 kg - track 1.505/1.495 m - h 0.460 m - roll front 55%  -  [SOURCED] RV-1 params §1, track width [LIKELY]  -  roll-share range [ASSUMED] §2, K noise floor 0.2 deg/g [SOURCED]</text><text x="40" y="622" fill="#6f6a63" font-size="11" font-style="italic">Every curve here is a Gate 1 falsification check. The four loads summing to mg, the transfer scaling with height and inverse track, and wheel lift sitting below the static stability factor are all asserted exactly.</text></svg>